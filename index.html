<!doctype html>

<canvas id="c" aria-label="Knaife game. Tap, click or press Space to throw a knife."></canvas>
<script>
'use strict';
// ---------- setup ----------
const view = document.getElementById('c');          // what the player sees (WebGL post-process)
const cv = document.createElement('canvas');         // where the game is drawn (GPU-accelerated 2D)
let GL = null, view2d = null;
let ctx = cv.getContext('2d');
const TAU = Math.PI * 2, HALF = Math.PI / 2;
const W = 420, H = 760;                 // virtual playfield
const CX = W / 2, CY = 255, R = 92;     // target
const KL = 118, EMBED = 20;             // knife length, how deep it sinks in
const KNIFE_Y = H - 150;                // tip y of the ready knife
const SPEED = 2600;                     // knife speed px/s
let dpr = 1, scale = 1, ox = 0, oy = 0;

let PIX = 0.8;
const FONT = '"Silkscreen", "Courier New", monospace';                         // virtual units per art pixel
const MAX_PIXELS = 480000, Q_SCALE = [1, 0.78, 0.6, 0.45];
let qLevel = 0, fEma = 16.7, qTimer = 0;
function resize() {
  const cw = view.clientWidth || window.innerWidth, ch = view.clientHeight || window.innerHeight;
  scale = Math.min(cw / W, ch / H);
  let p = PIX; const count = (cw / (p * scale)) * (ch / (p * scale)), budget = MAX_PIXELS * Q_SCALE[qLevel];
  if (count > budget) p *= Math.sqrt(count / budget);
  dpr = 1 / (p * scale);
  cv.width = Math.max(1, Math.round(cw * dpr)); cv.height = Math.max(1, Math.round(ch * dpr));
  view.width = cv.width; view.height = cv.height;
  if (GL) GL.gl.viewport(0, 0, view.width, view.height);
  ox = (cw - W * scale) / 2; oy = (ch - H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => Math.abs((((a - b + Math.PI) % TAU) + TAU) % TAU - Math.PI);
const easeOutBack = t => { const c = 1.70158; t -= 1; return 1 + (c + 1) * t * t * t + c * t * t; };

function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// ---------- audio ----------
let actx = null, master = null, verb = null, muted = load('knaife.muted', false);
function makeIR(a, secs) {
  const len = Math.floor(a.sampleRate * secs), b = a.createBuffer(2, len, a.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  return b;
}
function ac() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    master = actx.createDynamicsCompressor(); master.threshold.value = -14; master.ratio.value = 6;
    const mg = actx.createGain(); mg.gain.value = 0.9; master.connect(mg).connect(actx.destination);
    verb = actx.createConvolver(); verb.buffer = makeIR(actx, 2.6); verb.connect(master);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
let driveCurve = null;
function route(a, node, o) {
  let n = node;
  if (o.drive) {
    if (!driveCurve) { driveCurve = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; driveCurve[i] = Math.tanh(x * 4); } }
    const ws = a.createWaveShaper(); ws.curve = driveCurve; n.connect(ws); n = ws;
  }
  n.connect(master);
  if (o.wet) { const g = a.createGain(); g.gain.value = o.wet; n.connect(g).connect(verb); }
}
function tone(type, f0, f1, dur, vol, o = {}) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + (o.delay || 0), osc = a.createOscillator(), g = a.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f0, t); osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (o.attack || 0.003)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); route(a, g, o); osc.start(t); osc.stop(t + dur + 0.05);
}
function noise(dur, freq, q, vol, type = 'bandpass', o = {}) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + (o.delay || 0), len = Math.max(1, Math.floor(a.sampleRate * dur));
  const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  const shape = o.rise ? (i => i / len) : (i => Math.pow(1 - i / len, o.curve || 1));
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * shape(i);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q; g.gain.value = vol;
  if (o.sweepTo) f.frequency.exponentialRampToValueAtTime(o.sweepTo, t + dur);
  src.connect(f).connect(g); route(a, g, o); src.start(t);
}
const sfx = {
  whoosh() { noise(0.07, 3200, 0.8, 0.12); },
  thunk() { noise(0.09, 900, 1.2, 0.55); tone('sine', 190, 55, 0.13, 0.5); },
  clang() { tone('square', 1500, 950, 0.28, 0.08); tone('triangle', 2400, 1900, 0.4, 0.12); noise(0.12, 4500, 2, 0.35); },
  apple() { tone('sine', 620, 1250, 0.13, 0.22); noise(0.06, 2600, 1, 0.25); },
  smash() { noise(0.45, 650, 0.6, 0.7); tone('sine', 130, 40, 0.35, 0.5); },
  over() {
    tone('sawtooth', 110, 36, 2.2, 0.14, { wet: 0.8, attack: 0.05 });

  },
  impact() {

    noise(0.6, 260, 0.7, 1, 'lowpass', { drive: true, wet: 0.5, curve: 2 });
    // ringing steel: inharmonic partials into a long tail
    for (const f of [1180, 1733, 2489, 3317, 4410]) tone('sine', f, f * 0.985, 1.8, 0.07, { wet: 0.9 });
    // glass: a bright crash then a rain of tinkling shards
    noise(0.9, 4200, 0.5, 0.7, 'highpass', { wet: 0.6, curve: 2.5 });
    noise(0.35, 2500, 3, 0.35, 'bandpass', { wet: 0.4 });

    }
    // time-freeze: pitch dropping out from under you
    tone('sawtooth', 600, 45, 0.5, 0.08, { wet: 0.6 });
  },
  finale() {

    tone('sine', 140, 30, 0.8, 0.9, { drive: true, wet: 0.4 });

    }
    // slam of the losing screen
    tone('square', 98, 49, 0.5, 0.25, { delay: 0.05, drive: true, wet: 0.5 });
    tone('sawtooth', 55, 27, 2.5, 0.18, { delay: 0.25, wet: 0.9, attack: 0.08 });
    for (const [f, d] of [[392, 0.3], [311, 0.5], [233, 0.7]]) tone('triangle', f, f * 0.97, 1.4, 0.1, { delay: d, wet: 0.9 });

  rewind() {

    tone('sine', 40, 140, 0.9, 0.35, { attack: 0.8 });

  denied() { tone('square', 140, 110, 0.08, 0.06); },

  },
  playShatter() { noise(0.6, 3800, 0.5, 0.8, 'highpass', { wet: 0.6, curve: 2 }); tone('sine', 110, 30, 0.7, 0.8, { drive: true, wet: 0.5 }); for (let i = 0; i < 24; i++) { const f = rand(2500, 8500); tone('triangle', f, f, rand(0.04, 0.16), 0.06, { delay: Math.pow(Math.random(), 1.6) * 0.5, wet: 0.6 }); } },

  markerOn() { tone('sine', 880, 1760, 0.15, 0.12, { wet: 0.6 }); tone('square', 1760, 1760, 0.05, 0.05, { delay: 0.15 }); tone('square', 1760, 1760, 0.05, 0.05, { delay: 0.3 }); },
  markerHit() { tone('sine', 120, 25, 1.4, 1, { drive: true, wet: 0.5 }); noise(0.9, 900, 0.8, 0.9, 'lowpass', { drive: true, wet: 0.6, curve: 1.5 }); for (let i = 0; i < 14; i++) noise(0.04, rand(600, 2400), 3, 0.5, 'bandpass', { delay: rand(0, 0.6), wet: 0.5 }); },

// ---------- music: two tracks (main / boss) that crossfade; each plays as an <audio> element first and
// is upgraded to a decoded Web Audio buffer when possible (needed for the pitch/muffle effects) ----------
const TRACKS = { main: 'assets/music.mp3', boss: 'assets/boss.mp3', gear: 'assets/gear.mp3' };
const music = { tracks: {}, cur: 'main', rate: 1, cut: 20000, t: 0, unlocked: false };
function trackObj(name) {
  return music.tracks[name] || (music.tracks[name] = { name, el: null, node: null, buf: null, filt: null, gain: null, mix: 0, loading: false, failed: false });
}
function playTrack(tr, fromStart) {
  const a = ac();
  if (tr.buf && a) {                                      // decoded: (re)start a buffer source
    if (tr.node && !fromStart) return;
    if (tr.node) { try { tr.node.stop(); } catch (e) {} }
    const src = a.createBufferSource(); src.buffer = tr.buf; src.loop = true; src.playbackRate.value = music.rate;
    src.connect(tr.filt); src.start(0, 0); tr.node = src; return;
  }
  if (!tr.el) {
    const el = new Audio(TRACKS[tr.name]); el.loop = true; el.preload = 'auto';
    el.preservesPitch = false; el.mozPreservesPitch = false; el.webkitPreservesPitch = false; el.volume = 0; tr.el = el;
  }
  if (fromStart) { try { tr.el.currentTime = 0; } catch (e) {} }
  if (tr.el.paused) { const pr = tr.el.play(); if (pr) pr.catch(() => {}); }
  if (a && !tr.loading && !tr.failed) {
    tr.loading = true;
    fetch(TRACKS[tr.name]).then(r => { if (!r.ok) throw new Error('http'); return r.arrayBuffer(); })
      .then(b => new Promise((res, rej) => a.decodeAudioData(b, res, rej)))
      .then(buf => {
        tr.buf = buf; tr.filt = a.createBiquadFilter(); tr.filt.type = 'lowpass'; tr.filt.frequency.value = 20000; tr.filt.Q.value = 0.8;
        tr.gain = a.createGain(); tr.gain.gain.value = 0; tr.filt.connect(tr.gain).connect(a.destination);
        const src = a.createBufferSource(); src.buffer = buf; src.loop = true;
        src.connect(tr.filt); src.start(0, tr.el ? (tr.el.currentTime || 0) % buf.duration : 0); tr.node = src;
        const el = tr.el; tr.el = null;
        if (el) { let v = el.volume; const fade = setInterval(() => { v -= 0.05; if (v <= 0) { el.pause(); clearInterval(fade); } else el.volume = v; }, 40); }
      })
      .catch(() => { tr.failed = true; tr.loading = false; });
  }
}
function startMusic() { music.unlocked = true; playTrack(trackObj(music.cur), false); }
// switch tracks: the new one starts from the top, the old one fades out
function setMusic(name) {
  if (music.cur === name) return;
  music.cur = name;
  if (music.unlocked) playTrack(trackObj(name), true);
}
function unlockAudio() { const a = ac(); if (a && a.state === 'suspended') a.resume(); if (music.unlocked || (state === 'menu' && ui.screen !== 'intro') || state !== 'menu') startMusic(); }
['pointerup', 'touchend', 'click', 'keydown'].forEach(ev => window.addEventListener(ev, unlockAudio, { passive: true }));
// slow-mo drops the pitch; impacts, black & white and game over muffle it
function updateMusic(rdt) {
  if (!music.unlocked) return;
  let rate = 1, cut = 20000, vol = 0.5;
  if (state === 'menu' || state === 'tomenu') { cut = state === 'tomenu' ? 900 : ui.screen === 'main' || ui.screen === 'intro' ? 20000 : 6000; vol = 0.45; }
  else if (state === 'impact') { rate = finale ? 0.55 : 0.8; cut = 700; }
  else if (state === 'over') { rate = 0.75; cut = 900; vol = 0.35; }
  else if (state === 'rewind') { rate = rewindT < REW_SWITCH ? 0.7 : 1; cut = rewindT < REW_SWITCH ? 500 : 20000; }
  else if (fx && fx.type === 'tankintro') { rate = 1; cut = fx.t < SHOT.reveal ? 900 + 2600 * clamp(fx.t / SHOT.reveal, 0, 1) : 20000; vol = 0.6; }
  else if (fx && fx.type === 'gearintro') { rate = 1; cut = fx.t < GSHOT.reveal ? 700 + 3200 * clamp(fx.t / GSHOT.reveal, 0, 1) : 20000; vol = 0.6; }
  else if (fx) { rate = 0.55 + 0.45 * tscale; cut = fx.t < fx.freeze ? 400 : 1600 + 8000 * tscale; }
  if (zapT > 0) cut = 900;
  if (music.cur === 'boss') vol *= 1.1;
  if (music.cur === 'gear') vol *= 1.2;
  music.rate += (rate - music.rate) * Math.min(1, rdt * 6); music.cut += (cut - music.cut) * Math.min(1, rdt * 8);
  music.t -= rdt; const tick = music.t <= 0; if (tick) music.t = 0.1;
  for (const name in music.tracks) {
    const tr = music.tracks[name], on = name === music.cur;
    tr.mix += ((on ? 1 : 0) - tr.mix) * Math.min(1, rdt * (on ? 0.9 : 1.6));
    const v = (muted ? 0 : vol) * tr.mix;
    if (tr.node) {
      tr.node.playbackRate.value = music.rate; tr.filt.frequency.value = music.cut;
      tr.gain.gain.value = v;
      if (!on && tr.mix < 0.003) { try { tr.node.stop(); } catch (e) {} tr.node = null; }
    } else if (tr.el) {
      if (tick) { try { if (Math.abs(tr.el.playbackRate - music.rate) > 0.01) tr.el.playbackRate = Math.max(0.5, music.rate); } catch (e) {} }
      tr.el.volume = clamp(v * (music.cut < 2500 ? 0.55 : 1), 0, 1);
      if (!on && tr.mix < 0.003 && !tr.el.paused) tr.el.pause();

  const rays = [], web = [], n = 13;
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + rand(-0.18, 0.18), len = rand(170, 430), pts = [[0, 0]];
    for (let r = 0; r < len;) { r += rand(16, 38); const aa = a + rand(-0.1, 0.1); pts.push([Math.cos(aa) * r, Math.sin(aa) * r]); }
    rays.push({ a, len, pts });
  }
  for (const rr of [rand(28, 40), rand(65, 90), rand(115, 150), rand(180, 230)]) {
    for (let i = 0; i < n; i++) {
      const A = rays[i], B = rays[(i + 1) % n];
      if (A.len < rr || B.len < rr || Math.random() < 0.2) continue;
      const r1 = rr * rand(0.88, 1.12), r2 = rr * rand(0.88, 1.12), mid = (A.a + B.a + (i === n - 1 ? TAU : 0)) / 2, rm = (r1 + r2) / 2 * rand(0.85, 1);
      web.push([[Math.cos(A.a) * r1, Math.sin(A.a) * r1], [Math.cos(mid) * rm, Math.sin(mid) * rm], [Math.cos(B.a) * r2, Math.sin(B.a) * r2], rr]);
    }
  }
  return { rays, web };
}

function placeAngles(n, sep, avoid) {
  const out = [];
  for (let tries = 0; out.length < n && tries < 400; tries++) {
    const a = rand(TAU);
    if (avoid.concat(out).every(b => angDiff(a, b) > sep)) out.push(a);
  }
  return out;
}

function makePattern(n, boss) {
  const dir = Math.random() < 0.5 ? -1 : 1;
  const base = Math.min(1.5 + n * 0.11, 3.4) * dir;
  const pool = boss ? ['reverse', 'chaos', 'surge']
    : n < 3 ? ['steady'] : n < 6 ? ['steady', 'wave'] : ['steady', 'wave', 'reverse', 'surge'];
  const type = pool[Math.floor(rand(pool.length))];
  switch (type) {
    case 'wave':    return t => base * (0.55 + 0.65 * Math.sin(t * 1.3));
    case 'reverse': return t => base * (0.4 + 1.1 * Math.tanh(2.5 * Math.sin(t * 0.85)));
    case 'surge':   return t => base * (0.25 + 1.8 * Math.pow(Math.max(0, Math.sin(t * 1.6)), 2));
    case 'chaos':   return t => base * (0.45 + 0.95 * (Math.sin(t * 1.1) + 0.6 * Math.sin(t * 2.7 + 1)));
    default:        return () => base;
  }
}

function makeTarget(pal, pat, stuckAngles, appleAngles, boss) {
  return {
    rot: rand(TAU), t: 0, pop: 0, hit: 0, pat, pal, boss, pith: [rand(-11, 11), rand(-11, 11)], seed: Math.floor(rand(1e9)), marks: [],
    stuck: stuckAngles.map(a => ({ a })), apples: appleAngles.map(a => ({ a, cut: false })), craters: [],
  };
}

function menuTarget() {
  const stuck = placeAngles(3, 0.8, []);
  tgt = makeTarget(WOODS[0], () => 0.9, stuck, placeAngles(1, 0.6, stuck), false);
  tgt.pop = 1; tgt.landed = true;
}

function newStage() {
  if (isFirstBossSlot(stage)) firstBoss = forceBoss || (Math.random() < 0.5 ? 'tank' : 'gear');
  const boss = stage % 5 === 0;
  knivesTotal = boss ? Math.min(8 + Math.floor(stage / 5), 12) : Math.min(5 + Math.ceil(stage * 0.6), 10);
  knivesLeft = knivesTotal;
  const pre = boss ? Math.min(2 + Math.floor(stage / 10), 5) : Math.min(Math.floor((stage - 1) / 2), 4);
  const stuck = placeAngles(pre, 0.6, []);
  const nApples = Math.random() < (boss ? 0.9 : 0.55) ? (Math.random() < 0.35 ? 2 : 1) : 0;
  const appleAngles = placeAngles(nApples, 0.5, stuck);
  const tanker = boss && isTankStage(stage), gearB = boss && isGearStage(stage);
  const pal = boss ? BOSSES[Math.max(0, stage / 5 - 2) % BOSSES.length] : WOODS[Math.floor(rand(WOODS.length))];
  tgt = makeTarget(pal, tanker ? makePattern(4, false) : makePattern(stage, boss), stuck, appleAngles, boss);
  const type = tanker || gearB ? 'plain' : forceType || (stage === 1 ? 'plain' : Math.random() < 0.12 ? 'plain' : LOG_TYPES[Math.floor(rand(LOG_TYPES.length))]);
  decorate(tgt, type);
  fxp = []; pending = []; zapT = 0;
  if (abil.state === 'used' && !fx) { abil.state = 'cooldown'; abil.charge = 0; }
  const tn = type === 'plain' ? '' : TYPE_NAME[type];
  banner = boss ? { text: 'BOSS', sub: pal.name + (tn ? ' / ' + tn : ''), t: 1.8, color: '#ff5d6c' } : { text: 'STAGE ' + stage, sub: tn, t: 1.4, color: '#fff' };
  readyT = 0.3;
  state = 'play';
  waterTarget = 0;
  if (tanker) { setupTanker(tgt); knivesTotal = knivesLeft = TANK_HP; banner.t = 0; startTankIntro(tgt); }
  if (gearB) { setupGear(tgt); knivesTotal = knivesLeft = GEAR_HP; banner.t = 0; startGearIntro(tgt); }
}

function startGame() {

// ---------- actions ----------
function throwKnife() {
  if (state !== 'play' || knivesLeft <= 0 || readyT > 0.04 || abil.state === 'arming') return;
  if (stunT > 0) { sfx.denied(); return; }
  if (abil.state === 'armed' && !gearLaneBlocked()) {

    knivesLeft--; flying.push({ y: KNIFE_Y, done: false, ab: ABILITY.id }); abil.state = 'used';
    readyT = knivesLeft > 0 ? 0.12 : 0; sfx.heavyThrow(); return;
  }

  readyT = knivesLeft > 0 ? 0.12 : 0;

}

function action() {

function burst(x, y, n, colors, spd, up = 0, size = 4, life = 0.6) {

  }
}

function stepKnife(k) {
  if (k.slicing) { if (k.y < -KL - 400) k.done = true; return; }
  const t = tgt;
  if (!t) { if (k.y < -KL - 60) k.done = true; return; }
  const tip = k.y;
  if (k.ability) k.trail.push(tip);
  if (t.gear) sprocketHit(k, t);
  if (t.gear && gearChainHit(k, t)) return;
  // hit another knife?
  let hitWood = false;
  if (!k.pierce) for (const s of t.stuck) {
    if (hitWood) { hitWood = false; }
    const w = t.rot + s.a;
    if (angDiff(w, HALF) > 0.7) continue;
    const sk = R - EMBED - (s.sink || 0), bw = w + knifeTilt(s), ex = CX + Math.cos(w) * sk, ey = CY + Math.sin(w) * sk;
    const c = Math.cos(bw), sn = Math.sin(bw);
    for (let r = 8; r <= KL; r += 5) {
      const px = ex + r * c, py = ey + r * sn, d = px - CX;
      if (Math.abs(d) < 10 && py >= tip && py <= tip + KL) {
        if (s.hidden) { s.hidden = false; s.reveal = 0.001; revealFlash(t, s); for (const b of (t.f ? t.f.bushes : [])) if (b.alive && inArc(s.a, b.a, b.w + 0.05)) { b.alive = false; const [bx, by] = worldAt(t, b.a, R + 8); leafBurst(bx, by, 30, 420); } }
        if (k.wood) { k.done = true; splitWood(CX, k.y + 30, 0); knivesLeft = Math.max(0, knivesLeft - 1); score++; holdForBranches(t); floater('SPLIT -1', CX, k.y + 50, '#f2cf94'); return; }
        if (s.wood && !k.ability) {
          t.stuck.splice(t.stuck.indexOf(s), 1); splitWood(px, py, t.rot + s.a - HALF); k.woodBonus = true;
          kick(0.18, 0.05, 0.9, 0.5); shocks(px, py, 2, 90); shake = Math.max(shake, 14); floater('SPLIT X2', px, py - 20, '#f2cf94'); sfx.clank(); buzz([30, 20, 40]);
          hitWood = true; break;
        }
        if (k.ability) abilityClank(k, s);
        else if (Math.abs(d) >= GRAZE) ricochet(k, s, d, px, py);
        else fail(k);
        return;
      }
    }
  }
  if (t.tank && !k.ability && !k.wood && tankPipeHit(k, t)) return;
  if (t.gear && !k.ability && !k.wood && gearPinionHit(k, t)) return;
  if (!k.ability && !k.wood && featureHits(k, t)) return;
  for (const p of (t.pickups || []).slice()) { const w = t.rot + p.a; if (angDiff(w, HALF) < 0.2 && tip <= CY + R + 30) collectPickup(t, p, w); }
  // slice apples
  for (const ap of t.apples) {
    if (ap.cut) continue;
    const w = t.rot + ap.a;
    if (angDiff(w, HALF) < 0.2 && tip <= CY + R + 25) sliceApple(ap, w);
  }
  // stick
  if (tip <= CY + R - EMBED) {
    if (k.ability) { abilityStick(k); return; }
    if (k.wood) { woodStick(k, t); return; }
    stickNormal(k, t);
  }
}

function sliceApple(ap, w) {
  ap.cut = true; apples++; score += 2;
  const x = CX + Math.cos(w) * (R + 12), y = CY + Math.sin(w) * (R + 12);
  for (const side of [-1, 1]) debris.push({ kind: 'apple', half: side, x, y, vx: side * rand(120, 220), vy: rand(-380, -260), rot: 0, vr: side * rand(4, 8) });
  burst(x, y, 12, ['#ff4757', '#ffd1d6', '#fff2b0'], 300, 80, 4, 0.6);
  sfx.apple(); buzz(12);
}

function shatterKnife(y) {
  const cols = ['#eef2f6', '#c3ccd6', '#8e98a6', '#e2604a', '#9b2f22', '#3b3f4a'];
  for (let i = 0; i < 18; i++) {
    const along = rand(0, KL), x = CX + rand(-5, 5), py = y + along;
    const c = along < 58 ? cols[Math.floor(rand(3))] : along < 64 ? cols[5] : cols[3 + Math.floor(rand(2))];
    const a = Math.atan2(py - y + 10, x - CX + rand(-30, 30)) + rand(-0.6, 0.6), sp = rand(250, 650);
    const pts = []; for (let j = 0; j < 3; j++) { const r = rand(3, 8), ang = j / 3 * TAU + rand(-0.6, 0.6); pts.push([Math.cos(ang) * r, Math.sin(ang) * r]); }
    debris.push({ kind: 'shard', x, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 150, rot: rand(TAU), vr: rand(-20, 20), c, pts });
  }
}

function fail(k) {
  k.done = true;
  if (!k.wood) knivesLeft++;          // the hit never landed: the log keeps that hit point
  if (state !== 'play') {
    const sd = Math.random() < 0.5 ? -1 : 1;
    debris.push({ kind: 'knife', x: CX, y: k.y, vx: sd * rand(380, 560), vy: rand(-460, -260), rot: 0, vr: sd * rand(18, 26) });
    burst(CX, k.y, 16, ['#ffffff', '#ffd35c'], 380, 40, 3, 0.4); sfx.clang(); return;
  }
  shatterKnife(k.y);
  burst(CX, k.y, 18, ['#ffffff', '#fff7c2', '#ffd35c'], 420, 40, 3, 0.5);
  lives--; heartT = 1; breakHeart(lives);
  finale = lives <= 0; exploded = false; snapReq = false;
  sfx.impact(); sfx.heart();
  if (finale) sfx.finale();
  frac = finale ? null : makeFracture(); gridFrac = finale ? makeGridFracture() : null; unfrozen = false;
  for (let i = 0; i < 24; i++) {
    const a = rand(TAU), sp = rand(200, 750), pts = [];
    for (let j = 0; j < 3 + Math.floor(rand(2)); j++) { const r = rand(4, 15), ang = j / 4 * TAU + rand(-0.5, 0.5); pts.push([Math.cos(ang) * r, Math.sin(ang) * r]); }
    debris.push({ kind: 'glass', x: CX + rand(-10, 10), y: k.y + rand(-10, 10), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200, rot: rand(TAU), vr: rand(-14, 14), pts });
  }
  impactT = IMPACT_TOTAL; impactY = k.y; gray = 1; shake = finale ? 24 : 16;
  const nl = finale ? 26 : 16;
  impactLines = Array.from({ length: nl }, (_, i) => ({ a: i / nl * TAU + rand(-0.12, 0.12), r0: rand(40, 70), r1: rand(260, finale ? 900 : 520), w: rand(2, finale ? 11 : 7) }));
  state = 'impact';
  if (lives <= 0 && score > best) { best = score; newBest = true; save('knaife.best', best); }
  buzz(finale ? [80, 40, 120, 40, 200] : [40, 30, 60]);
}

function breakTarget(t, power = 1, halves = false) {
  breakFeatures(t);
  if (halves) {
    for (const side of [-1, 1]) debris.push({ kind: 'half', side, t, lrot: t.rot, x: CX, y: CY, vx: side * 230, vy: -180, rot: 0, vr: side * 1.1 });
  }
  const cuts = [0], nc = power > 1 ? 8 + Math.floor(rand(3)) : 4 + Math.floor(rand(3));
  for (let i = 1; i < nc; i++) cuts.push(i / nc * TAU + rand(-0.2, 0.2));
  cuts.push(TAU);
  if (!halves) shatterLog(t, power);
  for (let i = 0; i < 0; i++) {
    const mid = t.rot + (cuts[i] + cuts[i + 1]) / 2, s = rand(180, 360) * power;
    debris.push({ kind: 'wedge', a0: cuts[i], a1: cuts[i + 1], t, x: CX, y: CY, vx: Math.cos(mid) * s, vy: Math.sin(mid) * s - 320, rot: t.rot, vr: rand(-3, 3) * power });
  }
  for (const s of t.stuck) {
    const w = t.rot + s.a, sp = rand(260, 520) * power;
    debris.push({ kind: 'knife', x: CX + Math.cos(w) * (R - EMBED), y: CY + Math.sin(w) * (R - EMBED),
      vx: Math.cos(w) * sp, vy: Math.sin(w) * sp - 260, rot: w - HALF, vr: rand(-9, 9) });
  }
  for (const ap of t.apples) if (!ap.cut) {
    const w = t.rot + ap.a;
    debris.push({ kind: 'apple', half: 0, x: CX + Math.cos(w) * (R + 12), y: CY + Math.sin(w) * (R + 12), vx: Math.cos(w) * 300, vy: Math.sin(w) * 300 - 260, rot: w + HALF, vr: rand(-6, 6) });
  }
  burst(CX, CY, Math.round(40 * power), [t.pal.light, t.pal.dark, t.pal.bark], 520 * power, 120, 7, 0.9);
}

function clearStage() {
  const t = tgt;
  if (t.tank && !t.tank.dead) { t.tank.dead = true; startTankDeath(t); return; }
  if (t.gear && !t.gear.dead) { t.gear.dead = true; startGearDeath(t); return; }
  state = 'clearing'; clearT = CLEAR_TOTAL; clearCues = {};
  breakTarget(t);
  if (t.boss) { banner = { text: 'BOSS DOWN!', sub: '+5 bonus', t: 1.1, color: '#ffd35c' }; score += 5; }
  tgt = null; shake = 10;
  sfx.smash(); buzz(25);
}

// ---------- ability: Strong Throw (Regular Knife) ----------
const BTN = [W - 56, H - 80];
const KNIFE_MID = () => [CX, KNIFE_Y + KL / 2];
const abil = { state: 'ready', charge: 0, need: 4, swirl: null, flash: 0 };
const INVERT = 'grayscale(1) contrast(40) invert(1)', TWO_TONE = 'grayscale(1) contrast(40)';
const CANVAS_FILTER = typeof ctx.filter === 'string';
let fx = null, tscale = 1, fxFilter = null, slash = 0, ripple = null, rippleBuf = null;
let smoke = [], screenHits = [], floaters = [], rings = [];
const hash = (i, q, k) => { const v = Math.sin(i * 12.9898 + q * 78.233 + k * 37.719) * 43758.5453; return v - Math.floor(v); };

function resetAbility() {
  abil.state = 'ready'; abil.charge = 0; abil.swirl = null; abil.flash = 0;
  fx = null; tscale = 1; fxFilter = null; slash = 0; ripple = null;
  smoke = []; screenHits = []; floaters = []; rings = [];
  waterLevel = waterTarget = 0; screenDrops = []; splashFlash = 0; paints = [];
  abil.items = []; abil.birds = 0; abil.ov = 0; abil.need = ABILITY.need; gameTimers.length = 0;
  stunT = 0; stunMax = 2; abil.pauseT = 0; fxp = []; pending = []; zapT = 0; camFocus(CX, CY, 1); cam.kz = cam.kr = 0; cinema(false); aberr = zblur = 0;
}

function makeSwirl(dir, from, to, dur) {
  const parts = [];
  for (let i = 0; i < 70; i++) parts.push({ a0: rand(TAU), r0: rand(14, 48), s: 2 + Math.floor(rand(3)) * 1.5, c: Math.random() < 0.5 ? '#fff' : '#000', off: rand(0, 0.18), spin: rand(0.7, 1.3) });
  return { dir, from, to, t: 0, dur, parts };
}

function activateAbility() {
  if (state !== 'play' || abil.state !== 'ready' || knivesLeft <= 0 || stunT > 0) return;
  if (abil.pauseT > 0) { sfx.bees(); floater('JAMMED', BTN[0] - 30, BTN[1] - 50, '#ffd23f'); return; }
  if (ABILITY.mode === 'instant') {
    if (ABILITY.id === 'cook' && !(abil.birds > 0)) { floater('NO BIRDS CAUGHT', BTN[0] - 70, BTN[1] - 50, '#ffa04a'); sfx.denied(); return; }
    abil.state = 'arming'; abil.swirl = makeSwirl('in', BTN, [CX, CY], 0.6); sfx.abilityArm(); buzz(15); return;
  }
  abil.state = 'arming'; abil.swirl = makeSwirl('in', BTN, KNIFE_MID(), 0.6);
  sfx.abilityArm(); buzz(15);
}

function summonButton(x, y) {
  abil.state = 'summoning'; abil.swirl = makeSwirl('out', [x, y], BTN, 0.65);
  sfx.summon();
}

function chargeAbility() {
  if (abil.state !== 'cooldown') return;
  abil.charge++;
  if (abil.charge >= abil.need) { abil.state = 'ready'; abil.flash = 1; sfx.ready(); buzz(10); }
}

function updateAbility(rdt) {
  updateCam(rdt, !!(fx && fx.t < fx.freeze));
  updateFlights(rdt);
  for (const k in abil.pop) abil.pop[k] = Math.max(0, abil.pop[k] - rdt * 2.5);
  updatePending(rdt);
  zapT = Math.max(0, zapT - rdt);
  abil.pauseT = Math.max(0, (abil.pauseT || 0) - rdt);
  abil.flash = Math.max(0, abil.flash - rdt * 2);
  const sw = abil.swirl;
  if (sw) {
    sw.t += rdt;
    if (sw.t >= sw.dur) {
      abil.swirl = null;
      if (sw.dir === 'in' && ABILITY.mode === 'instant') { abil.state = 'used'; if (ABILITY.id === 'marker') placeMarker(); else if (ABILITY.id === 'cook') startCookFx((abil.birdCols || []).pop()); }
      else if (sw.dir === 'in') { abil.state = 'armed'; floater(ABILITY.name, CX, KNIFE_Y - 30, '#ffffff'); sfx.abilityArmed(); buzz([20, 30, 40]); kick(0.07, 0.02, 0.9, 0.5); shocks(CX, KNIFE_Y + KL / 2, 2, 60); burst(CX, KNIFE_Y + KL / 2, 40, ['#fff', '#000'], 360, 0, 4, 0.6); }
      else { abil.state = abil.charge >= abil.need ? 'ready' : 'cooldown'; }
    }
  }
  for (const f of floaters) f.t += rdt;
  floaters = floaters.filter(f => f.t < 1.1);
  for (const h of screenHits) {
    const was = h.t; h.t += rdt;
    if (was < 0 && h.t >= 0) { sfx.screenHit(); shake = Math.max(shake, 5); buzz(8); }
  }
  screenHits = screenHits.filter(h => h.t < h.life);
  if (ripple) { ripple.t += rdt; if (ripple.t > 0.42) ripple = null; }
  slash = Math.max(0, slash - rdt * 2.2);
}

function abilityThrow() {
  knivesLeft--;
  flying.push({ y: KNIFE_Y, done: false, ability: true, trail: [] });
  abil.state = 'used';
  fx = { type: 'flight', t: 0, freeze: 0 };
  state = 'fx'; readyT = 0;
  kick(0.1, 0.035, 0.8, 1.2); shake = 10; cinema(true, 0.9);
  burst(CX, KNIFE_Y + KL, 40, ['#fff', '#000', '#ccc'], 420, -100, 4, 0.7);
  sfx.heavyThrow(); sfx.riser(); sfx.heartbeat(); buzz(30);
}

function floater(text, x, y, color = '#fff') { floaters.push({ text, x, y, t: 0, color }); }
function shock(x, y, max = 0.5, size = 160, delay = 0) { rings.push({ x, y, t: -delay, max, size }); }
function shocks(x, y, n, size) { for (let i = 0; i < n; i++) shock(x, y, 0.55 + i * 0.12, size * (1 + i * 0.6), i * 0.07); }
function embers(x, y, n, spd) { burst(x, y, n, ['#ffffff', '#ffe08a', '#ffb347', '#ff7a3a'], spd, 260, 3, 1.4); }
function impactLinesFor(n, len) { return Array.from({ length: n }, (_, i) => ({ a: i / n * TAU + rand(-0.12, 0.12), r0: rand(30, 60), r1: rand(300, len), w: rand(3, 16) })); }

function addCrater(t, a) {
  const cracks = [];
  for (let i = 0; i < 6; i++) {
    const ang = Math.PI + rand(-1.1, 1.1), pts = [[R - 12, 0]];
    let x = R - 12, y = 0;
    for (let j = 0; j < 3; j++) { const l = rand(6, 13), aa = ang + rand(-0.35, 0.35); x += Math.cos(aa) * l; y += Math.sin(aa) * l; pts.push([x, y]); }
    cracks.push(pts);
  }
  t.craters.push({ a, cracks, smoke: 5, acc: 0 });
}

function drawCraters(t) {
  for (const c of t.craters) {
    ctx.save(); ctx.rotate(c.a);
    ctx.beginPath(); ctx.arc(0, 0, R - 0.5, 0, TAU); ctx.clip();
    const g = ctx.createRadialGradient(R - 8, 0, 2, R - 8, 0, 26);
    g.addColorStop(0, 'rgba(15,6,2,.95)'); g.addColorStop(0.45, 'rgba(40,18,6,.7)'); g.addColorStop(1, 'rgba(40,18,6,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(R - 8, 0, 26, 0, TAU); ctx.fill();

function endFx(next) {

// returns true while the game is frozen on an impact frame
function updateFx(rdt) {
  if (!fx) return false;
  fx.t += rdt; const t = fx.t;
  if (t < fx.freeze) { fxFilter = Math.floor(t / 0.05) % 2 ? TWO_TONE : INVERT; return true; }
  fxFilter = null;
  switch (fx.type) {
    case 'flight': {
      tscale = Math.max(0.16, 1 - t * 9);
      const kn = flying.find(k => k.ability);
      if (kn) { camFocus(CX, (kn.y + CY + R) / 2 + 30, 1.3); zblur = Math.max(zblur, 0.55); }
      if (!kn) endFx('play');                                         // safety: knife vanished
      break;
    }
    case 'hit':
      tscale = clamp(0.12 + (t - fx.freeze) / 0.8 * 0.88, 0.12, 1);
      if (t > 0.7) { camFocus(CX, CY, 1); cinema(false); }
      if (!fx.summoned && t > 0.8) { fx.summoned = true; summonButton(fx.x, fx.y); }
      if (t > 1.05) endFx('play');
      break;
    case 'clank': {
      if (!fx.exploded) { tscale = 0.08; if (t >= 0.55) explodeHitKnife(); break; }
      const e = t - fx.exploded;
      tscale = e < 0.07 ? 1 : e < 0.55 ? 0.15 : clamp(0.15 + (e - 0.55) * 2.2, 0.15, 1);
      if (e > 0.6) { camFocus(CX, CY, 1); cinema(false); }
      if (fx.k.done && !fx.summoned && e > 0.5) { fx.summoned = true; summonButton(CX, CY + R); }
      if (fx.k.done && e > 0.8) endFx(fx.lethal ? 'clearing' : 'play');
      break;
    }
    case 'shadow': updateShadowFx(t); break;
    case 'cook': updateCookFx(t); break;
    case 'carve': updateCarveFx(t); break;
    case 'tankintro': updateTankIntro(t); break;
    case 'tankdeath': updateTankDeath(t); break;
    case 'tankphase': updateTankPhase(t); break;
    case 'gearintro': updateGearIntro(t); break;
    case 'geardeath': updateGearDeath(t); break;
    case 'gearsnap': updateGearSnap(t); break;
    case 'gearphase': updateGearPhase(t); break;
    case 'catch': updateCatchFx(t); break;
    case 'slice':
      fxFilter = TWO_TONE;
      if (t < 0.75) tscale = 0.05;
      else { if (!fx.cut) doSlice(); tscale = t < 1.1 ? 0.45 : 1; }
      if (t >= 1.15) { camFocus(CX, CY, 1); cinema(false); }
      if (t >= 1.2 && !fx.rippled) { fx.rippled = true; ripple = { t: 0, x: CX, y: CY }; sfx.ripple(); }
      if (ripple) fxFilter = CANVAS_FILTER ? null : `grayscale(${(1 - ripple.t / 0.4).toFixed(3)})`;
      if (fx.rippled && !ripple) fxFilter = null;
      if (t >= 1.35 && !fx.summoned) { fx.summoned = true; summonButton(CX, CY); }
      if (t >= 1.7) endFx('clearing');
      break;
  }
  return false;
}

// ---- drawing: knife aura, contrail, wind ----
function drawKnifeAura(y, power) {
  const q = Math.floor(time * 14);
  for (let i = 0; i < 46; i++) {
    const along = hash(i, q, 1) * (KL + 20) - 10, side = (hash(i, q, 2) < 0.5 ? -1 : 1) * (8 + hash(i, q, 3) * 16);
    const sz = (2 + Math.floor(hash(i, q, 4) * 3)) * 1.5;
    ctx.fillStyle = hash(i, q, 5) < 0.5 ? '#fff' : '#000';
    ctx.globalAlpha = 0.5 + 0.5 * hash(i, q, 6);
    ctx.fillRect(Math.round((CX + side) / 1.5) * 1.5, Math.round((y + along) / 1.5) * 1.5, sz, sz);
  }
  for (let i = 0; i < 22; i++) {
    const a = time * 3.2 + i / 22 * TAU, x = CX + Math.cos(a) * 28, yy = y + KL / 2 + Math.sin(a) * 72;
    ctx.fillStyle = i % 2 ? '#fff' : '#000'; ctx.globalAlpha = 0.85 * power;
    ctx.fillRect(Math.round(x / 3) * 3, Math.round(yy / 3) * 3, 4, 4);

  ctx.globalAlpha = 1;
}

function drawPixelAura(x, y, rad, density) {
  const q = Math.floor(time * 12);
  for (let i = 0; i < 64; i++) {
    if (hash(i, q, 2) > density) continue;
    const a = i / 64 * TAU + time * 0.7, r = rad + hash(i, q, 1) * 14 + Math.sin(time * 6 + i) * 2;
    const sz = hash(i, q, 3) < 0.3 ? 6 : 3;

  }
  for (let i = 0; i < 10; i++) {                 // pixels drifting off
    const ph = (time * 0.8 + hash(i, 0, 9)) % 1, a = hash(i, 0, 10) * TAU;
    ctx.globalAlpha = 1 - ph; ctx.fillStyle = i % 2 ? '#fff' : '#000';
    ctx.fillRect(Math.round((x + Math.cos(a) * (rad + 6 + ph * 26)) / 3) * 3, Math.round((y + Math.sin(a) * (rad + 6 + ph * 26)) / 3) * 3, 3, 3);

function drawAbilityButton() {

  } else if (st === 'summoning' && sw) {

    for (let i = 0; i < abil.need; i++) {

}

function drawSwirl() {
  const sw = abil.swirl; if (!sw) return;
  for (const p of sw.parts) {
    const u = clamp((sw.t - p.off) / (sw.dur - 0.2), 0, 1); if (u <= 0 || u >= 1) continue;
    const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const cx = sw.from[0] + (sw.to[0] - sw.from[0]) * e, cy = sw.from[1] + (sw.to[1] - sw.from[1]) * e;
    const r = p.r0 * Math.sin(Math.PI * Math.max(e, 0.08)) + 2, a = p.a0 + e * TAU * 2.4 * p.spin;
    const sz = p.s * (1 - 0.4 * e);
    ctx.fillStyle = p.c; ctx.fillRect(Math.round((cx + Math.cos(a) * r) / 3) * 3, Math.round((cy + Math.sin(a) * r) / 3) * 3, sz, sz);
  }
}

// ---------- log types ----------
const LOG_TYPES = ['branches', 'holes', 'bushes', 'moss', 'bark', 'treehole', 'saw'];
const TYPE_NAME = { plain: 'PLAIN LOG', branches: 'BRANCHED LOG', holes: 'WEAK-SPOT LOG', bushes: 'OVERGROWN LOG', moss: 'MOSSY LOG', bark: 'ARMOURED LOG', treehole: 'HUNGRY HOLLOW', saw: 'SAWMILL' };
const BRANCH_SUBS = ['plain', 'swirl', 'fire', 'hive', 'wire', 'linked', 'bird'];
const BIRD_COLS = [['#2ad8ff', '#1f5fd1'], ['#ff2e45', '#a3122a'], ['#ffd23f', '#ff7a1a'], ['#9466ff', '#5c5c66']];
let forceType = null, fxp = [], zapT = 0, stunMax = 2, typeHint = 0;
const normA = a => ((a % TAU) + TAU) % TAU;
const inArc = (a, c, w) => angDiff(a, c) < w;

function decorate(t, type) {
  t.type = type;
  const F = t.f = { branches: [], links: [], holes: [], bushes: [], moss: [], plates: [], treehole: null, saws: [], arcs: [] };
  t.labelT = 3.2;
  const taken = t.stuck.map(s => s.a).concat(t.apples.map(a => a.a));
  const spot = (n, sep) => { const out = placeAngles(n, sep, taken); taken.push(...out); return out; };
  const pick = arr => arr[Math.floor(rand(arr.length))];
  if (type === 'branches') {
    const n = 2 + Math.floor(rand(3)), subs = [];
    for (let i = 0; i < n; i++) subs.push(pick(BRANCH_SUBS));
    if (subs.filter(s => s === 'linked').length === 1) subs[subs.indexOf('linked')] = 'plain';
    // linked branches come in neighbouring pairs
    const angs = [];
    let linkedLeft = subs.filter(s => s === 'linked').length;
    for (const sub of subs) {
      if (sub === 'linked' && linkedLeft >= 2 && !angs.pendingLink) {
        const a0 = spot(1, 0.9)[0];
        if (a0 === undefined) continue;
        const a1 = normA(a0 + rand(0.6, 0.8) * (Math.random() < 0.5 ? -1 : 1));
        if (taken.some(x => angDiff(x, a1) < 0.35)) { F.branches.push(makeBranch(a0, 'plain')); continue; }
        taken.push(a1);
        const i0 = F.branches.push(makeBranch(a0, 'linked')) - 1, i1 = F.branches.push(makeBranch(a1, 'linked')) - 1;
        F.links.push({ i: i0, j: i1, alive: true });
        F.branches[i0].link = F.links.length - 1; F.branches[i1].link = F.links.length - 1;
        linkedLeft -= 2;
      } else if (sub !== 'linked') {
        const a = spot(1, 0.7)[0]; if (a !== undefined) F.branches.push(makeBranch(a, sub));
      }
    }
    if (!F.branches.length) F.branches.push(makeBranch(spot(1, 0.5)[0] || 0, 'plain'));
  } else if (type === 'holes') {
    for (const a of spot(3 + Math.floor(rand(2)), 0.5)) F.holes.push({ a, w: 0.13, r: rand(7, 9), glint: rand(TAU), used: false, bug: rand(4, 9), burst: 0 });
  } else if (type === 'bushes') {
    for (const a of spot(2 + Math.floor(rand(2)), 0.8)) {
      const apple = Math.random() < 0.4;
      const b = { a, w: 0.3, apple, alive: true, seed: rand(1000), wob: 0 };
      F.bushes.push(b);
      if (!apple && Math.random() < 0.75) { t.stuck.push({ a: normA(a + rand(-0.12, 0.12)), hidden: true, sink: 72 }); b.danger = true; }
      b.glint = rand(1, 3);
    }
  } else if (type === 'moss') {
    for (const a of spot(2 + Math.floor(rand(2)), 0.9)) F.moss.push({ a, w: rand(0.32, 0.42), hp: 3, seed: rand(1000), regrow: 0, pulse: 0 });
  } else if (type === 'bark') {
    const n = 8, off = rand(TAU);
    F.plates = [];
    for (let i = 0; i < n; i++) F.plates.push({ a0: off + i / n * TAU + 0.025, a1: off + (i + 1) / n * TAU - 0.025, hp: 2, seed: rand(1000), hitT: 0 });
  } else if (type === 'treehole') {
    const a = spot(1, 0.6)[0];
    F.treehole = { a: a === undefined ? 0 : a, w: 0.22, stored: 0, blink: rand(3), gulp: 0, burp: 0, mouth: 0 };
  } else if (type === 'saw') {
    const two = stage >= 6 && Math.random() < 0.35, side = Math.random() < 0.5 ? -1 : 1;
    const time = (two ? 30 : 24) - Math.min(stage, 12) * 0.5;
    F.saws.push({ side, cut: 0, time, spin: 0, kick: 0, alive: true });
    if (two) F.saws.push({ side: -side, cut: 0, time: time * 1.15, spin: 0, kick: 0, alive: true });
  }
}

function makeBranch(a, sub) {
  const twigs = [];
  for (let i = 0, n = 1 + Math.floor(rand(3)); i < n; i++) twigs.push({ at: rand(0.35, 0.8), side: Math.random() < 0.5 ? -1 : 1, len: rand(8, 14), leaf: Math.random() < 0.8 });
  return { a, sub, alive: true, len: rand(54, 66), sway: 0, bend: rand(-7, 7), hp: sub === 'swirl' ? 2 : 1, wob: 0, twigs,
    fireT: 10, bird: sub === 'bird' ? { on: true, col: BIRD_COLS[Math.floor(rand(BIRD_COLS.length))], hop: rand(TAU) } : null, link: -1 };
}

const branchesLeft = t => t && t.f ? t.f.branches.filter(b => b.alive).length : 0;

// ---------- world helpers ----------
const worldAt = (t, a, r) => { const w = t.rot + a; return [CX + Math.cos(w) * r, CY + Math.sin(w) * r]; };
function deflect(k, side = (Math.random() < 0.5 ? -1 : 1), speed = 1) {
  k.done = true;
  debris.push({ kind: 'knife', x: CX, y: k.y, vx: side * rand(420, 620) * speed, vy: rand(-480, -260), rot: 0, vr: side * rand(20, 30) });
  knivesLeft++;
}

// ---------- in-flight hits on features (normal knives only) ----------
function featureHits(k, t) {
  const F = t.f; if (!F) return false;
  const tip = k.y, a = normA(HALF - t.rot);
  // chain between linked branches
  for (const L of F.links) {
    if (!L.alive) continue;
    const A = F.branches[L.i], B = F.branches[L.j];
    const mid = normA(A.a + Math.atan2(Math.sin(B.a - A.a), Math.cos(B.a - A.a)) / 2), half = angDiff(A.a, B.a) / 2;
    if (inArc(a, mid, half - 0.06) && tip <= CY + R + 46) { breakLink(t, L); deflect(k, Math.random() < 0.5 ? -1 : 1, 0.8); return true; }
  }
  for (const b of F.branches) {
    if (!b.alive || !inArc(a, b.a, 0.13) || tip > CY + R + b.len) continue;
    if (b.bird && b.bird.on) { killBird(t, b); k.done = true; return true; }
    if (b.link >= 0 && F.links[b.link].alive) { b.wob = 1; sfx.ping(); floater('LOCKED', CX, CY + R + 70, '#c3c3ca'); deflect(k); return true; }
    if (b.sub === 'swirl' && b.hp > 1) { b.hp--; b.wob = 1.4; sfx.boing(); floater('BOING', CX, CY + R + 70, '#ffd23f'); deflect(k, Math.random() < 0.5 ? -1 : 1, 1.2); return true; }

  }

// ---------- rim hits: where the knife lands decides what happens ----------
function stickNormal(k, t) {

  k.done = true; chargeAbility();
  const s = { a, wob: 0.09 }; t.stuck.push(s); addMark(t, a);
  if (t.gear) {
    const T = t.gear, bi = Math.round(normA(a) / TAU * GEAR_TEETH) % GEAR_TEETH;

    if (!T.lost.has(bi) && T.lost.size < GEAR_TEETH - 6) { T.lost.add(bi); debris.push({ kind: 'tooth', x: CX + rand(-6, 6), y: CY + R + 6, vx: rand(-220, 220), vy: rand(-380, -200), rot: rand(TAU), vr: rand(-20, 20) }); }
  }
  if (t.tank) { s.detach = tankDetachTime(t); t.tank.dents.push(a); if (t.tank.dents.length > 24) t.tank.dents.shift(); sfx.clank(); }
  t.hit = 1; score++;

  for (let i = 0; i < 5; i++) smoke.push({ x: CX + rand(-6, 6), y: CY + R, vx: rand(-50, 50), vy: rand(10, 60), r: rand(2, 4), life: rand(0.4, 0.8), max: 0.8, g: 120, c: t.pal.light });
  sfx.thunk(); buzz(8);
  let soaked = false, dmg = 1;
  if (F) {

    if (m) { soaked = true; hitMoss(t, m); }
    else { const h = F.holes.find(h => !h.used && inArc(a, h.a, h.w)); if (h) { dmg = 2; h.used = true; holeHit(t, h); } }
  }
  let marked = false;
  if (!soaked) {

    if (t.marker && !t.marker.dead && inArc(a, t.marker.a, 0.14)) { marked = true; dmg = Math.max(dmg, 4); }
    if (abil.ov > 0) { dmg *= 2; abil.ov--; floater('OVERVOLT X2', CX + 50, CY + R + 40, '#2ad8ff'); burst(CX, CY + R, 30, ['#2ad8ff', '#ffffff'], 400, 0, 3, 0.5); sfx.zap(0.4); }

    else { fx = { type: 'hit', t: 0, freeze: 0.25, x: CX, y: CY + R, lines: impactLinesFor(26, 1000) }; state = 'fx'; }

function holdForBranches(t) {

// ---------- per-frame feature logic ----------
let sawHum = 0;
function updateFeatures(t, dt) {
  const F = t.f; if (!F) return;
  typeHint = Math.max(0, typeHint - dt);
  const live = state === 'play' || state === 'fx';
  t.labelT = Math.max(0, (t.labelT || 0) - dt);
  const omega = t.pat(t.t);
  for (const b of F.branches) {
    b.sway += (-omega * 0.07 - b.sway) * Math.min(1, dt * 3);
    b.wob = Math.max(b.wob - dt * 2.5, t.hit * 0.25);
    if (b.bird) b.bird.hop += dt;
    if (b.alive && b.sub === 'fire' && live) {
      b.fireT -= dt;
      if (Math.random() < dt * 30) { const [x, y] = worldAt(t, b.a, R + rand(10, b.len)); smoke.push({ x, y, vx: rand(-20, 20), vy: rand(-80, -40), r: rand(2, 4), life: 1, max: 1.2, g: 70 }); }
      if (b.fireT <= 0) { const [x, y] = worldAt(t, b.a, R); embers(x, y, 80, 600); sfx.whoosh(); loseGame('THE LOG CAUGHT FIRE'); return; }
    }
  }
  for (const z of F.arcs) z.life -= dt;
  F.arcs = F.arcs.filter(z => z.life > 0);
  for (const b of F.bushes) { b.wob = Math.max(0, b.wob - dt); b.glint -= dt; if (b.glint < -0.25) b.glint = rand(1.2, 2.8); }
  for (const h of F.holes) { h.bug -= dt; if (h.bug < -1.6) h.bug = rand(5, 10); h.burst = Math.max(0, h.burst - dt * 2); }
  for (const m of F.moss) {
    m.pulse = Math.max(0, m.pulse - dt * 2);
    if (m.hp > 0 && m.hp < 3 && live) { m.regrow += dt; if (m.regrow > 6) { m.regrow = 0; m.hp++; m.pulse = 1; const [x, y] = worldAt(t, m.a, R); leafBurst(x, y, 6, 120); floater('REGROWN', x, y - 24, '#b6e05a'); sfx.squish(); } }
  }
  for (const pl of F.plates) pl.hitT = Math.max(0, pl.hitT - dt * 3);
  if (F.treehole) {
    const H = F.treehole;
    H.gulp = Math.max(0, H.gulp - dt * 3); H.blink += dt; H.mouth = 0.5 + 0.5 * Math.sin(time * 2.2);
    if (H.burp > 0) {
      H.burp -= dt;
      if (H.burp <= 0) {
        H.burp = 0; H.gulp = 1.4;
        const a = normA(H.a + (Math.random() < 0.5 ? -1 : 1) * rand(0.6, 1.4));
        if (!t.stuck.some(s => angDiff(s.a, a) < 0.2)) { t.stuck.push({ a, wob: 0.15 }); addMark(t, a); }
        const [x, y] = worldAt(t, H.a, R - 20);
        for (let i = 0; i < 14; i++) smoke.push({ x, y, vx: rand(-90, 90), vy: rand(-90, 20), r: rand(3, 7), life: 1, max: 1, g: 90 });
        floater('BURP! KNIFE SPAT OUT', CX, CY - R - 30, '#ff7a1a'); sfx.burp(); shake = Math.max(shake, 8);
      }
    }
  }
  for (const s of t.stuck) if (s.reveal) { s.reveal = Math.max(0, s.reveal - dt * 4); s.sink = 72 * s.reveal * s.reveal; }

// ---------- update ----------
function update(dt) {
  time += dt;
  updateMusic(dt);
  if (state === 'tomenu') { updateToMenu(dt); return; }
  if (state === 'menu') { updateMenu(dt); return; }
  heartT = Math.max(0, heartT - dt * 1.5);
  updateAbility(dt);
  if (updateFx(dt)) return;                               // ability hit-stop freeze
  dt *= tscale;
  if (state === 'impact') {
    impactT = Math.max(0, impactT - dt);
    const el = IMPACT_TOTAL - impactT;
    if (el < hitstopLen()) return;                         // frozen impact frame
    if (finale) {
      if (!exploded) {
        exploded = true; shake = 30;
        if (tgt) { breakTarget(tgt, 2.2); tgt = null; }
        for (const f of flying) shatterKnife(f.y); flying = [];
        burst(CX, impactY, 50, ['#ffffff', '#dddddd'], 900, 0, 6, 0.8);
      }
      dt *= 0.25;                                          // heavy slow-mo until the screen breaks
      if (el >= FINAL_SNAP && !snapReq) { snapReq = true; shake = 0; }
    }
    else if (el < HITSTOP + 0.3) dt *= 0.3;                // slow-mo
    gray = finale || el < GRAY_HOLD ? 1 : clamp(1 - (el - GRAY_HOLD) / (IMPACT_TOTAL - GRAY_HOLD), 0, 1);
    if (!finale && el >= GRAY_HOLD && !unfrozen) { unfrozen = true; sfx.unfreeze(); }
    if (impactT <= 0) {
      gray = 0; frac = null;
      if (lives > 0) state = 'play';
      else { state = 'dying'; overT = 0.4; }
    }
  }
  const t = tgt;
  if (t && state !== 'rewind') {
    t.t += dt;
    t.pop = Math.min(1, t.pop + dt / (t.smooth ? 0.9 : 0.75));
    if (!t.landed && t.pop > 0.37) {
      t.landed = true; shake = Math.max(shake, 9); shock(CX, CY + R, 0.45, 160);
      for (let i = 0; i < 22; i++) { const sd = i % 2 ? 1 : -1; smoke.push({ x: CX + sd * rand(10, R), y: CY + R + rand(-4, 6), vx: sd * rand(60, 220), vy: rand(-60, -10), r: rand(5, 10), life: rand(0.7, 1.3), max: 1.3, g: 110, c: '#8d8d97' }); }
      for (let i = 0; i < 14; i++) splinter(CX + rand(-R, R), CY + R, t, 300);
      sfx.land();
    }
    t.rot += t.pat(t.t) * dt;
    t.hit = Math.max(0, t.hit - dt * 7);
    for (const k of t.stuck) if (k.wob) k.wob *= Math.exp(-dt * 4);
    emitSmoke(t, dt);
    updateFeatures(t, dt);
    updateChain(t, dt);
    if (t.tank) updateTank(t, dt);
    if (t.gear) updateGear(t, dt);
    if (t.marker && t.marker.dead) { t.marker.dead += dt * 2; if (t.marker.dead > 1) t.marker = null; }
  }
  updateSmoke(dt);
  if (!tgt) waterTarget = 0;
  updateWater(dt);
  updateFxp(dt);
  updateGameTimers(dt);
  readyT = Math.max(0, readyT - dt);

  for (const k of flying) {
    if (k.hold) continue;
    let move = SPEED * dt * (k.fast || 1);
    while (move > 0 && !k.done && !k.hold) { const st = Math.min(8, move); move -= st; k.y -= st; stepKnife(k); }
  }
  flying = flying.filter(k => !k.done);
  if (state === 'play' && knivesLeft === 0 && flying.length === 0 && branchesLeft(tgt) === 0) clearStage();

  for (const d of debris) { if (d.kind === 'shard' || d.kind === 'glass') d.vx *= 1 - dt * 1.5; d.x += d.vx * dt; d.y += d.vy * dt; d.vy += (d.kind === 'half' ? 700 : 1500) * dt; d.rot += d.vr * dt; }
  for (const r of rings) r.t += dt;
  rings = rings.filter(r => r.t < r.max);
  debris = debris.filter(d => d.y < H + 220 && d.x > -220 && d.x < W + 220);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; p.rot += p.vr * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);

  shake = Math.max(0, shake - dt * 40);
  banner.t = Math.max(0, banner.t - dt);

  if (state === 'dying') { overT -= dt; if (overT <= 0) { state = 'over'; overT = 0.6; sfx.over(); } }
  else if (state === 'over') { overT = Math.max(0, overT - dt); overAge += dt; }
  else if (state === 'rewind') {
    rewindT += dt;
    if (!rewFlashed && rewindT >= REW_FLASH) { rewFlashed = true; pieces = []; sfx.flash(); buzz(20); }
    if (!rewSwitched && rewindT >= REW_SWITCH) { rewSwitched = true; makePopup(); sfx.lightSwitch(); shake = 6; buzz([30, 50, 15, 40, 15]); }
    if (rewindT >= REW_BREAK) { shatterPopup(); sfx.popBreak(); shake = 10; state = 'play'; readyT = 0.25; buzz(25); }
  }
  else if (state === 'clearing') {
    clearT -= dt;
    const el = CLEAR_TOTAL - clearT;
    if (el > CLEAR_HOLD && !clearCues.flick) { clearCues.flick = true; flickSeq = makeFlickerSeq(CLEAR_FLICK); flickIdx = -1; sfx.ballast(); }
    if (el > CLEAR_HOLD + CLEAR_FLICK && !clearCues.off) { clearCues.off = true; offAt = time; sfx.lightsOff(); debris = []; parts = []; smoke = []; }
    if (clearT <= 0) { stage++; newStage(); if (!tgt.tank && !tgt.gear) { tgt.smooth = true; tgt.landed = true; } lightIn = LIGHT_IN; offAt = -1; sfx.breaker(); shake = Math.max(shake, 10); kick(0.06, 0.02, 0.6); buzz([60, 20, 30]); }
  }
  lightIn = Math.max(0, lightIn - dt);
  updatePieces(dt);
}

function drawFracture() {

}
function drawFracAt(frac, x, y, p, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = alpha;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // glassy panes in the innermost ring
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  frac.web.forEach((w, i) => { if (w[3] < 100 && i % 2 === 0) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(...w[0]); ctx.lineTo(...w[1]); ctx.lineTo(...w[2]); ctx.closePath(); ctx.fill(); } });
  const path = () => {
    ctx.beginPath();
    for (const r of frac.rays) {
      const n = Math.max(1, Math.floor(r.pts.length * p));
      ctx.moveTo(0, 0); for (let i = 1; i < n; i++) ctx.lineTo(...r.pts[i]);
    }
    if (p >= 1) for (const w of frac.web) { ctx.moveTo(...w[0]); ctx.lineTo(...w[1]); ctx.lineTo(...w[2]); }
  };
  path(); ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 4; ctx.stroke();
  path(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; ctx.stroke();
  // crushed point of impact
  ctx.fillStyle = '#fff'; ctx.beginPath();
  for (let i = 0; i < 16; i++) { const r = i % 2 ? 5 : 15, a = i / 16 * TAU; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function gridPath(g, upto) {
  ctx.beginPath();
  for (let i = 0; i < g.n; i++) {
    const col = g.V[i], nxt = g.V[(i + 1) % g.n];
    ctx.moveTo(0, 0);
    for (let j = 1; j < col.length && g.radii[j - 1] <= upto; j++) ctx.lineTo(...col[j]);
    for (let j = 1; j < col.length && g.radii[j] <= upto; j++) { ctx.moveTo(...col[j]); ctx.lineTo(...nxt[j]); }
  }
}

function drawGridFracture() {
  if (!gridFrac || state !== 'impact') return;
  const el = IMPACT_TOTAL - impactT;
  const p = clamp((el - 0.02) / (FINAL_SNAP - 0.08), 0, 1), upto = 1500 * (1 - Math.pow(1 - p, 3));
  ctx.save(); ctx.translate(CX, impactY); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  gridPath(gridFrac, upto); ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.lineWidth = 5; ctx.stroke();
  gridPath(gridFrac, upto); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath();
  for (let i = 0; i < 20; i++) { const r = i % 2 ? 7 : 22, a = i / 20 * TAU; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// freeze the current two-tone frame and cut it into glass pieces along the grid cracks
function thresholdSnapshot() {
  const w = cv.width, h = cv.height;
  let img;
  try { img = ctx.getImageData(0, 0, w, h); } catch (e) { return null; }
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) { const v = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) > 128 ? 255 : 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  const snap = document.createElement('canvas'); snap.width = w; snap.height = h; snap.getContext('2d').putImageData(img, 0, 0);
  return snap;
}

// cut an image (drawn at device sx,sy) into pieces along grid g centred at device gcx,gcy (k = device px per grid unit)
function cutPieces(src, sx, sy, g, gcx, gcy, k, edge) {
  const out = [], toDev = p => [gcx + p[0] * k, gcy + p[1] * k];
  for (let j = 0; j < g.radii.length - 1; j++) for (let i = 0; i < g.n; i++) {
    const A = g.V[i], B = g.V[(i + 1) % g.n];
    const poly = (j === 0 ? [A[0], A[1], B[1]] : [A[j], A[j + 1], B[j + 1], B[j]]).map(toDev);
    const xs = poly.map(p => p[0]), ys = poly.map(p => p[1]);
    const bx = Math.max(sx, Math.floor(Math.min(...xs))), by = Math.max(sy, Math.floor(Math.min(...ys)));
    const bw = Math.min(sx + src.width, Math.ceil(Math.max(...xs))) - bx, bh = Math.min(sy + src.height, Math.ceil(Math.max(...ys))) - by;
    if (bw <= 1 || bh <= 1) continue;
    const c = document.createElement('canvas'); c.width = bw; c.height = bh;
    const cx2 = c.getContext('2d');
    cx2.translate(-bx, -by); cx2.beginPath(); poly.forEach((p, q) => cx2[q ? 'lineTo' : 'moveTo'](p[0], p[1])); cx2.closePath();
    cx2.save(); cx2.clip(); cx2.drawImage(src, bx - sx, by - sy, bw, bh, bx, by, bw, bh); cx2.restore();
    cx2.strokeStyle = '#fff'; cx2.lineWidth = edge; cx2.stroke();
    const mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
    out.push({ c, j, ox: bx - mx, oy: by - my, x: mx, y: my, hx: mx, hy: my, r: Math.hypot(bw, bh) / 2, rot: 0, vr: 0, vx: 0, vy: 0, age: 0, delay: 0 });
  }
  return out;
}

function launch(pcs, gcx, gcy, k, lo, hi, stagger) {
  for (const p of pcs) {
    let dx = p.x - gcx, dy = p.y - gcy; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    const sp = rand(lo, hi) * k;
    p.vx = dx * sp + rand(-80, 80) * k; p.vy = dy * sp - rand(150, 450) * k;
    p.vr = rand(-5, 5) * (p.j < 3 ? 2 : 1); p.delay = p.j * stagger;
  }
}

function updatePieces(dt) {
  const g = 2600 * dpr * scale;
  for (const p of pieces) {
    p.age += dt;
    if (p.home || p.age < p.delay) continue;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += g * dt; p.rot += p.vr * dt;
  }
  pieces = pieces.filter(p => p.home || (p.y - p.r < cv.height * 1.2 && p.x + p.r > -cv.width * 0.2 && p.x - p.r < cv.width * 1.2));
}

function shatterScreen() {
  const snap = thresholdSnapshot();
  if (!snap) { pieces = []; return; }
  const k = dpr * scale, icx = dpr * (ox + CX * scale), icy = dpr * (oy + impactY * scale);
  pieces = cutPieces(snap, 0, 0, gridFrac, icx, icy, k, 2.5 * dpr);
  launch(pieces, icx, icy, k, 350, 900, 0.025);
}

let rewindFrom = null;
function startRewind(from = null) {
  rewindFrom = from;
  startGame();
  state = 'rewind'; rewindT = 0; needRewindSnap = true; rewFlashed = false; rewSwitched = false; popCanvas = null;
  banner.t = 0; tgt.pop = 1; readyT = 0; pieces = [];
  sfx.rewind();
}

function buildRewindPieces() {
  const snap = thresholdSnapshot();
  if (!snap) { pieces = []; return; }
  const k = dpr * scale, gcx = dpr * (ox + CX * scale), gcy = dpr * (oy + CY * scale);
  pieces = cutPieces(snap, 0, 0, makeGridFracture(), gcx, gcy, k, 2.5 * dpr);
  const far = Math.max(cv.width, cv.height);
  for (const p of pieces) {
    let dx = p.hx - gcx, dy = p.hy - gcy; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    const dist = far * rand(0.7, 1.2);
    p.home = true; p.sx = p.hx + dx * dist + rand(-0.15, 0.15) * far; p.sy = p.hy + dy * dist + rand(0, 0.3) * far;
    p.rot0 = rand(-6, 6); p.dur = 0.42; p.delay = (8 - p.j) * 0.045 + rand(0, 0.05);
  }
  if (rewindFrom) {
    const fr = rewindFrom.frags;
    pieces.forEach((p, i) => {
      const f = fr[i % fr.length], [vx, vy, r] = fragPose(f, 1);
      p.sx = dpr * (ox + vx * scale); p.sy = dpr * (oy + vy * scale); p.rot0 = r + rand(-1.2, 1.2);
      p.s0 = Math.min(1, (f.w * dpr * scale) / Math.max(8, p.c.width)) * 0.9;
      p.ease = 'inout'; p.dur = 0.72; p.delay = rand(0, 0.14); p.frag = f;
    });

  }
}

const POP_W = 260, POP_H = 104;
function makePopup() {

function shatterPopup() {

    debris.push({ kind: 'glass', x: CX + rand(-60, 60), y: 455 + rand(-20, 20), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200, rot: rand(TAU), vr: rand(-14, 14), pts });

function drawRewind() {
  const t = rewindT;
  if (needRewindSnap) { drawScene(); buildRewindPieces(); needRewindSnap = false; }
  let f;
  if (t < REW_FLASH) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
    for (const p of pieces) {
      const u = clamp((t - p.delay) / p.dur, 0, 1);
      const e = p.ease === 'inout' ? (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2) : 1 - Math.pow(1 - u, 3);
      ctx.save(); ctx.translate(p.sx + (p.hx - p.sx) * e, p.sy + (p.hy - p.sy) * e); ctx.rotate(p.rot0 * (1 - e));
      if (p.ease === 'inout') {
        const sc = p.s0 + (1 - p.s0) * e, mix = clamp(u * 2.2, 0, 1); ctx.scale(sc, sc);
        ctx.globalAlpha = mix; ctx.drawImage(p.c, p.ox, p.oy);
        if (mix < 1) { const f = p.frag, k = dpr * scale / sc; ctx.globalAlpha = 1 - mix; ctx.drawImage(f.c, -f.w * k / 2, -f.h * k / 2, f.w * k, f.h * k); }
      } else ctx.drawImage(p.c, p.ox, p.oy);
      ctx.restore();
    }
    f = 'grayscale(1)';
  } else {

    const s = t - REW_SWITCH;
    const lit = s >= 0 && !(s >= 0.05 && s < 0.11) && !(s >= 0.15 && s < 0.19);   // fluorescent flicker on
    f = lit ? 'none' : 'grayscale(1) contrast(40)';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const fa = clamp(1 - (t - REW_FLASH) / 0.3, 0, 1);
    if (fa > 0) { ctx.fillStyle = `rgba(255,255,255,${fa})`; ctx.fillRect(0, 0, cv.width, cv.height); }
    if (s >= 0 && popCanvas) {
      const u = clamp(s / 0.2, 0, 1), sc = 0.4 + 0.6 * easeOutBack(u), jit = s < 0.3 ? (0.3 - s) * 20 * dpr : 0;
      ctx.save(); ctx.translate(popPos[0] + rand(-jit, jit), popPos[1] + rand(-jit, jit)); ctx.scale(sc, sc);
      ctx.drawImage(popCanvas, -popCanvas.width / 2, -popCanvas.height / 2); ctx.restore();
    }
  }

}

function drawPieces() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);

// losing screen: pure black & white, elements slam in fast
function drawOverScreen() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  const t = overAge;
  // spinning speed rays
  ctx.save(); ctx.translate(CX, 300); ctx.rotate(t * 0.15); ctx.fillStyle = 'rgba(255,255,255,.07)';
  for (let i = 0; i < 18; i++) { ctx.rotate(TAU / 18); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(900, -50); ctx.lineTo(900, 50); ctx.closePath(); ctx.fill(); }
  ctx.restore();

  if (gridFrac) { ctx.save(); ctx.translate(CX, impactY); gridPath(gridFrac, 1500); ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore(); }
  const slam = (delay, y, fn) => {
    const u = clamp((t - delay) / 0.16, 0, 1); if (u <= 0) return;
    const sc = 1 + 1.4 * Math.pow(1 - u, 3);
    ctx.save(); ctx.globalAlpha = u; ctx.translate(CX, y); ctx.scale(sc, sc); ctx.translate(-CX, -y); fn(); ctx.restore();
  };

    ctx.fillStyle = '#fff'; ctx.save(); ctx.translate(CX, 212); ctx.rotate(-0.06); ctx.fillRect(-W, -34, W * 2, 68); ctx.restore();
    ctx.save(); ctx.translate(CX, 212); ctx.rotate(-0.06); text('OUT OF LIVES', 0, 2, 44, '#000', 'center', 900); ctx.restore();
  });
  slam(0.18, 278, () => {
    for (let i = 0; i < MAX_LIVES; i++) ctx.drawImage(HEART_IMG.white, CX + (i - 1) * 56 - 22, 274 - 26, 44, 53);
  });
  slam(0.26, 352, () => {
    const shown = Math.round(score * clamp((t - 0.26) / 0.45, 0, 1));
    text(String(shown), CX, 352, 96, '#fff', 'center', 900);
  });
  slam(0.36, 414, () => text(`STAGE ${stage}  /  ${apples} APPLE${apples === 1 ? '' : 'S'}`, CX, 414, 16, '#fff', 'center', 700));
  slam(0.44, 457, () => {

    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(CX - 80, 606, 160, 36); text('MAIN MENU', CX, 625, 14, '#fff', 'center', 700);
  }
}

function drawMenuBackdrop() {

  const SP = 110, off = (time * 22) % SP, frames = [];
  const flick = ui.flick;
  for (let k = 0; k < 13; k++) {
    const z = k * SP - off + 30, s = f / (f + z);
    frames.push({ z, s, cx: vx + (CX - vx) * s, cy: vy + (H / 2 - vy) * s * 0.9, hw: 300 * s, hh: 430 * s, k: k + Math.floor(time * 22 / SP) });
  }
  // far to near: walls, floor, ceiling
  for (let i = frames.length - 2; i >= 0; i--) {
    const A = frames[i + 1], B = frames[i], lum = Math.floor(10 + 36 * B.s * flick);
    const poly = (pts, col) => { ctx.fillStyle = col; ctx.beginPath(); pts.forEach(([x, y], j) => ctx[j ? 'lineTo' : 'moveTo'](x, y)); ctx.closePath(); ctx.fill(); };
    const wall = `rgb(${lum + 8},${lum + 2},${lum - 2})`, side = `rgb(${lum},${lum - 3},${lum - 6})`;

    poly([[A.cx + A.hw, A.cy - A.hh], [B.cx + B.hw, B.cy - B.hh], [B.cx + B.hw, B.cy + B.hh], [A.cx + A.hw, A.cy + A.hh]], side);
    poly([[A.cx - A.hw, A.cy + A.hh], [A.cx + A.hw, A.cy + A.hh], [B.cx + B.hw, B.cy + B.hh], [B.cx - B.hw, B.cy + B.hh]], `rgb(${lum - 4},${lum - 6},${lum - 8})`);
    poly([[A.cx - A.hw, A.cy - A.hh], [A.cx + A.hw, A.cy - A.hh], [B.cx + B.hw, B.cy - B.hh], [B.cx - B.hw, B.cy - B.hh]], `rgb(${Math.max(0, lum - 10)},${Math.max(0, lum - 10)},${Math.max(0, lum - 8)})`);

function drawDemoLog(t, x, y, s) {

// ---------- update & input ----------
function updateMenu(dt) {

  // hover targets

  parts = parts.filter(p => p.life > 0);

}
function go(to, panel) {
  if (ui.trans) return;
  ui.trans = { t: 0, to, panel, shatter: to === 'play' };
  if (to === 'play') { if (!ui.hasPointer && !hitList.some(h => h.id === 'play')) ui.trans.shatter = false; sfx.playShatter(); buzz([30, 20, 60]); }
  else sfx.menuSelect();

}
// cut the PLAY slab (as rendered) into fragments, in virtual coords
function captureSlabFrags() {
  const w = ui.trans.wantFrags; ui.trans.wantFrags = null;
  const hit = hitList.find(h => h.id === 'play'); if (!hit) { ui.trans.frags = []; return; }
  const q = hit.q.map(([x, y]) => [dpr * (ox + x * scale), dpr * (oy + y * scale)]);
  const src = document.createElement('canvas'); src.width = cv.width; src.height = cv.height;
  const g = src.getContext('2d'); g.beginPath(); q.forEach(([x, y], i) => g[i ? 'lineTo' : 'moveTo'](x, y)); g.closePath(); g.clip(); g.drawImage(cv, 0, 0);

function fragPose(f, t) {

}
function drawSlabFrags() {

}
function menuDown(x, y) {

    }

  } else {
    if (hit.id === 'prev' || hit.id === 'next') flipTo(ui.idx + (hit.id === 'next' ? 1 : -1));

function flipTo(i) { if (ui.flip > 0) return; ui.pendingIdx = (i + ENTRIES.length) % ENTRIES.length; ui.flip = 0.001; sfx.cardFlip(); }
function menuMove(x, y) {
  ui.mx = x; ui.my = y; ui.hasPointer = true;
  if (ui.drag) { const d = x - ui.drag.last; ui.spin += d * 0.03; ui.spinV = d * 2; ui.drag.last = x; }
}
function menuUp() { ui.drag = null; }
// screen -> fragments (virtual coords), cut around a point
function captureScreenFrags(vx, vy) {
  const src = document.createElement('canvas'); src.width = cv.width; src.height = cv.height; src.getContext('2d').drawImage(cv, 0, 0);
  const k = dpr * scale, cx = dpr * (ox + vx * scale), cy = dpr * (oy + vy * scale);
  return cutPieces(src, 0, 0, makeGrid(9, [0, 45, 110, 200, 320, 480, 720, 1100]), cx, cy, k, 1.2 * dpr).map(p => {
    const px = (p.x / dpr - ox) / scale, py = (p.y / dpr - oy) / scale; let dx = px - vx, dy = py - vy; const dl = Math.hypot(dx, dy) || 1;
    return { c: p.c, vx: px, vy: py, ow: p.ox / k, oh: p.oy / k, w: p.c.width / k, h: p.c.height / k, dx: dx / dl, dy: dy / dl, rot: rand(-0.7, 0.7), dist: rand(14, 40) };

let toMenu = null;
function startToMenu(x, y) {
  toMenu = { t: 0, frags: captureScreenFrags(x, y), x, y, pieces: null, built: false };
  state = 'tomenu'; view.style.filter = 'none';
  shock(x, y, 0.45, 160); sfx.playShatter(); buzz([30, 20, 60]);
}
function buildMenuPieces() {
  enterMenu(); state = 'tomenu'; ui.enter = 2;
  drawMenuScreen(); pixelate();
  const snap = document.createElement('canvas'); snap.width = cv.width; snap.height = cv.height; snap.getContext('2d').drawImage(cv, 0, 0);
  const k = dpr * scale, gcx = dpr * (ox + CX * scale), gcy = dpr * (oy + 420 * scale);
  const pcs = cutPieces(snap, 0, 0, makeGrid(9, [0, 45, 110, 200, 320, 480, 720, 1100]), gcx, gcy, k, 1.4 * dpr), fr = toMenu.frags;

function updateToMenu(dt) {

  for (const r of rings) r.t += dt; rings = rings.filter(r => r.t < r.max);

}
function drawToMenu() {

  for (const p of toMenu.pieces) {
    const u = clamp((t - p.delay) / p.dur, 0, 1), e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    ctx.save(); ctx.translate(p.sx + (p.hx - p.sx) * e, p.sy + (p.hy - p.sy) * e); ctx.rotate(p.rot0 * (1 - e));

function enterMenu(intro = false) {

  state = 'menu'; ui.screen = intro ? 'intro' : 'main'; view.style.cursor = 'none'; ui.enter = 0; ui.trans = null; ui.hov = {};

// ---------- input ----------
function toVirtual(e) { const b = view.getBoundingClientRect(); return [(e.clientX - b.left - ox) / scale, (e.clientY - b.top - oy) / scale]; }
view.addEventListener('pointerdown', e => {
  e.preventDefault();
  const [x, y] = toVirtual(e);
  if (Math.hypot(x - (W - 34), y - 34) < 24) { muted = !muted; save('knaife.muted', muted); ac(); return; }
  if (state === 'menu') { ac(); menuDown(x, y); return; }
  if (state === 'over' && overT <= 0 && y > 600 && y < 650 && Math.abs(x - CX) < 90) { startToMenu(x, y); return; }
  if (fx && fx.type === 'tankintro') { skipTankIntro(); return; }
  if (fx && fx.type === 'gearintro') { skipGearIntro(); return; }

view.addEventListener('pointermove', e => { const [x, y] = toVirtual(e); if (state === 'menu') menuMove(x, y); });
window.addEventListener('pointerup', () => { if (state === 'menu') menuUp(); });
window.addEventListener('keydown', e => {

    if (ui.screen === 'intro' && e.code !== 'KeyM') { menuDown(CX, 450); return; }

  else if (e.code === 'KeyM') { muted = !muted; save('knaife.muted', muted); }
  else if (e.code === 'KeyE' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') { ac(); activateAbility(); }

  else if (e.code === 'Digit2') useItem('bird');

// ---------- loop ----------
let last = performance.now();

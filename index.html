<canvas id="c" aria-label="Knaife game. Tap, click or press Space to throw a knife."></canvas>
<script>
'use strict';
// ---------- setup ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2, HALF = Math.PI / 2;
const W = 420, H = 760;                 // virtual playfield
const CX = W / 2, CY = 255, R = 92;     // target
const KL = 118, EMBED = 20;             // knife length, how deep it sinks in
const KNIFE_Y = H - 150;                // tip y of the ready knife
const SPEED = 2600;                     // knife speed px/s
let dpr = 1, scale = 1, ox = 0, oy = 0;

const PIX = 1.5;
const FONT = '"Silkscreen", "Courier New", monospace';                         // virtual units per art pixel
function resize() {
  const cw = cv.clientWidth || window.innerWidth, ch = cv.clientHeight || window.innerHeight;
  scale = Math.min(cw / W, ch / H);
  dpr = 1 / (PIX * scale);
  cv.width = Math.max(1, Math.round(cw * dpr)); cv.height = Math.max(1, Math.round(ch * dpr));
  ox = (cw - W * scale) / 2; oy = (ch - H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => Math.abs((((a - b + Math.PI) % TAU) + TAU) % TAU - Math.PI);
const easeOutBack = t => { const c = 1.70158; t -= 1; return 1 + (c + 1) * t * t * t + c * t * t; };

function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// ---------- audio ----------
let actx = null, master = null, verb = null, muted = load('knaife.muted', false);
function makeIR(a, secs) {
  const len = Math.floor(a.sampleRate * secs), b = a.createBuffer(2, len, a.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  return b;
}
function ac() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    master = actx.createDynamicsCompressor(); master.threshold.value = -14; master.ratio.value = 6;
    const mg = actx.createGain(); mg.gain.value = 0.9; master.connect(mg).connect(actx.destination);
    verb = actx.createConvolver(); verb.buffer = makeIR(actx, 2.6); verb.connect(master);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
let driveCurve = null;
function route(a, node, o) {
  let n = node;
  if (o.drive) {
    if (!driveCurve) { driveCurve = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; driveCurve[i] = Math.tanh(x * 4); } }
    const ws = a.createWaveShaper(); ws.curve = driveCurve; n.connect(ws); n = ws;
  }
  n.connect(master);
  if (o.wet) { const g = a.createGain(); g.gain.value = o.wet; n.connect(g).connect(verb); }
}
function tone(type, f0, f1, dur, vol, o = {}) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + (o.delay || 0), osc = a.createOscillator(), g = a.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f0, t); osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (o.attack || 0.003)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); route(a, g, o); osc.start(t); osc.stop(t + dur + 0.05);
}
function noise(dur, freq, q, vol, type = 'bandpass', o = {}) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + (o.delay || 0), len = Math.max(1, Math.floor(a.sampleRate * dur));
  const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  const shape = o.rise ? (i => i / len) : (i => Math.pow(1 - i / len, o.curve || 1));
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * shape(i);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q; g.gain.value = vol;
  if (o.sweepTo) f.frequency.exponentialRampToValueAtTime(o.sweepTo, t + dur);
  src.connect(f).connect(g); route(a, g, o); src.start(t);
}
const sfx = {
  whoosh() { noise(0.07, 3200, 0.8, 0.12); },
  thunk() { noise(0.09, 900, 1.2, 0.55); tone('sine', 190, 55, 0.13, 0.5); },
  clang() { tone('square', 1500, 950, 0.28, 0.08); tone('triangle', 2400, 1900, 0.4, 0.12); noise(0.12, 4500, 2, 0.35); },
  apple() { tone('sine', 620, 1250, 0.13, 0.22); noise(0.06, 2600, 1, 0.25); },
  smash() { noise(0.45, 650, 0.6, 0.7); tone('sine', 130, 40, 0.35, 0.5); },
  over() {
    tone('sawtooth', 110, 36, 2.2, 0.14, { wet: 0.8, attack: 0.05 });
    tone('sine', 55, 30, 2.4, 0.5, { wet: 0.4 });
    for (const [f, d] of [[392, 0], [311, 0.35], [233, 0.7]]) tone('triangle', f, f * 0.97, 1.4, 0.12, { delay: d, wet: 0.9 });
  },
  impact() {
    // the hit: distorted sub boom + crunch
    tone('sine', 120, 26, 1.4, 1, { drive: true, wet: 0.35 });
    tone('square', 70, 30, 0.35, 0.25, { drive: true });
    noise(0.6, 260, 0.7, 1, 'lowpass', { drive: true, wet: 0.5, curve: 2 });
    // ringing steel: inharmonic partials into a long tail
    for (const f of [1180, 1733, 2489, 3317, 4410]) tone('sine', f, f * 0.985, 1.8, 0.07, { wet: 0.9 });
    // glass: a bright crash then a rain of tinkling shards
    noise(0.9, 4200, 0.5, 0.7, 'highpass', { wet: 0.6, curve: 2.5 });
    noise(0.35, 2500, 3, 0.35, 'bandpass', { wet: 0.4 });
    for (let i = 0; i < 34; i++) {
      const d = 0.02 + Math.pow(Math.random(), 1.8) * 0.9, f = rand(2600, 9000);
      tone(Math.random() < 0.5 ? 'sine' : 'triangle', f, f * rand(0.97, 1.02), rand(0.04, 0.22), rand(0.03, 0.1), { delay: d, wet: 0.7 });
    }
    // time-freeze: pitch dropping out from under you
    tone('sawtooth', 600, 45, 0.5, 0.08, { wet: 0.6 });
  },
  finale() {
    // second, bigger hit when everything explodes
    tone('sine', 70, 20, 2.2, 1, { delay: 0.24, drive: true, wet: 0.6 });
    noise(1.2, 400, 0.6, 1, 'lowpass', { delay: 0.24, drive: true, wet: 0.7, curve: 1.5 });
    noise(0.8, 1800, 0.8, 0.5, 'bandpass', { delay: 0.24, wet: 0.6, curve: 2 });
    // rising tension into the screen break
    noise(0.4, 300, 2, 0.3, 'bandpass', { delay: 0.3, sweepTo: 6000, rise: true, wet: 0.4 });
  },
  screenBreak() {
    noise(1.4, 3000, 0.4, 0.9, 'highpass', { wet: 0.7, curve: 2 });
    noise(0.5, 900, 0.8, 0.6, 'bandpass', { drive: true, wet: 0.4, curve: 2 });
    tone('sine', 140, 30, 0.8, 0.9, { drive: true, wet: 0.4 });
    for (let i = 0; i < 60; i++) {
      const d = Math.pow(Math.random(), 1.6) * 1.3, f = rand(2200, 9500);
      tone(Math.random() < 0.5 ? 'sine' : 'triangle', f, f * rand(0.96, 1.02), rand(0.04, 0.25), rand(0.03, 0.09), { delay: d, wet: 0.7 });
    }
    // slam of the losing screen
    tone('square', 98, 49, 0.5, 0.25, { delay: 0.05, drive: true, wet: 0.5 });
    tone('sawtooth', 55, 27, 2.5, 0.18, { delay: 0.25, wet: 0.9, attack: 0.08 });
    for (const [f, d] of [[392, 0.3], [311, 0.5], [233, 0.7]]) tone('triangle', f, f * 0.97, 1.4, 0.1, { delay: d, wet: 0.9 });
  },
  rewind() {
    // reversed glass: swelling hiss and tinkles that bunch up as the rings land
    noise(0.9, 900, 0.7, 0.5, 'highpass', { rise: true, sweepTo: 9000, wet: 0.6 });
    tone('sine', 40, 140, 0.9, 0.35, { attack: 0.8 });
    for (let j = 8; j >= 0; j--) {
      const land = (8 - j) * 0.045 + 0.44;
      tone('triangle', 2400 + j * 500, 2600 + j * 500, 0.08, 0.06, { delay: land, wet: 0.5 });
      noise(0.03, 5000, 2, 0.12, 'bandpass', { delay: land });
    }
    tone('sine', 60, 40, 0.25, 0.6, { delay: 0.86, drive: true });
  },
  flash() {
    for (const f of [1800, 2700, 4050, 6075]) tone('sine', f, f, 1.2, 0.07, { wet: 1 });
    noise(0.25, 7000, 0.5, 0.4, 'highpass', { wet: 0.8 });
  },
  lightSwitch() {
    // heavy breaker lever slamming into place, echoing through a warehouse
    noise(0.04, 1600, 4, 1, 'bandpass', { drive: true, wet: 1.2 });
    tone('square', 90, 40, 0.09, 0.45, { drive: true, wet: 1 });
    noise(0.25, 180, 0.8, 0.9, 'lowpass', { drive: true, wet: 1, curve: 3 });
    noise(0.03, 2600, 5, 0.6, 'bandpass', { delay: 0.07, wet: 1 });
    // flicker ticks and the mains hum coming up
    for (const d of [0.05, 0.11, 0.15, 0.19]) noise(0.015, 4000, 2, 0.35, 'bandpass', { delay: d, wet: 0.6 });
    tone('sawtooth', 50, 50, 1.6, 0.06, { delay: 0.19, attack: 0.05, wet: 0.5 });
    tone('square', 100, 100, 1.3, 0.025, { delay: 0.19, attack: 0.05, wet: 0.5 });
  },
  popBreak() {
    noise(0.7, 3500, 0.5, 0.7, 'highpass', { wet: 0.6, curve: 2 });
    tone('sine', 110, 40, 0.4, 0.6, { drive: true, wet: 0.3 });
    for (let i = 0; i < 28; i++) { const f = rand(2500, 9000); tone('sine', f, f, rand(0.04, 0.18), rand(0.03, 0.08), { delay: Math.pow(Math.random(), 1.7) * 0.6, wet: 0.6 }); }
  },
  ping() {
    noise(0.02, 7000, 1, 0.5, 'highpass');
    tone('sine', 2960, 2940, 1.4, 0.16, { wet: 0.9 }); tone('sine', 4440, 4420, 0.9, 0.06, { wet: 0.9 });
    tone('triangle', 1480, 1475, 0.7, 0.05, { wet: 0.7 });
  },
  stun() { for (let i = 0; i < 8; i++) tone('sine', 640 - i * 30 + (i % 2) * 90, 600 - i * 30, 0.09, 0.05, { delay: 0.12 + i * 0.075, wet: 0.4 }); },
  denied() { tone('square', 140, 110, 0.08, 0.06); },
  riser() {
    noise(0.75, 300, 1.5, 0.5, 'bandpass', { sweepTo: 7000, rise: true, wet: 0.7 });
    tone('sawtooth', 80, 640, 0.75, 0.08, { attack: 0.6, wet: 0.6 });
    tone('sine', 40, 90, 0.75, 0.35, { attack: 0.6 });
  },
  heartbeat() { for (const d of [0.05, 0.27, 0.62, 0.84]) tone('sine', 62, 38, 0.18, 0.7, { delay: d, drive: true }); },
  subDrop() {
    tone('sine', 72, 16, 2.8, 1, { drive: true, wet: 0.5 });
    noise(2.2, 700, 0.5, 0.6, 'lowpass', { wet: 1, curve: 1.2 });   // rolling thunder tail
    tone('sawtooth', 1200, 60, 0.5, 0.06, { wet: 0.8 });
  },
  land() { tone('sine', 95, 38, 0.35, 0.9, { drive: true, wet: 0.3 }); noise(0.3, 400, 0.7, 0.7, 'lowpass', { curve: 2, wet: 0.4 }); noise(0.08, 1500, 1.5, 0.3, 'bandpass', { delay: 0.02 }); },
  snap() { noise(0.09, 1800, 2, 0.8, 'bandpass', { drive: true, wet: 0.3 }); tone('square', 320, 70, 0.07, 0.15); for (let i = 0; i < 4; i++) noise(0.02, rand(1500, 3500), 3, 0.3, 'bandpass', { delay: 0.02 + i * 0.03 }); },
  boing() { tone('sine', 160, 620, 0.18, 0.25, { wet: 0.4 }); tone('sine', 620, 240, 0.3, 0.15, { delay: 0.16, wet: 0.4 }); tone('triangle', 320, 900, 0.12, 0.08, { delay: 0.05 }); },
  hiss() { noise(0.8, 4200, 0.6, 0.45, 'highpass', { curve: 1.4, wet: 0.4 }); noise(0.5, 900, 1, 0.25, 'bandpass', { curve: 2 }); },
  bees() { tone('sawtooth', 218, 232, 1.3, 0.05, { wet: 0.3 }); tone('sawtooth', 247, 238, 1.3, 0.04); tone('sawtooth', 196, 205, 1.1, 0.03, { delay: 0.1 }); },
  zap(p = 1) {
    noise(0.35 * p, 3200, 0.5, 0.7, 'bandpass', { drive: true, wet: 0.5 });
    tone('square', 62, 55, 0.45 * p, 0.22, { drive: true }); tone('sawtooth', 120, 118, 0.4 * p, 0.12, { drive: true });
    for (let i = 0; i < 8 * p; i++) noise(0.02, 6500, 1, 0.45, 'highpass', { delay: i * 0.05 });
  },
  chain() { for (let i = 0; i < 6; i++) tone('triangle', 1700 + rand(0, 900), 1600, 0.07, 0.08, { delay: i * 0.03, wet: 0.4 }); noise(0.12, 3000, 1, 0.4, 'bandpass'); },
  tweet() { tone('sine', 2400, 3300, 0.08, 0.12); tone('sine', 2700, 3500, 0.08, 0.1, { delay: 0.11 }); for (let i = 0; i < 3; i++) noise(0.05, 700, 1.5, 0.25, 'bandpass', { delay: 0.05 + i * 0.09 }); },
  squawk() { tone('sawtooth', 950, 420, 0.35, 0.18, { drive: true, wet: 0.5 }); noise(0.2, 2000, 1, 0.4, 'bandpass'); },
  rustle() { noise(0.35, 2600, 0.8, 0.4, 'bandpass', { curve: 1 }); noise(0.2, 5000, 1, 0.15, 'highpass', { delay: 0.05 }); },
  reveal() { tone('square', 880, 1760, 0.15, 0.1); noise(0.05, 7000, 1, 0.5, 'highpass'); tone('sine', 3100, 3000, 0.7, 0.08, { wet: 0.9 }); tone('sine', 70, 35, 0.35, 0.6, { drive: true }); },
  sawHum() { tone('sawtooth', 165, 158, 0.42, 0.025); noise(0.42, 2600, 6, 0.05, 'bandpass'); },
  barkHit() { noise(0.09, 700, 1.5, 0.8, 'bandpass', { drive: true, wet: 0.3 }); tone('square', 130, 60, 0.1, 0.22, { drive: true }); },
  barkBreak() { noise(0.7, 900, 0.6, 0.9, 'lowpass', { drive: true, wet: 0.6, curve: 1.5 }); tone('sine', 100, 28, 0.9, 0.9, { drive: true }); for (let i = 0; i < 10; i++) tone('triangle', rand(900, 2400), 800, 0.08, 0.06, { delay: rand(0, 0.5), wet: 0.5 }); },
  squish() { noise(0.14, 500, 1, 0.55, 'lowpass', { curve: 1.5 }); tone('sine', 210, 90, 0.12, 0.2); },
  mossBreak() { noise(0.45, 700, 0.8, 0.7, 'lowpass', { curve: 1.5, wet: 0.4 }); tone('sine', 160, 60, 0.3, 0.3); },
  holeHit() { tone('sine', 95, 38, 0.45, 0.85, { drive: true, wet: 0.4 }); tone('triangle', 880, 880, 0.35, 0.1, { wet: 0.8 }); tone('triangle', 1320, 1320, 0.3, 0.07, { delay: 0.06, wet: 0.8 }); },
  gulp() { tone('sine', 320, 80, 0.25, 0.45); tone('sine', 140, 60, 0.25, 0.3, { delay: 0.16, wet: 0.9 }); noise(0.15, 400, 1, 0.3, 'lowpass', { delay: 0.05, wet: 0.9 }); },
  abilityArm() {
    noise(0.55, 300, 2, 0.45, 'bandpass', { sweepTo: 4200, rise: true, wet: 0.5 });
    tone('sine', 220, 880, 0.5, 0.16, { attack: 0.3, wet: 0.6 });
    for (let i = 0; i < 10; i++) tone('square', [440, 660, 880, 1320][i % 4] * (1 + i * 0.08), 0, 0.04, 0.035, { delay: i * 0.045 });

  abilityArmed() {

    tone('sine', 1760, 1760, 0.8, 0.05, { wet: 1 }); tone('sine', 2640, 2640, 0.6, 0.03, { wet: 1, delay: 0.05 });

  heavyThrow() {

    tone('sine', 190, 42, 0.7, 0.8, { drive: true });

  abilityImpact() {

    tone('square', 62, 28, 0.35, 0.3, { drive: true });
    noise(0.8, 320, 0.7, 1, 'lowpass', { drive: true, wet: 0.65, curve: 2 });
    noise(0.5, 1300, 1.5, 0.7, 'bandpass', { wet: 0.4, curve: 2 });

    for (let i = 0; i < 26; i++) { const f = rand(2500, 8500); tone('triangle', f, f, rand(0.04, 0.2), rand(0.03, 0.08), { delay: Math.pow(Math.random(), 1.6) * 0.7, wet: 0.6 }); }
  },

    noise(0.55, 2200, 2, 0.18, 'bandpass', { sweepTo: 300 });

  unfreeze() { noise(0.6, 250, 1.5, 0.35, 'bandpass', { sweepTo: 4500, rise: true, wet: 0.5 }); tone('sine', 80, 300, 0.6, 0.12, { attack: 0.4 }); },
};
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

// ---------- palettes ----------

const BARK_W = 10, TEX = 2.4;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function makeLogTexture(t) {
  const p = t.pal, rnd = mulberry(t.seed), S = Math.ceil((R + 4) * 2 * TEX);

  const g = c.getContext('2d'); g.translate(S / 2, S / 2); g.scale(TEX, TEX);

  const ringPath = (rad, j = 0) => {
    g.beginPath();
    const ox = px * (1 - rad / IR), oy = py * (1 - rad / IR);
    for (let i = 0; i <= 120; i++) {

      g[i ? 'lineTo' : 'moveTo'](ox + Math.cos(th) * rr, oy + Math.sin(th) * rr);
    }

  };
  // ---- bark ----
  g.fillStyle = p.barkLo; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill();
  if (p.style === 'birch') {
    g.fillStyle = p.bark; g.beginPath(); g.arc(0, 0, R - 0.6, 0, TAU); g.arc(0, 0, IR, 0, TAU, true); g.fill();
    for (let i = 0; i < 70; i++) {
      const a = rnd() * TAU, r = IR + 1 + rnd() * (BARK_W - 2), len = 0.03 + rnd() * 0.12;
      g.strokeStyle = rnd() < 0.8 ? p.barkLo : '#8d8d97'; g.lineWidth = 0.8 + rnd() * 1.4;

    for (let i = 0; i < 8; i++) { const a = rnd() * TAU; g.fillStyle = '#c9b48a'; g.beginPath(); g.arc(Math.cos(a) * (R - 3), Math.sin(a) * (R - 3), 1.5 + rnd() * 2, 0, TAU); g.fill(); }
  } else if (p.style === 'iron') {
    g.fillStyle = p.bark; g.beginPath(); g.arc(0, 0, R - 0.6, 0, TAU); g.arc(0, 0, IR, 0, TAU, true); g.fill();
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * TAU; g.strokeStyle = p.barkLo; g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(Math.cos(a) * IR, Math.sin(a) * IR); g.lineTo(Math.cos(a) * R, Math.sin(a) * R); g.stroke();
      g.fillStyle = p.barkHi; g.beginPath(); g.arc(Math.cos(a + 0.2) * (R - 5), Math.sin(a + 0.2) * (R - 5), 1.4, 0, TAU); g.fill();
    }
    g.strokeStyle = p.barkHi; g.lineWidth = 1; g.beginPath(); g.arc(0, 0, R - 1.5, Math.PI * 1.05, Math.PI * 1.65); g.stroke();
  } else {
    const n = p.style === 'plates' ? 30 : p.style === 'smooth' ? 0 : 56;
    if (p.style === 'smooth') {
      g.fillStyle = p.bark; g.beginPath(); g.arc(0, 0, R - 0.6, 0, TAU); g.arc(0, 0, IR, 0, TAU, true); g.fill();
      for (let i = 0; i < 4; i++) { g.strokeStyle = i % 2 ? p.barkHi : p.barkLo; g.globalAlpha = 0.5; g.lineWidth = 0.7; g.beginPath(); g.arc(0, 0, IR + 2 + i * 2, 0, TAU); g.stroke(); }
      g.globalAlpha = 1;
      for (let i = 0; i < 30; i++) { const a = rnd() * TAU; g.strokeStyle = p.barkHi; g.lineWidth = 1; g.beginPath(); g.arc(0, 0, IR + 2 + rnd() * 6, a, a + 0.04); g.stroke(); }
    }
    for (let i = 0; i < n; i++) {
      const a0 = i / n * TAU + rnd() * 0.04, a1 = (i + 1) / n * TAU - 0.015 - rnd() * 0.03;
      const ri = IR + rnd() * 1.5, ro = R - 0.5 - rnd() * (p.style === 'plates' ? 2.5 : 1.5);
      g.fillStyle = rnd() < 0.35 ? p.barkHi : p.bark;
      g.beginPath(); g.arc(0, 0, ro, a0, a1); g.arc(0, 0, ri, a1, a0, true); g.closePath(); g.fill();
      if (p.style === 'plates') { g.strokeStyle = p.barkHi; g.lineWidth = 0.6; g.beginPath(); g.arc(0, 0, ro - 1.5, a0 + 0.02, a1 - 0.02); g.stroke(); }
      if (p.style === 'fibrous') { g.strokeStyle = p.barkLo; g.lineWidth = 0.5; for (let k = 0; k < 3; k++) { const a = a0 + (a1 - a0) * rnd(); g.beginPath(); g.moveTo(Math.cos(a) * ri, Math.sin(a) * ri); g.lineTo(Math.cos(a + 0.03) * ro, Math.sin(a + 0.03) * ro); g.stroke(); } }
    }
  }
  // ---- cambium & sapwood ----
  g.fillStyle = p.sap; g.beginPath(); g.arc(0, 0, IR, 0, TAU); g.fill();

  // ---- heartwood with a soft, irregular boundary ----

  // ---- growth rings: wide earlywood, thin dark latewood ----
  const N = 18 + Math.floor(rnd() * 10), steps = [];

  for (let i = 0; i < N; i++) { const s = 0.5 + rnd() * 1.1 + (i < 4 ? 0.6 : 0); steps.push(s); acc += s; }
  let rad = 0;

  }

  // ---- medullary rays ----
  g.strokeStyle = p.ray; g.lineWidth = 0.55;
  for (let i = 0; i < 90; i++) {

  }
  // ---- saw marks from the felling cut ----
  g.save(); g.beginPath(); g.arc(0, 0, IR, 0, TAU); g.clip();
  const sa = rnd() * TAU, sx = Math.cos(sa) * R * 3, sy = Math.sin(sa) * R * 3;
  g.strokeStyle = 'rgba(0,0,0,.07)'; g.lineWidth = 1.2;
  for (let i = 0; i < 16; i++) { g.beginPath(); g.arc(sx, sy, R * 2 + i * 6 + rnd() * 2, 0, TAU); g.stroke(); }
  g.restore();
  // ---- knots ----
  for (let i = 0, n = 1 + Math.floor(rnd() * 2); i < n; i++) {
    const a = rnd() * TAU, r = (0.35 + rnd() * 0.4) * IR, kx = Math.cos(a) * r, ky = Math.sin(a) * r, rx = 4 + rnd() * 4, ry = 2.5 + rnd() * 2.5;
    g.save(); g.translate(kx, ky); g.rotate(a);
    g.fillStyle = p.knot; g.beginPath(); g.ellipse(0, 0, rx + 2, ry + 2, 0, 0, TAU); g.fill();
    g.fillStyle = p.barkLo; g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, TAU); g.fill();
    for (let k = 1; k < 3; k++) { g.strokeStyle = p.knot; g.lineWidth = 0.6; g.beginPath(); g.ellipse(0, 0, rx * k / 3, ry * k / 3, 0, 0, TAU); g.stroke(); }
    g.restore();
  }
  // ---- seasoning checks (radial splits) and a star-shaped pith check ----
  const checks = [];
  for (let i = 0, n = 1 + Math.floor(rnd() * 3); i < n; i++) {
    const a = rnd() * TAU, len = IR * (0.18 + rnd() * 0.35), pts = [];
    for (let k = 0; k <= 5; k++) { const r = IR + 1 - len * k / 5, aa = a + (rnd() - 0.5) * 0.05; pts.push([Math.cos(aa) * r, Math.sin(aa) * r, (1 - k / 5) * 2.2]); }
    checks.push(pts);
  }
  for (const pts of checks) {
    g.fillStyle = 'rgba(20,8,2,.85)'; g.beginPath();
    pts.forEach(([x, y, w], k) => { const a = Math.atan2(y, x) + HALF; g[k ? 'lineTo' : 'moveTo'](x + Math.cos(a) * w, y + Math.sin(a) * w); });
    for (let k = pts.length - 1; k >= 0; k--) { const [x, y, w] = pts[k], a = Math.atan2(y, x) - HALF; g.lineTo(x + Math.cos(a) * w, y + Math.sin(a) * w); }

  g.fillStyle = p.knot; g.beginPath(); g.arc(px, py, 1.8, 0, TAU); g.fill();
  // ---- boss dressing ----
  const ov = p.overlay;
  t.live = [];
  if (ov === 'iron') {
    for (let i = 0; i < 3; i++) { const a = rnd() * TAU; g.save(); g.rotate(a); g.fillStyle = '#5d6670'; g.fillRect(-IR, -3, IR * 2, 6); g.fillStyle = '#8d8d97'; g.fillRect(-IR, -3, IR * 2, 1.2); for (let x = -IR + 6; x < IR; x += 14) { g.fillStyle = '#c3c3ca'; g.beginPath(); g.arc(x, 0, 1.4, 0, TAU); g.fill(); } g.restore(); }

}

function drawLive(t) {
  if (!t.live) return;
  for (const l of t.live) {
    if (l.k === 'spark') { const a = 0.5 + 0.5 * Math.sin(time * 3 + l.ph); if (a > 0.75) { ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(l.x - 1, l.y - 1, 2, 2); ctx.fillRect(l.x - 3, l.y - 0.3, 6, 0.6); } }
    else if (l.k === 'star') { const a = 0.4 + 0.6 * Math.abs(Math.sin(time * 1.6 + l.ph)); ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(l.x - l.s / 2, l.y - l.s / 2, l.s, l.s); }
    else if (l.k === 'lava') {
      const glow = 0.55 + 0.45 * Math.sin(time * 3 + l.ph);
      ctx.beginPath(); l.pts.forEach((q, k) => ctx[k ? 'lineTo' : 'moveTo'](...q));
      ctx.strokeStyle = `rgba(255,122,26,${glow})`; ctx.lineWidth = 2.2; ctx.stroke();
      ctx.strokeStyle = `rgba(255,210,63,${glow})`; ctx.lineWidth = 0.9; ctx.stroke();
    }
  }
}

function drawFace(t) {
  if (!t.tex) t.tex = makeLogTexture(t);
  const h = (R + 4);
  ctx.drawImage(t.tex, -h, -h, h * 2, h * 2);
  drawLive(t);
  if (t.marks) drawMarks(t);
}

// small splits left behind by every knife
function addMark(t, a) {
  if (!t.marks) t.marks = [];
  const cracks = [];
  for (let i = 0; i < 3; i++) { const ang = Math.PI + rand(-0.9, 0.9), l = rand(4, 10); cracks.push([Math.cos(ang) * l, Math.sin(ang) * l, rand(-0.4, 0.4)]); }
  t.marks.push({ a, cracks });
  if (t.marks.length > 40) t.marks.shift();
}
function drawMarks(t) {
  for (const m of t.marks) {
    ctx.save(); ctx.rotate(m.a); ctx.translate(R - BARK_W - 1, 0);
    ctx.strokeStyle = 'rgba(15,6,2,.75)'; ctx.lineWidth = 1;
    for (const [x, y, b] of m.cracks) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(x * 0.5, y * 0.5 + b * 3, x, y); ctx.stroke(); }
    ctx.fillStyle = '#120802'; ctx.fillRect(-4, -1.6, 6, 3.2);
    ctx.fillStyle = 'rgba(255,240,200,.35)'; ctx.fillRect(-4, 1.6, 6, 0.8);
    ctx.restore();
  }
}

// 3D thickness under the face, so the log reads as a cylinder end
function drawLogSide(t) {
  const p = t.pal;
  ctx.fillStyle = p.barkLo; ctx.beginPath(); ctx.arc(0, 9, R, 0, TAU); ctx.fill();
  ctx.fillStyle = p.bark; ctx.beginPath(); ctx.arc(0, 6, R, 0, Math.PI); ctx.fill();
  ctx.strokeStyle = p.barkHi; ctx.globalAlpha = 0.5; ctx.lineWidth = 1;
  for (let i = 1; i < 8; i++) { const a = i / 8 * Math.PI; ctx.beginPath(); ctx.moveTo(Math.cos(a) * R, Math.sin(a) * R + 2); ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R + 8); ctx.stroke(); }
  ctx.globalAlpha = 1;
}

// jagged shatter pieces cut from the texture
function shatterLog(t, power) {
  const rays = [], n = power > 1 ? 9 + Math.floor(rand(3)) : 6 + Math.floor(rand(3));
  const core = R * rand(0.28, 0.4);
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + rand(-0.15, 0.15), pts = [];
    for (let k = 0; k <= 5; k++) { const r = core + (R + 5 - core) * k / 5, aa = a + (k && k < 5 ? rand(-0.09, 0.09) : 0); pts.push([Math.cos(aa) * r, Math.sin(aa) * r]); }
    rays.push(pts);
  }
  const polys = [rays.map(r => r[0])];
  for (let i = 0; i < n; i++) {
    const A = rays[i], B = rays[(i + 1) % n], a0 = Math.atan2(A[5][1], A[5][0]); let a1 = Math.atan2(B[5][1], B[5][0]); if (a1 < a0) a1 += TAU;
    const arc = []; for (let k = 1; k < 6; k++) { const a = a0 + (a1 - a0) * k / 6; arc.push([Math.cos(a) * (R + 5), Math.sin(a) * (R + 5)]); }
    polys.push(A.concat(arc, B.slice().reverse()));
  }
  polys.forEach((poly, i) => {
    const cx = poly.reduce((s, q) => s + q[0], 0) / poly.length, cy = poly.reduce((s, q) => s + q[1], 0) / poly.length;
    const w = Math.atan2(cy, cx) + t.rot, dist = Math.hypot(cx, cy), sp = (i ? rand(220, 420) : 80) * power;
    const pos = [CX + Math.cos(w) * dist, CY + Math.sin(w) * dist];
    debris.push({ kind: 'chunk', poly, c: [cx, cy], t, x: pos[0], y: pos[1], vx: Math.cos(w) * sp + rand(-40, 40), vy: Math.sin(w) * sp - rand(220, 380), rot: t.rot, vr: rand(-5, 5) * power });
  });
  for (let i = 0; i < 46 * power; i++) splinter(CX + rand(-R, R) * 0.7, CY + rand(-R, R) * 0.7, t, 700 * power);

// polar grid of cracks covering the whole screen; the same vertices cut the screen into pieces
function makeGridFracture() { return makeGrid(12, [0, 34, 80, 140, 220, 330, 480, 700, 1000, 1500]); }
function makeGrid(n, radii) {
  const V = [];
  const base = rand(TAU);
  for (let i = 0; i < n; i++) {
    const a = base + i / n * TAU + rand(-0.12, 0.12), col = [];
    for (let j = 0; j < radii.length; j++) {

}

// cracked-glass pattern radiating from the hit point
function makeFracture() {
  const rays = [], web = [], n = 13;
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + rand(-0.18, 0.18), len = rand(170, 430), pts = [[0, 0]];
    for (let r = 0; r < len;) { r += rand(16, 38); const aa = a + rand(-0.1, 0.1); pts.push([Math.cos(aa) * r, Math.sin(aa) * r]); }
    rays.push({ a, len, pts });
  }
  for (const rr of [rand(28, 40), rand(65, 90), rand(115, 150), rand(180, 230)]) {
    for (let i = 0; i < n; i++) {
      const A = rays[i], B = rays[(i + 1) % n];

function placeAngles(n, sep, avoid) {
  const out = [];
  for (let tries = 0; out.length < n && tries < 400; tries++) {
    const a = rand(TAU);
    if (avoid.concat(out).every(b => angDiff(a, b) > sep)) out.push(a);
  }
  return out;
}

function makePattern(n, boss) {
  const dir = Math.random() < 0.5 ? -1 : 1;
  const base = Math.min(1.5 + n * 0.11, 3.4) * dir;
  const pool = boss ? ['reverse', 'chaos', 'surge']
    : n < 3 ? ['steady'] : n < 6 ? ['steady', 'wave'] : ['steady', 'wave', 'reverse', 'surge'];
  const type = pool[Math.floor(rand(pool.length))];
  switch (type) {
    case 'wave':    return t => base * (0.55 + 0.65 * Math.sin(t * 1.3));
    case 'reverse': return t => base * 1.25 * Math.tanh(2.5 * Math.sin(t * 0.85));
    case 'surge':   return t => base * (0.25 + 1.8 * Math.pow(Math.max(0, Math.sin(t * 1.6)), 2));
    case 'chaos':   return t => base * 1.15 * (Math.sin(t * 1.1) + 0.6 * Math.sin(t * 2.7 + 1));
    default:        return () => base;
  }
}

    const w = t.rot + s.a;
    if (angDiff(w, HALF) > 0.7) continue;
    const sk = R - EMBED - (s.sink || 0), bw = w + knifeTilt(s), ex = CX + Math.cos(w) * sk, ey = CY + Math.sin(w) * sk;
    const c = Math.cos(bw), sn = Math.sin(bw);

function updateAbility(rdt) {
  updateCam(rdt, !!(fx && fx.t < fx.freeze));

  abil.pauseT = Math.max(0, (abil.pauseT || 0) - rdt);
  abil.flash = Math.max(0, abil.flash - rdt * 2);
  const sw = abil.swirl;
  if (sw) {
    sw.t += rdt;
    if (sw.t >= sw.dur) {
      abil.swirl = null;
      if (sw.dir === 'in') { abil.state = 'armed'; sfx.abilityArmed(); buzz([20, 30, 40]); kick(0.07, 0.02, 0.9, 0.5); shocks(CX, KNIFE_Y + KL / 2, 2, 60); burst(CX, KNIFE_Y + KL / 2, 40, ['#fff', '#000'], 360, 0, 4, 0.6); }

function impactLinesFor(n, len) { return Array.from({ length: n }, (_, i) => ({ a: i / n * TAU + rand(-0.12, 0.12), r0: rand(30, 60), r1: rand(300, len), w: rand(3, 16) })); }

function addCrater(t, a) {
  const cracks = [];
  for (let i = 0; i < 6; i++) {
    const ang = Math.PI + rand(-1.1, 1.1), pts = [[R - 12, 0]];
    let x = R - 12, y = 0;
    for (let j = 0; j < 3; j++) { const l = rand(6, 13), aa = ang + rand(-0.35, 0.35); x += Math.cos(aa) * l; y += Math.sin(aa) * l; pts.push([x, y]); }
    cracks.push(pts);

function drawCraters(t) {
  for (const c of t.craters) {
    ctx.save(); ctx.rotate(c.a);
    ctx.beginPath(); ctx.arc(0, 0, R - 0.5, 0, TAU); ctx.clip();
    const g = ctx.createRadialGradient(R - 8, 0, 2, R - 8, 0, 26);
    g.addColorStop(0, 'rgba(15,6,2,.95)'); g.addColorStop(0.45, 'rgba(40,18,6,.7)'); g.addColorStop(1, 'rgba(40,18,6,0)');

    ctx.lineJoin = 'round';

// smoke rises from craters and is flung by the spinning log

// fragments that fly at the camera and crack the screen itself

  const vx0 = -ox / scale, vx1 = (cv.width / dpr - ox) / scale, vy0 = -oy / scale, vy1 = (cv.height / dpr - oy) / scale;
  for (let i = 0; i < n; i++) {

    for (let k = 0, m = 7 + Math.floor(rand(4)); k < m; k++) {

      for (let r = 0; r < len;) { r += rand(6, 14); const aa = a + rand(-0.15, 0.15); pts.push([Math.cos(aa) * r, Math.sin(aa) * r]); }

    if (grow >= 1) {

    ctx.fillStyle = h.c; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();

function drawRings() {

function drawSlash() {

function drawFxImpactFrame() {

// colour floods back in from a ripple; everything outside it stays two-tone

// ---- cinema: camera punch, letterbox, vignette, chromatic split, zoom blur ----

let stunT = 0;

  ctx.translate(cam.fx, cam.fy); ctx.rotate(cam.kr); ctx.scale(z, z); ctx.translate(-cam.fx, -cam.fy);
}
function canvasLike(c) { if (!c || c.width !== cv.width || c.height !== cv.height) { c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; } return c; }
function postFX() {

  if (zblur > 0.03) {                                                   // radial zoom blur toward the focus

  }

  debris.push({ kind: 'knife', x: CX, y: k.y, vx: -side * rand(480, 680), vy: rand(-520, -300), rot: 0, vr: -side * rand(22, 30) });
  burst(px, py, 22, ['#ffffff', '#fff7c2', '#ffd35c'], 520, 60, 2.5, 0.4);
  knivesLeft++;                                    // the knife is lost, not counted as a hit
  stunT = 2; stunMax = 2; shake = Math.max(shake, 8); kick(0.06, 0.03, 0.35);

function drawStun(ky) {
  const cx = CX, cy = ky - 16;
  for (let i = 0; i < 3; i++) {
    const a = time * 5 + i / 3 * TAU, x = cx + Math.cos(a) * 22, y = cy + Math.sin(a) * 7;
    ctx.save(); ctx.translate(x, y); ctx.rotate(time * 6); ctx.fillStyle = i % 2 ? '#fff' : '#ffd35c';
    ctx.beginPath(); for (let j = 0; j < 8; j++) { const r = j % 2 ? 2 : 6, q = j / 8 * TAU; ctx[j ? 'lineTo' : 'moveTo'](Math.cos(q) * r, Math.sin(q) * r); } ctx.closePath(); ctx.fill();

}

// ---- the three outcomes ----
function abilityStick(k) {
  const t = tgt;
  let bonus = 0;
  if (!k.hooked) { k.hooked = true; bonus = ABILITY.onImpact(t, normA(HALF - t.rot)); }
  const extra = (k.dmg === 1 ? 0 : 1) + bonus, remaining = Math.max(0, knivesLeft - extra);
  const lethal = remaining === 0;
  if (extra && lethal) { startSlice(k); return; }                       // CASE 2
  k.done = true;
  const a = HALF - t.rot;
  t.stuck.push({ a, ability: true, wob: 0.14 }); addCrater(t, a); addMark(t, a);
  knivesLeft = remaining; score += 1 + extra; t.hit = 1;
  if (t.f && t.f.treehole && inArc(a, t.f.treehole.a, t.f.treehole.w)) t.f.treehole.gulp = 1;
  burst(CX, CY + R, 90, [t.pal.light, t.pal.dark, t.pal.bark, '#222'], 820, 160, 8, 1.1);
  embers(CX, CY + R, 50, 700);
  if (fx && fx.type === 'clank') {
    sfx.thunk(); sfx.abilityImpact(); shake = 14;
    if (lethal) explodeLog();                                          // CASE 3
    return;
  }
  // plain double-damage hit
  fx = { type: 'hit', t: 0, freeze: 0.3, x: CX, y: CY + R, lines: impactLinesFor(30, 1100) };
  shocks(CX, CY + R, 3, 220); floater('X2', CX + 70, CY + R + 10, '#fff');
  kick(0.5, 0.09, 1.6, 1.4); camFocus(CX, CY + R, 1.25);

}

function abilityClank(k, s) {                                           // CASE 1 / 3 start
  k.hold = true; cinema(true, 1);
  if (!k.hooked && tgt) { k.hooked = true; knivesLeft = Math.max(0, knivesLeft - ABILITY.onImpact(tgt, normA(HALF - tgt.rot))); }
  fx = { type: 'clank', t: 0, freeze: 0.32, x: CX, y: k.y, k, s, exploded: 0, lethal: false, frac: makeFracture(), lines: impactLinesFor(26, 1000) };
  burst(CX, k.y, 80, ['#ffffff', '#fff7c2', '#ffd35c'], 900, 30, 3, 0.7);
  shocks(CX, k.y, 2, 160);
  kick(0.4, 0.08, 1.4, 1); camFocus(CX, k.y, 1.35);

}

function explodeHitKnife() {

    }

  embers(CX, fx.y, 40, 900);
  shocks(CX, fx.y, 3, 220);

}

function startSlice(k) {                                                 // CASE 2
  k.slicing = true;
  fx = { type: 'slice', t: 0, freeze: 0.24, x: CX, y: CY + R, k, cut: false, lines: impactLinesFor(30, 1100), boss: tgt.boss };

      const e = t - fx.exploded;
      tscale = e < 0.07 ? 1 : e < 0.55 ? 0.15 : clamp(0.15 + (e - 0.55) * 2.2, 0.15, 1);
      if (e > 0.6) { camFocus(CX, CY, 1); cinema(false); }
      if (fx.k.done && !fx.summoned && e > 0.5) { fx.summoned = true; summonButton(CX, CY + R); }
      if (fx.k.done && e > 0.8) endFx(fx.lethal ? 'clearing' : 'play');
      break;
    }
    case 'slice':
      fxFilter = TWO_TONE;
      if (t < 0.75) tscale = 0.05;
      else { if (!fx.cut) doSlice(); tscale = t < 1.1 ? 0.45 : 1; }
      if (t >= 1.15) { camFocus(CX, CY, 1); cinema(false); }
      if (t >= 1.2 && !fx.rippled) { fx.rippled = true; ripple = { t: 0, x: CX, y: CY }; sfx.ripple(); }
      if (ripple) fxFilter = CANVAS_FILTER ? null : `grayscale(${(1 - ripple.t / 0.4).toFixed(3)})`;
      if (fx.rippled && !ripple) fxFilter = null;
      if (t >= 1.35 && !fx.summoned) { fx.summoned = true; summonButton(CX, CY); }
      if (t >= 1.7) endFx('clearing');
      break;
  }
  return false;
}

// ---- drawing: knife aura, contrail, wind ----
function drawKnifeAura(y, power) {
  const q = Math.floor(time * 14);
  for (let i = 0; i < 46; i++) {
    const along = hash(i, q, 1) * (KL + 20) - 10, side = (hash(i, q, 2) < 0.5 ? -1 : 1) * (8 + hash(i, q, 3) * 16);
    const sz = (2 + Math.floor(hash(i, q, 4) * 3)) * 1.5;
    ctx.fillStyle = hash(i, q, 5) < 0.5 ? '#fff' : '#000';
    ctx.globalAlpha = 0.5 + 0.5 * hash(i, q, 6);
    ctx.fillRect(Math.round((CX + side) / 3) * 3, Math.round((y + along) / 3) * 3, sz, sz);
  }
  for (let i = 0; i < 22; i++) {
    const a = time * 3.2 + i / 22 * TAU, x = CX + Math.cos(a) * 28, yy = y + KL / 2 + Math.sin(a) * 72;
    ctx.fillStyle = i % 2 ? '#fff' : '#000'; ctx.globalAlpha = 0.85 * power;
    ctx.fillRect(Math.round(x / 3) * 3, Math.round(yy / 3) * 3, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function drawAbilityKnife(k) {
  if (!k.slicing && fx && (fx.type === 'flight' || fx.type === 'clank')) {
    // contrail behind the pommel
    const top = k.y + KL - 6, len = Math.min(260, KNIFE_Y + KL - top + 120);
    const g = ctx.createLinearGradient(0, top, 0, top + len);
    g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(CX - 9, top); ctx.lineTo(CX + 9, top); ctx.lineTo(CX + 1.5, top + len); ctx.lineTo(CX - 1.5, top + len); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(CX - 1, top, 2, len * 0.7);
    // wind pushing against the tip: bow-wave arcs and streaks
    ctx.lineCap = 'round';
    for (let j = 0; j < 4; j++) {
      const o = (time * 3.5 + j / 4) % 1;
      ctx.strokeStyle = `rgba(255,255,255,${0.85 * (1 - o)})`; ctx.lineWidth = 2.2 * (1 - o) + 0.6;
      for (const sd of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(CX + sd * 2, k.y - 10 - (1 - o) * 4);
        ctx.quadraticCurveTo(CX + sd * (12 + o * 26), k.y + 6, CX + sd * (16 + o * 40), k.y + 40 + o * 70); ctx.stroke();
      }
    }
    for (let i = 0; i < 10; i++) {
      const sx = CX + (i % 2 ? 1 : -1) * (18 + hash(i, 0, 7) * 34), sy = k.y - 30 + ((time * 700 + hash(i, 0, 8) * 260) % 260);
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + 26); ctx.stroke();
    }
  }
  drawKnifeAura(k.y, 1);
  ctx.save(); ctx.translate(CX, k.y); ctx.shadowColor = '#fff'; ctx.shadowBlur = 18; drawKnife(); ctx.restore();
}

// ---- the button: emblem from the reference sketch ----
function drawLogo(fg, bg) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = fg; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(-13, -21); ctx.quadraticCurveTo(0, -18, 13, -23); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-12, -16); ctx.quadraticCurveTo(1, -13, 15, -17); ctx.stroke();
  const poly = pts => { ctx.beginPath(); pts.forEach((p, i) => ctx[i ? 'lineTo' : 'moveTo'](...p)); ctx.closePath(); };
  ctx.fillStyle = fg;
  poly([[-11, -6], [-22, 7], [-17, 9], [-13, 0]]); ctx.fill();                    // sleeves
  poly([[11, -6], [22, 5], [19, 9], [13, 0]]); ctx.fill();
  poly([[-7, 5], [-15, 19], [-8, 18], [-6, 9]]); ctx.fill();                      // lower flares
  poly([[6, 6], [15, 20], [9, 21], [6, 10]]); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-10, -9); ctx.quadraticCurveTo(0, -12, 10, -9);     // cloak with jagged hem
  ctx.lineTo(12, -2); ctx.lineTo(14, 10); ctx.lineTo(8, 2); ctx.lineTo(6, 9); ctx.lineTo(3, 1); ctx.lineTo(0, 6);
  ctx.lineTo(-3, 1); ctx.lineTo(-6, 9); ctx.lineTo(-8, 2); ctx.lineTo(-14, 10); ctx.lineTo(-12, -2); ctx.closePath(); ctx.fill();
  // dagger, blade up
  poly([[0, -14], [2.8, -7], [2.5, 14], [-2.5, 14], [-2.8, -7]]);
  ctx.fillStyle = fg; ctx.fill(); ctx.strokeStyle = bg; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(0, 12); ctx.strokeStyle = bg; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.fillStyle = fg; ctx.strokeStyle = bg; ctx.lineWidth = 1.2;
  rr(-6, 14, 12, 3, 1); ctx.fill(); ctx.stroke();
  rr(-2.4, 17, 4.8, 8, 2); ctx.fill(); ctx.stroke();
}

function drawButtonBody(grey, sc, rot) {
  ctx.save(); ctx.translate(BTN[0], BTN[1]); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.fillStyle = grey ? '#26262b' : '#000';
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.fill();
  ctx.strokeStyle = grey ? '#55555c' : '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.stroke();
  ctx.strokeStyle = grey ? '#3a3a40' : '#fff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.stroke();
  ctx.translate(0, 1); drawLogo(grey ? '#6c6c74' : '#fff', grey ? '#26262b' : '#000');
  ctx.restore();
}

function drawPixelAura(x, y, rad, density) {
  const q = Math.floor(time * 12);
  for (let i = 0; i < 64; i++) {
    if (hash(i, q, 2) > density) continue;
    const a = i / 64 * TAU + time * 0.7, r = rad + hash(i, q, 1) * 14 + Math.sin(time * 6 + i) * 2;
    const sz = hash(i, q, 3) < 0.3 ? 6 : 3;
    ctx.fillStyle = hash(i, q, 4) < 0.5 ? '#fff' : '#000';
    ctx.fillRect(Math.round((x + Math.cos(a) * r) / 3) * 3, Math.round((y + Math.sin(a) * r) / 3) * 3, sz, sz);
  }
  for (let i = 0; i < 10; i++) {                 // pixels drifting off
    const ph = (time * 0.8 + hash(i, 0, 9)) % 1, a = hash(i, 0, 10) * TAU;
    ctx.globalAlpha = 1 - ph; ctx.fillStyle = i % 2 ? '#fff' : '#000';
    ctx.fillRect(Math.round((x + Math.cos(a) * (rad + 6 + ph * 26)) / 3) * 3, Math.round((y + Math.sin(a) * (rad + 6 + ph * 26)) / 3) * 3, 3, 3);
  }
  ctx.globalAlpha = 1;
}

function drawAbilityButton() {
  const st = abil.state, sw = abil.swirl;
  // empty socket
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.setLineDash([4, 5]); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(BTN[0], BTN[1], 31, 0, TAU); ctx.stroke(); ctx.restore();
  if (abil.pauseT > 0 && (st === 'ready' || st === 'cooldown')) {
    drawButtonBody(true, 1, 0);
    for (let i = 0; i < 7; i++) { const a = time * 4 + i; drawBee(BTN[0] + Math.cos(a) * 22, BTN[1] + Math.sin(a * 1.4) * 22, time + i); }
    text(String(Math.ceil(abil.pauseT)), BTN[0], BTN[1] + 46, 12, '#ffd23f', 'center', 700);
    return;
  }
  if (st === 'ready') {
    drawPixelAura(BTN[0], BTN[1], 34, 0.8);
    drawButtonBody(false, 1 + 0.04 * Math.sin(time * 5), 0);
    if (abil.flash > 0) { ctx.strokeStyle = `rgba(255,255,255,${abil.flash})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(BTN[0], BTN[1], 32 + (1 - abil.flash) * 40, 0, TAU); ctx.stroke(); }
  } else if (st === 'arming' && sw) {
    const u = clamp(sw.t / (sw.dur * 0.7), 0, 1);
    if (u < 1) { drawPixelAura(BTN[0], BTN[1], 34 * (1 - u), 0.8 * (1 - u)); drawButtonBody(false, 1 - u, u * TAU * 1.5); }
  } else if (st === 'summoning' && sw) {
    const u = clamp((sw.t - sw.dur * 0.55) / (sw.dur * 0.45), 0, 1);
    if (u > 0) drawButtonBody(true, easeOutBack(u), (1 - u) * -TAU);
  } else if (st === 'cooldown') {
    drawButtonBody(true, 1, 0);
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(BTN[0], BTN[1], 35, -HALF, -HALF + TAU * abil.charge / abil.need); ctx.stroke();
    for (let i = 0; i < abil.need; i++) {
      const a = -HALF + (i + 0.5) / abil.need * TAU;
      ctx.fillStyle = i < abil.charge ? '#fff' : 'rgba(255,255,255,.25)';
      ctx.fillRect(BTN[0] + Math.cos(a) * 42 - 2, BTN[1] + Math.sin(a) * 42 - 2, 4, 4);
    }
  }
}

function drawSwirl() {
  const sw = abil.swirl; if (!sw) return;
  for (const p of sw.parts) {
    const u = clamp((sw.t - p.off) / (sw.dur - 0.2), 0, 1); if (u <= 0 || u >= 1) continue;
    const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const cx = sw.from[0] + (sw.to[0] - sw.from[0]) * e, cy = sw.from[1] + (sw.to[1] - sw.from[1]) * e;
    const r = p.r0 * Math.sin(Math.PI * Math.max(e, 0.08)) + 2, a = p.a0 + e * TAU * 2.4 * p.spin;
    const sz = p.s * (1 - 0.4 * e);
    ctx.fillStyle = p.c; ctx.fillRect(Math.round((cx + Math.cos(a) * r) / 3) * 3, Math.round((cy + Math.sin(a) * r) / 3) * 3, sz, sz);
  }
}

// ---------- log types ----------
const LOG_TYPES = ['branches', 'holes', 'bushes', 'moss', 'bark', 'treehole', 'saw'];
const TYPE_NAME = { plain: 'PLAIN LOG', branches: 'BRANCHED LOG', holes: 'HOLLOW-POCKED LOG', bushes: 'OVERGROWN LOG', moss: 'MOSSY LOG', bark: 'IRONBARK SHELL', treehole: 'TREE-HOLE LOG', saw: 'SAWMILL LOG' };
const BRANCH_SUBS = ['plain', 'swirl', 'fire', 'hive', 'wire', 'linked', 'bird'];
const BIRD_COLS = [['#2ad8ff', '#1f5fd1'], ['#ff2e45', '#a3122a'], ['#ffd23f', '#ff7a1a'], ['#9466ff', '#5c5c66']];
let forceType = null, fxp = [], zapT = 0, stunMax = 2, typeHint = 0;
const normA = a => ((a % TAU) + TAU) % TAU;
const inArc = (a, c, w) => angDiff(a, c) < w;

function decorate(t, type) {
  t.type = type;
  const F = t.f = { branches: [], links: [], holes: [], bushes: [], moss: [], bark: null, treehole: null, saws: [], arcs: [] };
  const taken = t.stuck.map(s => s.a).concat(t.apples.map(a => a.a));
  const spot = (n, sep) => { const out = placeAngles(n, sep, taken); taken.push(...out); return out; };
  const pick = arr => arr[Math.floor(rand(arr.length))];
  if (type === 'branches') {
    const n = 2 + Math.floor(rand(3)), subs = [];
    for (let i = 0; i < n; i++) subs.push(pick(BRANCH_SUBS));
    if (subs.filter(s => s === 'linked').length === 1) subs[subs.indexOf('linked')] = 'plain';
    // linked branches come in neighbouring pairs
    const angs = [];
    let linkedLeft = subs.filter(s => s === 'linked').length;
    for (const sub of subs) {
      if (sub === 'linked' && linkedLeft >= 2 && !angs.pendingLink) {
        const a0 = spot(1, 0.9)[0];
        if (a0 === undefined) continue;
        const a1 = normA(a0 + rand(0.6, 0.8) * (Math.random() < 0.5 ? -1 : 1));
        if (taken.some(x => angDiff(x, a1) < 0.35)) { F.branches.push(makeBranch(a0, 'plain')); continue; }
        taken.push(a1);
        const i0 = F.branches.push(makeBranch(a0, 'linked')) - 1, i1 = F.branches.push(makeBranch(a1, 'linked')) - 1;
        F.links.push({ i: i0, j: i1, alive: true });
        F.branches[i0].link = F.links.length - 1; F.branches[i1].link = F.links.length - 1;
        linkedLeft -= 2;
      } else if (sub !== 'linked') {
        const a = spot(1, 0.7)[0]; if (a !== undefined) F.branches.push(makeBranch(a, sub));
      }
    }
    if (!F.branches.length) F.branches.push(makeBranch(spot(1, 0.5)[0] || 0, 'plain'));
  } else if (type === 'holes') {
    for (const a of spot(2 + Math.floor(rand(2)), 0.5)) F.holes.push({ a, w: 0.12, r: rand(7, 10), glint: rand(TAU) });
  } else if (type === 'bushes') {
    for (const a of spot(2 + Math.floor(rand(2)), 0.8)) {
      const apple = Math.random() < 0.4;
      const b = { a, w: 0.3, apple, alive: true, seed: rand(1000), wob: 0 };
      F.bushes.push(b);
      if (!apple && Math.random() < 0.75) t.stuck.push({ a: normA(a + rand(-0.12, 0.12)), hidden: true, sink: 72 });
    }
  } else if (type === 'moss') {
    for (const a of spot(2 + Math.floor(rand(2)), 0.9)) F.moss.push({ a, w: rand(0.28, 0.38), hp: 3, seed: rand(1000) });
  } else if (type === 'bark') {
    const hp = 3 + Math.floor(rand(3));
    F.bark = { hp, max: hp, seed: rand(1000), bolts: Math.floor(rand(6, 10)) };
  } else if (type === 'treehole') {
    const a = spot(1, 0.6)[0];
    F.treehole = { a: a === undefined ? 0 : a, w: 0.2, stored: 0, blink: rand(3), gulp: 0 };
  } else if (type === 'saw') {
    for (const a of spot(Math.random() < 0.4 ? 2 : 1, 1.2)) F.saws.push({ a, hp: 2, cut: 0, time: rand(18, 24), spin: 0, alive: true, hitT: 0, buzz: 0 });
  }
}

function makeBranch(a, sub) {
  const twigs = [];
  for (let i = 0, n = 1 + Math.floor(rand(3)); i < n; i++) twigs.push({ at: rand(0.35, 0.8), side: Math.random() < 0.5 ? -1 : 1, len: rand(8, 14), leaf: Math.random() < 0.8 });
  return { a, sub, alive: true, len: rand(40, 52), bend: rand(-7, 7), hp: sub === 'swirl' ? 2 : 1, wob: 0, twigs,
    fireT: 10, bird: sub === 'bird' ? { on: true, col: BIRD_COLS[Math.floor(rand(BIRD_COLS.length))], hop: rand(TAU) } : null, link: -1 };
}

const branchesLeft = t => t && t.f ? t.f.branches.filter(b => b.alive).length : 0;

// ---------- world helpers ----------
const worldAt = (t, a, r) => { const w = t.rot + a; return [CX + Math.cos(w) * r, CY + Math.sin(w) * r]; };
function deflect(k, side = (Math.random() < 0.5 ? -1 : 1), speed = 1) {
  k.done = true;
  debris.push({ kind: 'knife', x: CX, y: k.y, vx: side * rand(420, 620) * speed, vy: rand(-480, -260), rot: 0, vr: side * rand(20, 30) });
  knivesLeft++;
}

// ---------- in-flight hits on features (normal knives only) ----------
function featureHits(k, t) {
  const F = t.f; if (!F) return false;
  const tip = k.y, a = normA(HALF - t.rot);
  // chain between linked branches
  for (const L of F.links) {
    if (!L.alive) continue;
    const A = F.branches[L.i], B = F.branches[L.j];
    const mid = normA(A.a + Math.atan2(Math.sin(B.a - A.a), Math.cos(B.a - A.a)) / 2), half = angDiff(A.a, B.a) / 2;
    if (inArc(a, mid, half - 0.06) && tip <= CY + R + 46) { breakLink(t, L); deflect(k, Math.random() < 0.5 ? -1 : 1, 0.8); return true; }
  }
  for (const b of F.branches) {
    if (!b.alive || !inArc(a, b.a, 0.13) || tip > CY + R + b.len) continue;
    if (b.bird && b.bird.on) { killBird(t, b); k.done = true; return true; }
    if (b.link >= 0 && F.links[b.link].alive) { b.wob = 1; sfx.ping(); floater('LOCKED', CX, CY + R + 70, '#c3c3ca'); deflect(k); return true; }
    if (b.sub === 'swirl' && b.hp > 1) { b.hp--; b.wob = 1.4; sfx.boing(); floater('BOING', CX, CY + R + 70, '#ffd23f'); deflect(k, Math.random() < 0.5 ? -1 : 1, 1.2); return true; }
    breakBranch(t, b, false); deflect(k); return true;
  }
  for (const s of F.saws) {
    if (!s.alive) continue;
    const reach = R + 30 - s.cut * R * 0.6;
    if (inArc(a, s.a, 0.17) && tip <= CY + reach) { hitSaw(t, s); deflect(k, Math.random() < 0.5 ? -1 : 1, 1.1); return true; }
  }
  for (const b of F.bushes) {
    if (!b.alive || !inArc(a, b.a, b.w) || tip > CY + R + 22) continue;
    breakBush(t, b, false);                 // the knife carries on through the leaves
  }
  return false;
}

// ---------- rim hits: where the knife lands decides what happens ----------
function stickNormal(k, t) {
  const F = t.f, a = normA(HALF - t.rot);
  if (F && F.treehole && inArc(a, F.treehole.a, F.treehole.w)) { swallow(k, t); return; }
  if (F) for (const z of F.arcs) if (inArc(a, z.a, z.w)) { electrocute(k, t); return; }
  k.done = true; chargeAbility();
  const s = { a, wob: 0.09 }; t.stuck.push(s); addMark(t, a);
  t.hit = 1; score++;
  burst(CX, CY + R, 8, [t.pal.light, t.pal.dark, t.pal.bark], 260, 60, 5, 0.55);
  for (let i = 0; i < 9; i++) splinter(CX + rand(-4, 4), CY + R - 4, t, 340);
  for (let i = 0; i < 5; i++) smoke.push({ x: CX + rand(-6, 6), y: CY + R, vx: rand(-50, 50), vy: rand(10, 60), r: rand(2, 4), life: rand(0.4, 0.8), max: 0.8, g: 120, c: t.pal.light });
  sfx.thunk(); buzz(8);
  let soaked = false, dmg = 1;
  if (F && F.bark && F.bark.hp > 0) { soaked = true; s.inBark = true; hitBark(t); }
  else if (F) {
    const m = F.moss.find(m => m.hp > 0 && inArc(a, m.a, m.w));
    if (m) { soaked = true; hitMoss(t, m); }
    else { const h = F.holes.find(h => inArc(a, h.a, h.w)); if (h) { dmg = 2; holeHit(t, h); } }
  }
  if (soaked) knivesLeft++;
  else { knivesLeft = Math.max(0, knivesLeft - (dmg - 1)); score += dmg - 1; }
  if (F) for (const b of F.branches) if (b.alive && b.bird && b.bird.on && inArc(a, b.a, 0.5)) scareBird(t, b);
  holdForBranches(t);
}

function holdForBranches(t) {
  if (branchesLeft(t) > 0 && knivesLeft < 1) { knivesLeft = 1; if (typeHint <= 0) { floater('BREAK BRANCHES', CX, CY + R + 80, '#7fbf3a'); typeHint = 1.5; } }
}

// ---------- branch breaks, each with its own show ----------
function leafBurst(x, y, n, spd = 260) {
  for (let i = 0; i < n; i++) { const a = rand(TAU), s = rand(60, spd); fxp.push({ kind: 'leaf', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, ph: rand(TAU), rot: rand(TAU), life: rand(1.4, 2.4), max: 2.4, c: ['#7fbf3a', '#3d6b1f', '#b6e05a'][Math.floor(rand(3))] }); }
}
function branchDebris(t, b, extra = {}) {
  const [x, y] = worldAt(t, b.a, R + b.len / 2), w = t.rot + b.a;
  debris.push(Object.assign({ kind: 'branch', b, x, y, vx: Math.cos(w) * rand(200, 380) + rand(-60, 60), vy: Math.sin(w) * rand(200, 380) - 260, rot: w, vr: rand(-9, 9) }, extra));
}
function breakBranch(t, b, byAbility) {
  if (!b.alive) return;
  b.alive = false;
  const [x, y] = worldAt(t, b.a, R + b.len * 0.6);
  shake = Math.max(shake, 8);
  burst(x, y, 16, ['#874419', '#c97a35', '#45210b'], 380, 80, 4, 0.7);
  switch (b.sub) {
    case 'swirl': {
      debris.push({ kind: 'spring', x, y, vx: rand(-200, 200), vy: -420, rot: 0, vr: (Math.random() < 0.5 ? -1 : 1) * 26, age: 0 });
      leafBurst(x, y, 6); sfx.boing(); sfx.snap(); floater('SPRUNG', x, y - 20, '#ffd23f');
      break;
    }
    case 'fire': {
      branchDebris(t, b, { fire: true });
      for (let i = 0; i < 18; i++) smoke.push({ x, y, vx: rand(-60, 60), vy: rand(-90, -20), r: rand(4, 9), life: rand(1, 2), max: 2, g: rand(50, 110) });
      embers(x, y, 40, 500); sfx.hiss(); sfx.snap(); floater('DOUSED', x, y - 20, '#ff7a1a');
      break;
    }
    case 'hive': {
      debris.push({ kind: 'hive', x, y, vx: rand(-80, 80), vy: -120, rot: 0, vr: rand(-4, 4) });

function breakFeatures(t) {

// ---------- update ----------
function update(dt) {
  time += dt;
  heartT = Math.max(0, heartT - dt * 1.5);
  updateAbility(dt);
  if (updateFx(dt)) return;                               // ability hit-stop freeze
  dt *= tscale;
  if (state === 'impact') {
    impactT = Math.max(0, impactT - dt);
    const el = IMPACT_TOTAL - impactT;
    if (el < hitstopLen()) return;                         // frozen impact frame
    if (finale) {
      if (!exploded) {
        exploded = true; shake = 30;
        if (tgt) { breakTarget(tgt, 2.2); tgt = null; }
        for (const f of flying) shatterKnife(f.y); flying = [];
        burst(CX, impactY, 50, ['#ffffff', '#dddddd'], 900, 0, 6, 0.8);
      }
      dt *= 0.25;                                          // heavy slow-mo until the screen breaks
      if (el >= FINAL_SNAP && !snapReq) { snapReq = true; shake = 0; }
    }
    else if (el < HITSTOP + 0.3) dt *= 0.3;                // slow-mo
    gray = finale || el < GRAY_HOLD ? 1 : clamp(1 - (el - GRAY_HOLD) / (IMPACT_TOTAL - GRAY_HOLD), 0, 1);
    if (!finale && el >= GRAY_HOLD && !unfrozen) { unfrozen = true; sfx.unfreeze(); }
    if (impactT <= 0) {
      gray = 0; frac = null;
      if (lives > 0) state = 'play';
      else { state = 'dying'; overT = 0.4; }
    }
  }
  const t = tgt;
  if (t && state !== 'rewind') {
    t.t += dt;
    t.pop = Math.min(1, t.pop + dt / 0.75);
    if (!t.landed && t.pop > 0.37) {
      t.landed = true; shake = Math.max(shake, 9); shock(CX, CY + R, 0.45, 160);
      for (let i = 0; i < 22; i++) { const sd = i % 2 ? 1 : -1; smoke.push({ x: CX + sd * rand(10, R), y: CY + R + rand(-4, 6), vx: sd * rand(60, 220), vy: rand(-60, -10), r: rand(5, 10), life: rand(0.7, 1.3), max: 1.3, g: 110, c: '#8d8d97' }); }
      for (let i = 0; i < 14; i++) splinter(CX + rand(-R, R), CY + R, t, 300);
      sfx.land();
    }
    t.rot += t.pat(t.t) * dt;
    t.hit = Math.max(0, t.hit - dt * 7);
    for (const k of t.stuck) if (k.wob) k.wob *= Math.exp(-dt * 4);
    emitSmoke(t, dt);
    updateFeatures(t, dt);
  }
  updateSmoke(dt);
  updateFxp(dt);
  readyT = Math.max(0, readyT - dt);

  for (const k of flying) {
    if (k.hold) continue;
    let move = SPEED * dt * (k.fast || 1);
    while (move > 0 && !k.done && !k.hold) { const st = Math.min(8, move); move -= st; k.y -= st; stepKnife(k); }
  }
  flying = flying.filter(k => !k.done);
  if (state === 'play' && knivesLeft === 0 && flying.length === 0 && branchesLeft(tgt) === 0) clearStage();

  for (const d of debris) { if (d.kind === 'shard' || d.kind === 'glass') d.vx *= 1 - dt * 1.5; d.x += d.vx * dt; d.y += d.vy * dt; d.vy += (d.kind === 'half' ? 700 : 1500) * dt; d.rot += d.vr * dt; }
  for (const r of rings) r.t += dt;
  rings = rings.filter(r => r.t < r.max);
  debris = debris.filter(d => d.y < H + 220 && d.x > -220 && d.x < W + 220);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; p.rot += p.vr * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);

  shake = Math.max(0, shake - dt * 40);
  banner.t = Math.max(0, banner.t - dt);

  if (state === 'dying') { overT -= dt; if (overT <= 0) { state = 'over'; overT = 0.6; sfx.over(); } }
  else if (state === 'over') { overT = Math.max(0, overT - dt); overAge += dt; }
  else if (state === 'rewind') {
    rewindT += dt;
    if (!rewFlashed && rewindT >= REW_FLASH) { rewFlashed = true; pieces = []; sfx.flash(); buzz(20); }
    if (!rewSwitched && rewindT >= REW_SWITCH) { rewSwitched = true; makePopup(); sfx.lightSwitch(); shake = 6; buzz([30, 50, 15, 40, 15]); }
    if (rewindT >= REW_BREAK) { shatterPopup(); sfx.popBreak(); shake = 10; state = 'play'; readyT = 0.25; buzz(25); }
  }
  else if (state === 'clearing') { clearT -= dt; if (clearT <= 0) { stage++; newStage(); } }
  updatePieces(dt);
}

  drawFloaters();
  if (state === 'impact') drawImpact();
  if (fx && fx.t < fx.freeze) { ctx.save(); applyCam(); drawFxImpactFrame(); ctx.restore(); }
  drawScreenHits();
  drawMute();
}

function draw() {
  if (state === 'over') {
    drawOverScreen(); drawPieces();
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy); drawMute();
    if (cv.style.filter !== 'grayscale(1)') cv.style.filter = 'grayscale(1)';
    pixelate();
    return;
  }
  if (state === 'rewind') { drawRewind(); pixelate(); return; }
  drawScene();
  const el = IMPACT_TOTAL - impactT;
  // pure two-tone black & white (inverted on the impact frame), easing back to colour
  if (snapReq && state === 'impact') {
    shatterScreen(); snapReq = false;
    state = 'over'; overAge = 0; overT = 0.9; gray = 0; frac = null;
    sfx.screenBreak(); buzz([60, 30, 60]);
    return;   // the next frame draws the losing screen under the falling pieces
  }
  drawRipple();
  postFX();
  const f = fxFilter ? fxFilter : zapT > 0.85 ? (Math.floor(time * 30) % 2 ? INVERT : TWO_TONE) : state === 'impact' && el < hitstopLen() ? 'grayscale(1) contrast(40) invert(1)'
    : gray > 0 ? `grayscale(${gray.toFixed(3)}) contrast(${(1 + 39 * Math.pow(gray, 3)).toFixed(3)})` : 'none';
  if (cv.style.filter !== f) cv.style.filter = f;
  if (pieces.length) drawPieces();
  pixelate();
}

// ---------- pixel look: limited palette + 4x4 ordered dither ----------
const PALETTE = [
  '#000000', '#0d0d10', '#1e1e24', '#38383f', '#5c5c66', '#8d8d97', '#c3c3ca', '#ffffff',   // monochrome ramp
  '#ff2e45', '#d8402f', '#a3122a', '#4a0712',                                                       // blood reds
  '#ffe2a6', '#f2b766', '#c97a35', '#874419', '#45210b',                                   // wood
  '#ffd23f', '#ff7a1a',                                                                     // gold / ember
  '#2ad8ff', '#1f5fd1', '#9466ff', '#7fbf3a',                                               // cool + boss accents
].map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v / 16 - 0.5) * 34);
const LUT = new Uint8Array(32768);
(function buildLut() {
  for (let i = 0; i < 32768; i++) {
    const r = (i >> 10) * 8 + 4, g = ((i >> 5) & 31) * 8 + 4, b = (i & 31) * 8 + 4;
    let bi = 0, bd = 1e9;
    PALETTE.forEach((p, j) => { const dr = r - p[0], dg = g - p[1], db = b - p[2]; const d = dr * dr * 0.3 + dg * dg * 0.59 + db * db * 0.11; if (d < bd) { bd = d; bi = j; } });
    LUT[i] = bi;
  }
})();
function pixelate() {
  let img;
  try { img = ctx.getImageData(0, 0, cv.width, cv.height); } catch (e) { return; }
  const d = img.data, w = cv.width;
  for (let y = 0, i = 0; y < cv.height; y++) {
    const row = (y & 3) << 2;
    for (let x = 0; x < w; x++, i += 4) {
      const o = BAYER[row | (x & 3)];
      const r = d[i] + o, g = d[i + 1] + o, b = d[i + 2] + o;
      const p = PALETTE[LUT[((r < 0 ? 0 : r > 255 ? 255 : r) >> 3) << 10 | ((g < 0 ? 0 : g > 255 ? 255 : g) >> 3) << 5 | ((b < 0 ? 0 : b > 255 ? 255 : b) >> 3)]];
      d[i] = p[0]; d[i + 1] = p[1]; d[i + 2] = p[2]; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

// ---------- fast monochrome backdrop ----------
function drawBackdrop() {
  ctx.fillStyle = '#060608'; ctx.fillRect(-W, -H, W * 3, H * 3);
  // scrolling diagonal hazard bands
  ctx.save(); ctx.globalAlpha = 0.5; ctx.fillStyle = '#16161b';
  const off = (time * 140) % 60;
  for (let x = -W - 400; x < W * 2; x += 60) { ctx.beginPath(); ctx.moveTo(x + off, -H); ctx.lineTo(x + off + 22, -H); ctx.lineTo(x + off + 22 + H * 3 * 0.35, H * 2); ctx.lineTo(x + off + H * 3 * 0.35, H * 2); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  // halftone dots, denser toward the bottom
  ctx.fillStyle = '#1e1e24';
  for (let y = 300; y < H + 120; y += 12) for (let x = -60 + ((y / 12) % 2) * 6; x < W + 60; x += 12) {
    const r = clamp((y - 300) / 520, 0, 1) * 3.2; if (r > 0.5) ctx.fillRect(x - r / 2, y - r / 2, r, r);
  }
  // speed streaks rushing past
  for (let i = 0; i < 26; i++) {
    const x = hash(i, 0, 21) * (W + 120) - 60, sp = 500 + hash(i, 0, 22) * 900, len = 20 + hash(i, 0, 23) * 70;
    const y = ((time * sp + hash(i, 0, 24) * 2000) % (H + 400)) - 200;
    ctx.fillStyle = hash(i, 0, 25) < 0.25 ? '#ffffff' : '#38383f';
    ctx.fillRect(Math.round(x), y, 2, len);
  }
  // dithered halo behind the log
  const g = ctx.createRadialGradient(CX, CY, R * 0.6, CX, CY, R * 2.6);
  g.addColorStop(0, tgt && tgt.boss ? 'rgba(255,46,69,.45)' : 'rgba(255,210,63,.32)'); g.addColorStop(0.5, 'rgba(255,255,255,.06)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(CX - R * 3, CY - R * 3, R * 6, R * 6);
  // rotating reticle around the log
  ctx.save(); ctx.translate(CX, CY); ctx.rotate(-time * 0.6);
  ctx.strokeStyle = '#5c5c66'; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
  ctx.beginPath(); ctx.arc(0, 0, R + 44, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 4; i++) { ctx.rotate(HALF); ctx.fillRect(-2, -R - 58, 4, 12); }
  ctx.rotate(time * 1.4);
  ctx.strokeStyle = '#38383f'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 24; i++) { ctx.rotate(TAU / 24); ctx.beginPath(); ctx.moveTo(0, -R - 30); ctx.lineTo(0, -R - (i % 3 ? 34 : 40)); ctx.stroke(); }
  ctx.restore();
  // runway: dashed lane from the knife to the log, scrolling upward
  ctx.fillStyle = '#2a2a31';
  const lo = (time * 260) % 24;
  for (let y = KNIFE_Y + KL + 20 - lo; y > CY + R + 30; y -= 24) ctx.fillRect(CX - 1.5, y, 3, 12);
  ctx.fillStyle = '#1e1e24'; ctx.fillRect(CX - 40, CY + R + 26, 2, KNIFE_Y + KL - CY - R - 6); ctx.fillRect(CX + 38, CY + R + 26, 2, KNIFE_Y + KL - CY - R - 6);
  // scanlines
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  for (let y = -H; y < H * 2; y += 3) ctx.fillRect(-W, y, W * 3, 1);
}

// ---------- input ----------
function toVirtual(e) { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left - ox) / scale, (e.clientY - b.top - oy) / scale]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const [x, y] = toVirtual(e);
  if (Math.hypot(x - (W - 34), y - 34) < 24) { muted = !muted; save('knaife.muted', muted); ac(); return; }
  if ((state === 'play' || state === 'fx') && Math.hypot(x - BTN[0], y - BTN[1]) < 40) { ac(); activateAbility(); return; }
  action();
});
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp') { e.preventDefault(); action(); }
  else if (e.code === 'KeyM') { muted = !muted; save('knaife.muted', muted); }
  else if (e.code === 'KeyE' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') { ac(); activateAbility(); }
});

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
menuTarget();
requestAnimationFrame(frame);
// test hook
window.__knaife = { get lives() { return lives; }, get state() { return state; }, get score() { return score; }, get stage() { return stage; }, get knivesLeft() { return knivesLeft; } };
</script>
</body>

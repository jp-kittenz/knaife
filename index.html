<script>
'use strict';
// ---------- setup ----------
const view = document.getElementById('c');          // what the player sees (WebGL post-process)
const cv = document.createElement('canvas');         // where the game is drawn (GPU-accelerated 2D)
let GL = null, view2d = null;
let ctx = cv.getContext('2d');
const TAU = Math.PI * 2, HALF = Math.PI / 2;
const W = 420, H = 760;                 // virtual playfield
const CX = W / 2, CY = 255, R = 92;     // target
const KL = 118, EMBED = 20;             // knife length, how deep it sinks in
const KNIFE_Y = H - 150;                // tip y of the ready knife
const SPEED = 3300;                     // knife speed px/s
let dpr = 1, scale = 1, ox = 0, oy = 0;

let PIX = 0.8;
const FONT = '"Silkscreen", "Courier New", monospace', DISPLAY = '"Bungee", "Silkscreen", "Arial Black", sans-serif';
try { document.fonts.load('400 30px Bungee'); } catch (e) {}                         // virtual units per art pixel
const MAX_PIXELS = 480000, Q_SCALE = [1, 0.78, 0.6, 0.45];
let qLevel = 0, fEma = 16.7, qTimer = 0;
function resize() {
  const cw = view.clientWidth || window.innerWidth, ch = view.clientHeight || window.innerHeight;
  scale = Math.min(cw / W, ch / H);
  let p = PIX; const count = (cw / (p * scale)) * (ch / (p * scale)), budget = MAX_PIXELS * Q_SCALE[qLevel];
  if (count > budget) p *= Math.sqrt(count / budget);
  dpr = 1 / (p * scale);
  cv.width = Math.max(1, Math.round(cw * dpr)); cv.height = Math.max(1, Math.round(ch * dpr));
  view.width = cv.width; view.height = cv.height;
  if (GL) GL.gl.viewport(0, 0, view.width, view.height);
  ox = (cw - W * scale) / 2; oy = (ch - H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => Math.abs((((a - b + Math.PI) % TAU) + TAU) % TAU - Math.PI);
const easeOutBack = t => { const c = 1.70158; t -= 1; return 1 + (c + 1) * t * t * t + c * t * t; };

function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// ---------- audio ----------
let actx = null, master = null, verb = null, noiseBuf = null, musicDuck = 1, muted = load('knaife.muted', false);
// stereo damped plate: 12ms pre-delay, four early reflections, then a tail whose highs die faster than its lows
function makeIR(a, secs) {

    for (let i = pre; i < len; i++) { const u = (i - pre) / (len - pre), k = 0.06 + 0.88 * u; lp += ((Math.random() * 2 - 1) - lp) * (1 - k); d[i] = lp * Math.pow(1 - u, 2.4) * (1 + k); }
    for (const [ms, g] of [[19, 0.45], [31, 0.32], [47, 0.24], [63, 0.17]]) { const j = Math.floor(sr * (ms + c * 3.7) / 1000); if (j < len) d[j] += g * (c ? -1 : 1); }

}
// bus: voices -> (panner) -> glue compressor -> limiter -> out; send -> high-passed plate -> glue
function ac() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    master = actx.createDynamicsCompressor(); master.threshold.value = -16; master.knee.value = 10; master.ratio.value = 4; master.attack.value = 0.003; master.release.value = 0.18;
    const lim = actx.createDynamicsCompressor(); lim.threshold.value = -2; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.001; lim.release.value = 0.08;
    const mg = actx.createGain(); mg.gain.value = 0.92; master.connect(lim).connect(mg).connect(actx.destination);
    const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 220;
    const conv = actx.createConvolver(); conv.buffer = makeIR(actx, 2.4); const vg = actx.createGain(); vg.gain.value = 0.85;
    hp.connect(conv).connect(vg).connect(master); verb = hp;
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate); const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  }

}
// heavy hits push the music down for a beat so the impact reads
function duck(v) { musicDuck = Math.min(musicDuck, v); }
let driveCurve = null;
function route(a, node, o) {
  let n = node;
  if (o.drive) {
    if (!driveCurve) { driveCurve = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; driveCurve[i] = Math.tanh(x * 4); } }
    const ws = a.createWaveShaper(); ws.curve = driveCurve; n.connect(ws); n = ws;
  }
  if (a.createStereoPanner) { const pn = a.createStereoPanner(); pn.pan.value = o.pan !== undefined ? o.pan : (Math.random() - 0.5) * 0.32; n.connect(pn); n = pn; }
  n.connect(master);

}
// every voice is varied a little (pitch, pan) so repeats never machine-gun
function tone(type, f0, f1, dur, vol, o = {}) {
  const a = ac(); if (!a || muted) return;
  const pv = o.exact ? 1 : 1 + (Math.random() - 0.5) * 0.06;
  const t = a.currentTime + (o.delay || 0), osc = a.createOscillator(), g = a.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f0 * pv, t); osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1 * pv), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (o.attack || 0.003)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

}
const envCache = new Map();
function envCurve(rise, curve) {
  const k = (rise ? 'r' : 'd') + curve; let c = envCache.get(k);
  if (!c) { c = new Float32Array(48); for (let i = 0; i < 48; i++) { const u = i / 47; c[i] = rise ? u * (u < 0.97 ? 1 : (1 - u) / 0.03) : Math.pow(1 - u, curve); } envCache.set(k, c); }
  return c;
}
function noise(dur, freq, q, vol, type = 'bandpass', o = {}) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + (o.delay || 0), pv = o.exact ? 1 : 1 + (Math.random() - 0.5) * 0.12;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = noiseBuf; src.loop = dur > 1.8; src.playbackRate.value = pv;
  f.type = type; f.frequency.setValueAtTime(freq * pv, t); f.Q.value = q;
  if (o.sweepTo) f.frequency.exponentialRampToValueAtTime(o.sweepTo * pv, t + dur);
  const shape = envCurve(!!o.rise, o.curve || 1), cv2 = new Float32Array(shape.length); for (let i = 0; i < shape.length; i++) cv2[i] = Math.max(0.00001, shape[i] * vol);
  g.gain.setValueCurveAtTime(cv2, t, dur);
  src.connect(f).connect(g); route(a, g, o); src.start(t, src.loop ? 0 : Math.random() * Math.max(0, 1.9 - dur)); src.stop(t + dur + 0.02);

const sfx = {
  whoosh() { noise(0.13, 2600, 1.2, 0.24, 'bandpass', { sweepTo: 700, curve: 1.6 }); noise(0.09, 600, 0.7, 0.14, 'lowpass', { curve: 2 }); tone('sine', 2600, 3700, 0.05, 0.022, { attack: 0.002 }); },
  thunk() { const d = rand(0.93, 1.07); noise(0.018, 4200, 0.8, 0.42, 'highpass'); noise(0.07, 720 * d, 5, 0.95, 'bandpass', { curve: 2.5 }); tone('triangle', 320 * d, 150, 0.09, 0.28); tone('sine', 150 * d, 46, 0.18, 0.72, { drive: true }); tone('triangle', 1880 * d, 1840 * d, 0.34, 0.035, { wet: 0.5, delay: 0.012 }); tone('sine', 2930 * d, 2900 * d, 0.24, 0.018, { delay: 0.012 }); },
  clang() { const f = rand(590, 650); [[1, 0.13, 0.9], [2.76, 0.09, 0.6], [5.4, 0.05, 0.42], [8.93, 0.03, 0.3]].forEach(([r, g, d], i) => tone(i ? 'sine' : 'triangle', f * r, f * r * 0.995, d, g, { wet: 0.55, attack: 0.001 })); noise(0.05, 6200, 1.2, 0.5, 'highpass', { curve: 2 }); tone('sine', 150, 60, 0.14, 0.5, { drive: true }); },
  apple() { tone('sine', 620, 1250, 0.13, 0.22); noise(0.06, 2600, 1, 0.3); noise(0.12, 900, 2, 0.25, 'bandpass', { delay: 0.03, sweepTo: 300 }); tone('triangle', 1250, 1880, 0.1, 0.1, { delay: 0.08, wet: 0.4 }); },
  smash() { noise(0.5, 650, 0.6, 0.75, 'bandpass', { wet: 0.3 }); tone('sine', 140, 32, 0.5, 0.65, { drive: true, wet: 0.3 }); noise(0.09, 3200, 1, 0.5, 'highpass'); for (let i = 0; i < 6; i++) noise(0.06, 900 + rand(0, 1800), 3, 0.2, 'bandpass', { delay: 0.08 + i * 0.05 + rand(0, 0.03) }); },
  combo(n) { const sc = [0, 2, 4, 7, 9], k = Math.min(n, 12), f = 523.25 * Math.pow(2, (sc[k % 5] + 12 * Math.floor(k / 5)) / 12); tone('sine', f, f, 0.32, 0.11, { wet: 0.5, exact: true }); tone('sine', f * 2.01, f * 2.01, 0.16, 0.035, { exact: true }); tone('triangle', f * 4, f * 4, 0.05, 0.02, { exact: true, delay: 0.005 }); },
  finisher() { noise(0.25, 300, 1, 0.3, 'bandpass', { rise: true, sweepTo: 3000 }); tone('sine', 90, 30, 0.6, 0.7, { delay: 0.05, drive: true, wet: 0.4 }); tone('triangle', 880, 1760, 0.25, 0.1, { delay: 0.05, wet: 0.6 }); },
  over() {

    if (a !== undefined) { tgt.f.branches.push(makeBranch(a, 'bird')); pending.push({ t: 0.6, f: () => { floater("BIRD'S HEART: A BIRD LANDS", CX, CY - R - 40, '#ff2e45'); sfx.tweet(); abil.pop.passive2 = 1; } }); }
  }
  fxp = []; pending = []; zapT = 0; ghostSaws = []; ixq = []; sporeT = 0;
  if (abil.state === 'used' && !fx) { abil.state = 'cooldown'; abil.charge = 0; }

  if (nestB) {   // in disguise: a branched log with one beehive on it
    const F = tgt.f, taken = tgt.stuck.map(s => s.a).concat(tgt.apples.map(a => a.a));
    const far = () => { let best = 0, bd = -1; for (let i = 0; i < 72; i++) { const a = i / 72 * TAU, d = Math.min(9, ...taken.map(q => angDiff(q, a))); if (d > bd) { bd = d; best = a; } } taken.push(best); return best; };
    const ha = far(), pa = far();
    F.branches = [makeBranch(ha, 'hive'), makeBranch(pa, 'plain')]; F.links = [];
    tgt.nestBait = true; knivesTotal = knivesLeft = Math.min(5 + Math.ceil(stage * 0.6), 10);

}

// ---------- actions ----------

}

function stepKnife(k) {
  if (k.slicing) { if (k.y < -KL - 400) k.done = true; return; }
  const t = tgt;
  if (!t) { if (k.y < -KL - 60) k.done = true; return; }
  const tip = k.y;
  if (k.ability) k.trail.push(tip);
  if (t.gear) sprocketHit(k, t);
  if (t.gear && gearChainHit(k, t)) return;
  if (t.tire && !k.ability && !k.wood && tireNutHit(k, t)) return;
  if (t.nest && nestFlightHit(k, t)) return;
  if (t.wire && wireFlightHit(k, t)) return;
  // hit another knife?
  let hitWood = false;
  if (!k.pierce) for (const s of t.stuck) {
    if (hitWood) { hitWood = false; }
    const w = t.rot + s.a;
    if (angDiff(w, HALF) > 0.7) continue;
    const sk = R - EMBED - (s.sink || 0), bw = w + knifeTilt(s), ex = CX + Math.cos(w) * sk, ey = CY + Math.sin(w) * sk;
    const c = Math.cos(bw), sn = Math.sin(bw);
    for (let r = 8; r <= KL; r += 5) {
      const px = ex + r * c, py = ey + r * sn, d = px - CX;
      if (Math.abs(d) < 10 && py >= tip && py <= tip + KL) {
        if (s.hidden) { s.hidden = false; s.reveal = 0.001; revealFlash(t, s); for (const b of (t.f ? t.f.bushes : [])) if (b.alive && inArc(s.a, b.a, b.w + 0.05)) { b.alive = false; const [bx, by] = worldAt(t, b.a, R + 8); leafBurst(bx, by, 30, 420); } }
        if (k.wood) { k.done = true; splitWood(CX, k.y + 30, 0); knivesLeft = Math.max(0, knivesLeft - 1); score++; holdForBranches(t); floater('SPLIT -1', CX, k.y + 50, '#f2cf94'); return; }
        if (s.wood && !k.ability) {
          t.stuck.splice(t.stuck.indexOf(s), 1); splitWood(px, py, t.rot + s.a - HALF); k.woodBonus = true;
          kick(0.18, 0.05, 0.9, 0.5); shocks(px, py, 2, 90); shake = Math.max(shake, 14); floater('SPLIT X2', px, py - 20, '#f2cf94'); sfx.clank(); buzz([30, 20, 40]);
          hitWood = true; break;
        }
        if (t.tire && t.tire.ripe && t.tire.layer === 'rubber' && !k.wood) { tireKnockOut(k, t, s, px, py); return; }
        if (!k.ability && !k.wood && nestKnifeInfested(t, s)) { burst(px, py, 14, ['#ffd23f', '#08080a'], 300, 20, 2.5, 0.3); nestSwarm(k, t, 'INFESTED KNIFE!'); return; }
        if (k.ability && !k.grazed && Math.abs(d) >= GRAZE) abilityGraze(k, s, px, py);
        else if (k.ability) abilityClank(k, s);
        else if (Math.abs(d) >= GRAZE) ricochet(k, s, d, px, py);
        else fail(k);
        return;
      }
    }
  }
  if (t.tank && !k.ability && !k.wood && tankPipeHit(k, t)) return;
  if (t.gear && !k.ability && !k.wood && gearPinionHit(k, t)) return;
  if (t.tire && !k.ability && !k.wood && tireBladeHit(k, t)) return;
  if (!k.ability && !k.wood && featureHits(k, t)) return;
  if (k.ability) abilityBranchPass(k, t);
  for (const p of (t.pickups || []).slice()) { const w = t.rot + p.a; if (angDiff(w, HALF) < 0.2 && tip <= CY + R + 30) collectPickup(t, p, w); }
  // slice apples
  for (const ap of t.apples) {
    if (ap.cut) continue;
    const w = t.rot + ap.a;
    if (angDiff(w, HALF) < 0.2 && tip <= CY + R + 25) { sliceApple(ap, w); if (k.ability) abilityApple(k); }
  }
  // stick
  if (tip <= CY + R - EMBED) {
    if (k.ability) { abilityStick(k); return; }
    if (k.wood) { woodStick(k, t); return; }
    stickNormal(k, t);
  }
}

function sliceApple(ap, w) {

  const x = CX + Math.cos(w) * (R + 12), y = CY + Math.sin(w) * (R + 12);
  for (const side of [-1, 1]) debris.push({ kind: 'apple', half: side, x, y, vx: side * rand(120, 220), vy: rand(-380, -260), rot: 0, vr: side * rand(4, 8) });

    const pts = []; for (let j = 0; j < 3; j++) { const r = rand(3, 8), ang = j / 3 * TAU + rand(-0.6, 0.6); pts.push([Math.cos(ang) * r, Math.sin(ang) * r]); }
    debris.push({ kind: 'shard', x, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 150, rot: rand(TAU), vr: rand(-20, 20), c, pts });

function fail(k) {

    debris.push({ kind: 'glass', x: CX + rand(-10, 10), y: k.y + rand(-10, 10), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200, rot: rand(TAU), vr: rand(-14, 14), pts });
  }

  const nl = finale ? 26 : 16;

function breakTarget(t, power = 1, halves = false) {

  }

  cuts.push(TAU);

    debris.push({ kind: 'wedge', a0: cuts[i], a1: cuts[i + 1], t, x: CX, y: CY, vx: Math.cos(mid) * s, vy: Math.sin(mid) * s - 320, rot: t.rot, vr: rand(-3, 3) * power });
  }

  }

function clearStage() {
  const t = tgt;
  if (t.tank && !t.tank.dead) { t.tank.dead = true; startTankDeath(t); return; }
  if (t.gear && !t.gear.dead) { t.gear.dead = true; startGearDeath(t); return; }

  state = 'clearing'; clearT = CLEAR_TOTAL; clearCues = {};

  breakTarget(t);
  if (t.boss) { banner = { text: 'BOSS DOWN!', sub: '+5 bonus', t: 1.1, color: '#ffd35c' }; score += 5; }

// ---------- ability: Strong Throw (Regular Knife) ----------
const BTN = [W - 56, H - 80];
const KNIFE_MID = () => [CX, KNIFE_Y + KL / 2];
const abil = { state: 'ready', charge: 0, need: 4, swirl: null, flash: 0 };
const INVERT = 'grayscale(1) contrast(40) invert(1)', TWO_TONE = 'grayscale(1) contrast(40)';
const CANVAS_FILTER = typeof ctx.filter === 'string';
let fx = null, tscale = 1, fxFilter = null, slash = 0, ripple = null, rippleBuf = null;
let smoke = [], screenHits = [], floaters = [], rings = [];
const hash = (i, q, k) => { const v = Math.sin(i * 12.9898 + q * 78.233 + k * 37.719) * 43758.5453; return v - Math.floor(v); };

function resetAbility() {
  abil.state = 'ready'; abil.charge = 0; abil.swirl = null; abil.flash = 0;
  fx = null; tscale = 1; fxFilter = null; slash = 0; ripple = null;
  smoke = []; screenHits = []; floaters = []; rings = [];
  waterLevel = waterTarget = 0; screenDrops = []; splashFlash = 0; paints = [];
  abil.items = []; abil.birds = 0; abil.ov = 0; abil.need = ABILITY.need; gameTimers.length = 0;
  stunT = 0; stunMax = 2; abil.pauseT = 0; fxp = []; pending = []; zapT = 0; camFocus(CX, CY, 1); cam.kz = cam.kr = 0; cinema(false); aberr = zblur = 0;
}

function makeSwirl(dir, from, to, dur) {
  const parts = [];
  for (let i = 0; i < 70; i++) parts.push({ a0: rand(TAU), r0: rand(14, 48), s: 2 + Math.floor(rand(3)) * 1.5, c: Math.random() < 0.5 ? '#fff' : '#000', off: rand(0, 0.18), spin: rand(0.7, 1.3) });
  return { dir, from, to, t: 0, dur, parts };
}

function activateAbility() {
  if (state !== 'play' || abil.state !== 'ready' || knivesLeft <= 0 || stunT > 0) return;
  if (abil.pauseT > 0) { sfx.bees(); floater('JAMMED', BTN[0] - 30, BTN[1] - 50, '#ffd23f'); return; }
  if (ABILITY.mode === 'instant') {
    if (ABILITY.id === 'cook' && !(abil.birds > 0)) { floater('NO BIRDS CAUGHT', BTN[0] - 70, BTN[1] - 50, '#ffa04a'); sfx.denied(); return; }
    abil.state = 'arming'; abil.swirl = makeSwirl('in', BTN, [CX, CY], 0.6); sfx.abilityArm(); buzz(15); return;
  }

}

function summonButton(x, y) {
  abil.state = 'summoning'; abil.swirl = makeSwirl('out', [x, y], BTN, 0.65);
  sfx.summon();
}

function chargeAbility() {
  if (abil.state !== 'cooldown') return;
  abil.charge += 1 + (abil.boost || 0); abil.boost = 0;
  if (abil.charge >= abil.need) { abil.state = 'ready'; abil.flash = 1; sfx.ready(); buzz(10); }
}

function updateAbility(rdt) {
  updateCam(rdt, !!(fx && fx.t < fx.freeze));
  updateFlights(rdt);
  for (const k in abil.pop) abil.pop[k] = Math.max(0, abil.pop[k] - rdt * 2.5);
  updatePending(rdt);
  zapT = Math.max(0, zapT - rdt);
  abil.pauseT = Math.max(0, (abil.pauseT || 0) - rdt);
  abil.flash = Math.max(0, abil.flash - rdt * 2);
  const sw = abil.swirl;
  if (sw) {
    sw.t += rdt;
    if (sw.t >= sw.dur) {
      abil.swirl = null;
      if (sw.dir === 'in' && ABILITY.mode === 'instant') { abil.state = 'used'; if (ABILITY.id === 'marker') placeMarker(); else if (ABILITY.id === 'cook') startCookFx((abil.birdCols || []).pop()); }
      else if (sw.dir === 'in') { abil.state = 'armed'; floater(ABILITY.name, CX, KNIFE_Y - 30, '#ffffff'); sfx.abilityArmed(); buzz([20, 30, 40]); kick(0.07, 0.02, 0.9, 0.5); shocks(CX, KNIFE_Y + KL / 2, 2, 60); burst(CX, KNIFE_Y + KL / 2, 40, ['#fff', '#000'], 360, 0, 4, 0.6); }
      else { abil.state = abil.charge >= abil.need ? 'ready' : 'cooldown'; }
    }
  }
  for (const f of floaters) f.t += rdt;
  floaters = floaters.filter(f => f.t < 1.1);
  for (const h of screenHits) {
    const was = h.t; h.t += rdt;
    if (was < 0 && h.t >= 0) { sfx.screenHit(); shake = Math.max(shake, 5); buzz(8); }
  }
  screenHits = screenHits.filter(h => h.t < h.life);
  if (ripple) { ripple.t += rdt; if (ripple.t > 0.42) ripple = null; }
  slash = Math.max(0, slash - rdt * 2.2);
}

function abilityThrow() {
  knivesLeft--;
  flying.push({ y: KNIFE_Y, done: false, ability: true, trail: [] });
  abil.state = 'used';
  fx = { type: 'flight', t: 0, freeze: 0 };
  state = 'fx'; readyT = 0;
  kick(0.1, 0.035, 0.8, 1.2); shake = 10; cinema(true, 0.9);
  burst(CX, KNIFE_Y + KL, 40, ['#fff', '#000', '#ccc'], 420, -100, 4, 0.7);
  sfx.heavyThrow(); sfx.riser(); sfx.heartbeat(); buzz(30);
}

function floater(text, x, y, color = '#fff') { floaters.push({ text, x, y, t: 0, color }); }
function shock(x, y, max = 0.5, size = 160, delay = 0) { rings.push({ x, y, t: -delay, max, size }); }
function shocks(x, y, n, size) { for (let i = 0; i < n; i++) shock(x, y, 0.55 + i * 0.12, size * (1 + i * 0.6), i * 0.07); }
function embers(x, y, n, spd) { burst(x, y, n, ['#ffffff', '#ffe08a', '#ffb347', '#ff7a3a'], spd, 260, 3, 1.4); }
function impactLinesFor(n, len) { return Array.from({ length: n }, (_, i) => ({ a: i / n * TAU + rand(-0.12, 0.12), r0: rand(30, 60), r1: rand(300, len), w: rand(3, 16) })); }

function addCrater(t, a) {
  const cracks = [];
  for (let i = 0; i < 6; i++) {
    const ang = Math.PI + rand(-1.1, 1.1), pts = [[R - 12, 0]];
    let x = R - 12, y = 0;
    for (let j = 0; j < 3; j++) { const l = rand(6, 13), aa = ang + rand(-0.35, 0.35); x += Math.cos(aa) * l; y += Math.sin(aa) * l; pts.push([x, y]); }
    cracks.push(pts);
  }
  t.craters.push({ a, cracks, smoke: 5, acc: 0 });
}

function drawCraters(t) {
  for (const c of t.craters) {
    ctx.save(); ctx.rotate(c.a);
    ctx.beginPath(); ctx.arc(0, 0, R - 0.5, 0, TAU); ctx.clip();
    const g = ctx.createRadialGradient(R - 8, 0, 2, R - 8, 0, 26);

  if (!k.hooked) { k.hooked = true; bonus = ABILITY.onImpact ? ABILITY.onImpact(t, normA(HALF - t.rot)) : 0; }
  const extra = (k.dmg === 1 ? 0 : 1) + bonus, remaining = Math.max(t.nestBait ? 1 : 0, knivesLeft - extra);
  const lethal = remaining === 0, id = abId(k), special = !namedBoss(t), clanked = !!(fx && fx.type === 'clank');
  if (lethal && special && !clanked) {
    if (k.grazed) { startAbKill(k, { strong: 'split', carve: 'planked', chain: 'arcflash' }[id]); return; }
    if (id !== 'strong') { startAbKill(k, id === 'carve' ? 'totem' : 'thunder'); return; }
    if (extra) { startSlice(k); caseBanner('strong', 'lethal'); return; }   // CASE 2
  }
  k.done = true;
  const a = HALF - t.rot, ns = { a, ability: true, wob: 0.14 };
  t.stuck.push(ns); addCrater(t, a); addMark(t, a);
  if (t.nest) nestCount(t, 1 + extra);
  knivesLeft = remaining; score += 1 + extra; t.hit = 1;
  if (t.f && t.f.treehole && inArc(a, t.f.treehole.a, t.f.treehole.w)) t.f.treehole.gulp = 1;
  burst(CX, CY + R, 90, [t.pal.light, t.pal.dark, t.pal.bark, '#222'], 820, 160, 8, 1.1);
  embers(CX, CY + R, 50, 700);
  if (clanked) {
    sfx.thunk(); sfx.abilityImpact(); shake = 14;
    if (lethal && special) lethalAfterKnife(k);                        // CASE 3, per knife
    else if (id === 'chain') startChain(t, ns);
    return;
  }
  if (id === 'carve') { startCarve(t, ns); caseBanner('carve', k.grazed ? 'graze' : t.boss ? 'boss' : 'hit', k.grazed ? 'GLANCED, THEN CARVED' : undefined); return; }
  // plain double-damage hit
  fx = { type: 'hit', t: 0, freeze: 0.3, x: CX, y: CY + R, lines: impactLinesFor(30, 1100) };
  shocks(CX, CY + R, 3, 220); if (id === 'strong') floater('X2', CX + 70, CY + R + 10, '#fff');
  kick(0.5, 0.09, 1.6, 1.4); camFocus(CX, CY + R, 1.25); plxKick(0, -50);
  sfx.abilityImpact(); sfx.subDrop(); shake = 36; buzz([80, 30, 120]);
  caseBanner(id, k.grazed ? 'graze' : t.boss ? 'boss' : 'hit', k.grazed ? 'GLANCED OFF A KNIFE, THEN STRUCK' : id === 'strong' ? 'DOUBLE DAMAGE' : undefined);
  if (id === 'chain') { fx.summoned = true; startChain(t, ns); zapT = Math.max(zapT, 0.5); }
}

function abilityClank(k, s) {                                           // CASE 1 / 3 start

  fx = { type: 'clank', t: 0, freeze: 0.32, x: CX, y: k.y, k, s, exploded: 0, lethal: false, frac: makeFracture(), lines: impactLinesFor(26, 1000), id: abId(k) };

function explodeHitKnife() {

function startSlice(k) {                                                 // CASE 2

function doSlice() {

function endFx(next) {
  const boss = fx && fx.boss;
  fx = null; fxFilter = null; tscale = 1;
  camFocus(CX, CY, 1); cinema(false);
  if (next === 'play') { state = 'play'; readyT = 0.15; }
  else {
    state = 'clearing'; clearT = CLEAR_TOTAL; clearCues = {};
    if (boss) { banner = { text: 'BOSS DOWN!', sub: '+5 bonus', t: 1.1, color: '#ffd35c' }; score += 5; }
  }
}

// returns true while the game is frozen on an impact frame
function updateFx(rdt) {
  if (!fx) return false;
  fx.t += rdt; const t = fx.t;
  if (t < fx.freeze) { fxFilter = Math.floor(t / 0.05) % 2 ? TWO_TONE : INVERT; return true; }
  fxFilter = null;
  switch (fx.type) {
    case 'flight': {
      tscale = Math.max(0.16, 1 - t * 9);
      const kn = flying.find(k => k.ability);
      if (kn) { camFocus(CX, (kn.y + CY + R) / 2 + 30, 1.3); zblur = Math.max(zblur, 0.55); }
      if (!kn) endFx('play');                                         // safety: knife vanished
      break;
    }
    case 'graze': { const e = t - fx.freeze; tscale = e < 0.45 ? 0.14 : clamp(0.14 + (e - 0.45) * 2.5, 0.14, 1); if (e > 0.5) camFocus(CX, CY, 1); if (e > 1.4) endFx('play'); break; }
    case 'abkill': updateAbKill(t); break;
    case 'finish':
      tscale = clamp(0.1 + t / 0.34 * 0.9, 0.1, 1);
      if (t > 0.38) endFx('play');
      break;
    case 'hit':
      tscale = clamp(0.12 + (t - fx.freeze) / 0.8 * 0.88, 0.12, 1);
      if (t > 0.7) { camFocus(CX, CY, 1); cinema(false); }
      if (!fx.summoned && t > 0.8) { fx.summoned = true; summonButton(fx.x, fx.y); }
      if (t > 1.05) endFx('play');
      break;
    case 'clank': {
      if (!fx.exploded) { tscale = 0.08; if (t >= 0.55) resolveKnifeHit(); break; }
      const e = t - fx.exploded;
      tscale = e < 0.07 ? 1 : e < 0.55 ? 0.15 : clamp(0.15 + (e - 0.55) * 2.2, 0.15, 1);
      if (e > 0.6) { camFocus(CX, CY, 1); cinema(false); }
      if (fx.k.done && !fx.summoned && e > 0.5) { fx.summoned = true; summonButton(CX, CY + R); }
      if (fx.k.done && e > 0.8) endFx(fx.lethal ? 'clearing' : 'play');
      break;
    }
    case 'shadow': updateShadowFx(t); break;
    case 'cook': updateCookFx(t); break;
    case 'carve': updateCarveFx(t); break;
    case 'tankintro': updateTankIntro(t); break;
    case 'tankdeath': updateTankDeath(t); break;
    case 'tankphase': updateTankPhase(t); break;
    case 'gearintro': updateGearIntro(t); break;
    case 'geardeath': updateGearDeath(t); break;
    case 'gearsnap': updateGearSnap(t); break;
    case 'gearphase': updateGearPhase(t); break;
    case 'tireintro': updateTireIntro(t); break;
    case 'tiredeath': updateTireDeath(t); break;
    case 'tiredeflate': updateTireDeflate(t); break;
    case 'wireintro': updateWireIntro(t); break;
    case 'wiredeath': updateWireDeath(t); break;
    case 'wireblow': updateWireBlow(t); break;
    case 'nestintro': updateNestIntro(t); break;
    case 'queenrise': updateQueenRise(t); break;
    case 'nestdeath': updateNestDeath(t); break;
    case 'catch': updateCatchFx(t); break;
    case 'slice':
      fxFilter = TWO_TONE;
      if (t < 0.75) tscale = 0.05;
      else { if (!fx.cut) doSlice(); tscale = t < 1.1 ? 0.45 : 1; }
      if (t >= 1.15) { camFocus(CX, CY, 1); cinema(false); }
      if (t >= 1.2 && !fx.rippled) { fx.rippled = true; ripple = { t: 0, x: CX, y: CY }; sfx.ripple(); }
      if (ripple) fxFilter = CANVAS_FILTER ? null : `grayscale(${(1 - ripple.t / 0.4).toFixed(3)})`;
      if (fx.rippled && !ripple) fxFilter = null;
      if (t >= 1.35 && !fx.summoned) { fx.summoned = true; summonButton(CX, CY); }
      if (t >= 1.7) endFx('clearing');
      break;
  }
  return false;
}

// ---- drawing: knife aura, contrail, wind ----
function drawKnifeAura(y, power, id = 'strong') {
  const AC = AURA[id] || AURA.strong;
  const q = Math.floor(time * 14);
  for (let i = 0; i < 46; i++) {
    const along = hash(i, q, 1) * (KL + 20) - 10, side = (hash(i, q, 2) < 0.5 ? -1 : 1) * (8 + hash(i, q, 3) * 16);
    const sz = (2 + Math.floor(hash(i, q, 4) * 3)) * 1.5;
    ctx.fillStyle = hash(i, q, 5) < 0.5 ? AC[0] : AC[1];
    ctx.globalAlpha = 0.5 + 0.5 * hash(i, q, 6);
    ctx.fillRect(Math.round((CX + side) / 1.5) * 1.5, Math.round((y + along) / 1.5) * 1.5, sz, sz);
  }
  for (let i = 0; i < 22; i++) {
    const a = time * 3.2 + i / 22 * TAU, x = CX + Math.cos(a) * 28, yy = y + KL / 2 + Math.sin(a) * 72;
    ctx.fillStyle = i % 2 ? AC[0] : AC[1]; ctx.globalAlpha = 0.85 * power;
    ctx.fillRect(Math.round(x / 3) * 3, Math.round(yy / 3) * 3, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function drawAbilityKnife(k) {
  if (!k.slicing && fx && (fx.type === 'flight' || fx.type === 'clank')) {
    // contrail behind the pommel
    const top = k.y + KL - 6, len = Math.min(260, KNIFE_Y + KL - top + 120);
    const g = ctx.createLinearGradient(0, top, 0, top + len);
    g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(CX - 9, top); ctx.lineTo(CX + 9, top); ctx.lineTo(CX + 1.5, top + len); ctx.lineTo(CX - 1.5, top + len); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(CX - 1, top, 2, len * 0.7);
    // wind pushing against the tip: bow-wave arcs and streaks
    ctx.lineCap = 'round';
    for (let j = 0; j < 4; j++) {
      const o = (time * 3.5 + j / 4) % 1;
      ctx.strokeStyle = `rgba(255,255,255,${0.85 * (1 - o)})`; ctx.lineWidth = 2.2 * (1 - o) + 0.6;
      for (const sd of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(CX + sd * 2, k.y - 10 - (1 - o) * 4);
        ctx.quadraticCurveTo(CX + sd * (12 + o * 26), k.y + 6, CX + sd * (16 + o * 40), k.y + 40 + o * 70); ctx.stroke();
      }
    }
    for (let i = 0; i < 10; i++) {
      const sx = CX + (i % 2 ? 1 : -1) * (18 + hash(i, 0, 7) * 34), sy = k.y - 30 + ((time * 700 + hash(i, 0, 8) * 260) % 260);
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + 26); ctx.stroke();
    }
  }
  drawAbilityWake(k);
  drawKnifeAura(k.y, 1, abId(k));
  ctx.save(); ctx.translate(CX, k.y); drawKnifeGlow((AURA[abId(k)] || AURA.strong)[0]); ctx.restore();
  if (abId(k) === 'chain') for (let i = 0; i < 2; i++) zapBolt(CX + (i ? 6 : -6), k.y + 4, CX + (i ? 8 : -8), k.y + KL * 0.7, 40 + i, { amp: 7, w: 0.6, forks: 0, pulse: false });
}

// ---- the button: emblem from the reference sketch ----
function drawLogo(fg, bg) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = fg; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(-13, -21); ctx.quadraticCurveTo(0, -18, 13, -23); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-12, -16); ctx.quadraticCurveTo(1, -13, 15, -17); ctx.stroke();
  const poly = pts => { ctx.beginPath(); pts.forEach((p, i) => ctx[i ? 'lineTo' : 'moveTo'](...p)); ctx.closePath(); };
  ctx.fillStyle = fg;
  poly([[-11, -6], [-22, 7], [-17, 9], [-13, 0]]); ctx.fill();                    // sleeves
  poly([[11, -6], [22, 5], [19, 9], [13, 0]]); ctx.fill();
  poly([[-7, 5], [-15, 19], [-8, 18], [-6, 9]]); ctx.fill();                      // lower flares
  poly([[6, 6], [15, 20], [9, 21], [6, 10]]); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-10, -9); ctx.quadraticCurveTo(0, -12, 10, -9);     // cloak with jagged hem
  ctx.lineTo(12, -2); ctx.lineTo(14, 10); ctx.lineTo(8, 2); ctx.lineTo(6, 9); ctx.lineTo(3, 1); ctx.lineTo(0, 6);
  ctx.lineTo(-3, 1); ctx.lineTo(-6, 9); ctx.lineTo(-8, 2); ctx.lineTo(-14, 10); ctx.lineTo(-12, -2); ctx.closePath(); ctx.fill();
  // dagger, blade up
  poly([[0, -14], [2.8, -7], [2.5, 14], [-2.5, 14], [-2.8, -7]]);
  ctx.fillStyle = fg; ctx.fill(); ctx.strokeStyle = bg; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(0, 12); ctx.strokeStyle = bg; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.fillStyle = fg; ctx.strokeStyle = bg; ctx.lineWidth = 1.2;
  rr(-6, 14, 12, 3, 1); ctx.fill(); ctx.stroke();
  rr(-2.4, 17, 4.8, 8, 2); ctx.fill(); ctx.stroke();
}

function drawButtonBody(grey, sc, rot) {
  ctx.save(); ctx.translate(BTN[0], BTN[1]); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.fillStyle = grey ? '#26262b' : '#000';
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.fill();
  ctx.strokeStyle = grey ? '#55555c' : '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.stroke();
  ctx.strokeStyle = grey ? '#3a3a40' : '#fff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.stroke();
  ctx.translate(0, 1); ABILITY.logo(grey ? '#6c6c74' : '#fff', grey ? '#26262b' : '#000');
  ctx.restore();
}

function drawPixelAura(x, y, rad, density) {
  const q = Math.floor(time * 12);
  for (let i = 0; i < 64; i++) {
    if (hash(i, q, 2) > density) continue;
    const a = i / 64 * TAU + time * 0.7, r = rad + hash(i, q, 1) * 14 + Math.sin(time * 6 + i) * 2;
    const sz = hash(i, q, 3) < 0.3 ? 6 : 3;
    ctx.fillStyle = hash(i, q, 4) < 0.5 ? '#fff' : '#000';
    ctx.fillRect(Math.round((x + Math.cos(a) * r) / 3) * 3, Math.round((y + Math.sin(a) * r) / 3) * 3, sz, sz);
  }
  for (let i = 0; i < 10; i++) {                 // pixels drifting off
    const ph = (time * 0.8 + hash(i, 0, 9)) % 1, a = hash(i, 0, 10) * TAU;
    ctx.globalAlpha = 1 - ph; ctx.fillStyle = i % 2 ? '#fff' : '#000';
    ctx.fillRect(Math.round((x + Math.cos(a) * (rad + 6 + ph * 26)) / 3) * 3, Math.round((y + Math.sin(a) * (rad + 6 + ph * 26)) / 3) * 3, 3, 3);
  }
  ctx.globalAlpha = 1;
}

function drawAbilityButton() {
  const st = abil.state, sw = abil.swirl;
  // empty socket
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.setLineDash([4, 5]); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(BTN[0], BTN[1], 31, 0, TAU); ctx.stroke(); ctx.restore();
  if (abil.pauseT > 0 && (st === 'ready' || st === 'cooldown')) {
    drawButtonBody(true, 1, 0);
    for (let i = 0; i < 7; i++) { const a = time * 4 + i; drawBee(BTN[0] + Math.cos(a) * 22, BTN[1] + Math.sin(a * 1.4) * 22, time + i); }
    text(String(Math.ceil(abil.pauseT)), BTN[0], BTN[1] + 46, 12, '#ffd23f', 'center', 700);
    return;
  }
  if (st === 'ready') {
    drawPixelAura(BTN[0], BTN[1], 34, 0.8);
    drawButtonBody(false, 1 + 0.04 * Math.sin(time * 5), 0);
    if (ABILITY.id === 'cook') text('BIRDS ' + (abil.birds || 0), BTN[0], BTN[1] + 44, 9, abil.birds ? '#ffa04a' : '#5c5c66', 'center', 700);
    if (abil.flash > 0) { ctx.strokeStyle = `rgba(255,255,255,${abil.flash})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(BTN[0], BTN[1], 32 + (1 - abil.flash) * 40, 0, TAU); ctx.stroke(); }
  } else if (st === 'arming' && sw) {
    const u = clamp(sw.t / (sw.dur * 0.7), 0, 1);
    if (u < 1) { drawPixelAura(BTN[0], BTN[1], 34 * (1 - u), 0.8 * (1 - u)); drawButtonBody(false, 1 - u, u * TAU * 1.5); }
  } else if (st === 'summoning' && sw) {
    const u = clamp((sw.t - sw.dur * 0.55) / (sw.dur * 0.45), 0, 1);
    if (u > 0) drawButtonBody(true, easeOutBack(u), (1 - u) * -TAU);
  } else if (st === 'cooldown') {
    drawButtonBody(true, 1, 0);
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(BTN[0], BTN[1], 35, -HALF, -HALF + TAU * abil.charge / abil.need); ctx.stroke();
    for (let i = 0; i < abil.need; i++) {
      const a = -HALF + (i + 0.5) / abil.need * TAU;
      ctx.fillStyle = i < abil.charge ? '#fff' : 'rgba(255,255,255,.25)';
      ctx.fillRect(BTN[0] + Math.cos(a) * 42 - 2, BTN[1] + Math.sin(a) * 42 - 2, 4, 4);
    }
  }
}

function drawSwirl() {
  const sw = abil.swirl; if (!sw) return;
  for (const p of sw.parts) {
    const u = clamp((sw.t - p.off) / (sw.dur - 0.2), 0, 1); if (u <= 0 || u >= 1) continue;
    const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const cx = sw.from[0] + (sw.to[0] - sw.from[0]) * e, cy = sw.from[1] + (sw.to[1] - sw.from[1]) * e;
    const r = p.r0 * Math.sin(Math.PI * Math.max(e, 0.08)) + 2, a = p.a0 + e * TAU * 2.4 * p.spin;
    const sz = p.s * (1 - 0.4 * e);
    ctx.fillStyle = p.c; ctx.fillRect(Math.round((cx + Math.cos(a) * r) / 3) * 3, Math.round((cy + Math.sin(a) * r) / 3) * 3, sz, sz);
  }
}

// ---------- log types ----------
const LOG_TYPES = ['branches', 'holes', 'bushes', 'moss', 'bark', 'treehole', 'saw', 'blackout', 'tnt', 'ice', 'lodestone', 'bramble', 'fungal', 'runestone', 'spiralwood', 'resinwood', 'petrified', 'embercore', 'ringwood'];
const TYPE_NAME = { plain: 'PLAIN LOG', branches: 'BRANCHED LOG', holes: 'WEAK-SPOT LOG', bushes: 'OVERGROWN LOG', moss: 'MOSSY LOG', bark: 'ARMOURED LOG', treehole: 'HUNGRY HOLLOW', saw: 'SAWMILL', blackout: 'BLACKOUT', tnt: 'POWDER KEG', ice: 'FROSTBITE', lodestone: 'LODESTONE', bramble: 'BRAMBLE', fungal: 'FUNGAL LOG', runestone: 'RUNESTONE', spiralwood: 'SPIRALWOOD', resinwood: 'RESINWOOD', petrified: 'PETRIFIED LOG', embercore: 'EMBERCORE', ringwood: 'RINGWOOD' };
const BRANCH_SUBS = ['plain', 'swirl', 'fire', 'hive', 'wire', 'linked', 'bird'];
const BIRD_COLS = [['#2ad8ff', '#1f5fd1'], ['#ff2e45', '#a3122a'], ['#ffd23f', '#ff7a1a'], ['#9466ff', '#5c5c66']];
let forceType = null, fxp = [], zapT = 0, stunMax = 2, typeHint = 0;
const normA = a => ((a % TAU) + TAU) % TAU;
const inArc = (a, c, w) => angDiff(a, c) < w;

function decorate(t, type) {
  t.type = type;
  const F = t.f = { branches: [], links: [], holes: [], bushes: [], moss: [], plates: [], treehole: null, saws: [], arcs: [], kegs: [], ice: [], dark: null, mag: null, vines: [], shrooms: [], runes: null, spiral: null, resin: [], stone: [], seams: [], ember: null, rings: null };

    case 'bushes': F.bushes.forEach(b => { if (b.alive && b.apple) breakBush(t, b, true); }); say('GARNISHED', '#7fbf3a'); break;

    case 'bark': score += 2; say('SEARED ON IRON  +2', '#ffa04a'); break;
    case 'treehole': shut(10); say('FED: SHUT 10S', '#ffa04a'); break;
    case 'saw': jam(4); score++; say('SLICED THIN  +1', '#ffa04a'); break;

function interKeys(t) {
  const ks = [], F = t.f || {};
  if (t.tank) ks.push('boss:tank'); else if (t.gear) ks.push('boss:gear'); else if (t.tire) ks.push('boss:tire'); else if (t.wire) ks.push('boss:wire');
  else if (t.nest) { ks.push('boss:nest'); if (t.nest.queen) ks.push('boss:queen'); }
  else if (t.boss) ks.push('boss:classic');
  else if (t.type) ks.push('type:' + t.type);

  updateAbility(dt);
  lightIn = Math.max(0, lightIn - dt);                    // real time: boss intros freeze game time
  if (updateFx(dt)) return;                               // ability hit-stop freeze
  dt *= tscale * ixSlow();
  if (state === 'impact') {
    impactT = Math.max(0, impactT - dt);
    const el = IMPACT_TOTAL - impactT;
    if (el < hitstopLen()) return;                         // frozen impact frame
    if (finale) {
      if (!exploded) {
        exploded = true; shake = 30;

}

function shatterScreen() {
  const snap = thresholdSnapshot();

  const k = dpr * scale, icx = dpr * (ox + CX * scale), icy = dpr * (oy + impactY * scale);
  pieces = cutPieces(snap, 0, 0, gridFrac, icx, icy, k, 2.5 * dpr);

}

let rewindFrom = null;
function startRewind(from = null) {

  startGame();
  state = 'rewind'; rewindT = 0; needRewindSnap = true; rewFlashed = false; rewSwitched = false; popCanvas = null;
  banner.t = 0; tgt.pop = 1; readyT = 0; pieces = [];
  sfx.rewind();
}

function buildRewindPieces() {
  const snap = thresholdSnapshot();
  if (!snap) { pieces = []; return; }
  const k = dpr * scale, gcx = dpr * (ox + CX * scale), gcy = dpr * (oy + CY * scale);
  pieces = cutPieces(snap, 0, 0, makeGridFracture(), gcx, gcy, k, 2.5 * dpr);
  const far = Math.max(cv.width, cv.height);
  for (const p of pieces) {
    let dx = p.hx - gcx, dy = p.hy - gcy; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    const dist = far * rand(0.7, 1.2);
    p.home = true; p.sx = p.hx + dx * dist + rand(-0.15, 0.15) * far; p.sy = p.hy + dy * dist + rand(0, 0.3) * far;
    p.rot0 = rand(-6, 6); p.dur = 0.42; p.delay = (8 - p.j) * 0.045 + rand(0, 0.05);
  }
  if (rewindFrom) {
    const fr = rewindFrom.frags;
    pieces.forEach((p, i) => {
      const f = fr[i % fr.length], [vx, vy, r] = fragPose(f, 1);
      p.sx = dpr * (ox + vx * scale); p.sy = dpr * (oy + vy * scale); p.rot0 = r + rand(-1.2, 1.2);
      p.s0 = Math.min(1, (f.w * dpr * scale) / Math.max(8, p.c.width)) * 0.9;
      p.ease = 'inout'; p.dur = 0.72; p.delay = rand(0, 0.14); p.frag = f;
    });
    rewindFrom = null;
  }
}

const POP_W = 260, POP_H = 104;

  g.fillStyle = '#ffc61a'; g.fillRect(0, 0, POP_W, POP_H);
  g.fillStyle = '#111'; for (let x = -POP_H; x < POP_W + POP_H; x += 26) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 13, 0); g.lineTo(x + 13 - POP_H, POP_H); g.lineTo(x - POP_H, POP_H); g.closePath(); g.fill(); }
  g.restore();

  g.fillStyle = pg; g.fillRect(12, 12, POP_W - 24, POP_H - 24);

  g.font = `700 54px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = 'rgba(255,214,90,.8)'; g.shadowBlur = 18; g.fillStyle = '#fff';

}

function shatterPopup() {
  if (!popCanvas) return;
  const k = dpr * scale, [px, py] = popPos;
  const shards = cutPieces(popCanvas, Math.round(px - popCanvas.width / 2), Math.round(py - popCanvas.height / 2), makeGrid(9, [0, 22, 55, 100, 160, 240]), px, py, k, 1.2 * dpr);
  launch(shards, px, py, k, 250, 700, 0.012);
  pieces = shards; popCanvas = null;
  for (let i = 0; i < 14; i++) {
    const a = rand(TAU), sp = rand(200, 600), pts = [];
    for (let j = 0; j < 3; j++) { const r = rand(3, 10), ang = j / 3 * TAU + rand(-0.5, 0.5); pts.push([Math.cos(ang) * r, Math.sin(ang) * r]); }
    debris.push({ kind: 'glass', x: CX + rand(-60, 60), y: 455 + rand(-20, 20), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200, rot: rand(TAU), vr: rand(-14, 14), pts });

}

function drawRewind() {
  const t = rewindT;
  if (needRewindSnap) { drawScene(); buildRewindPieces(); needRewindSnap = false; }
  let f;
  if (t < REW_FLASH) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
    for (const p of pieces) {
      const u = clamp((t - p.delay) / p.dur, 0, 1);
      const e = p.ease === 'inout' ? (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2) : 1 - Math.pow(1 - u, 3);
      ctx.save(); ctx.translate(p.sx + (p.hx - p.sx) * e, p.sy + (p.hy - p.sy) * e); ctx.rotate(p.rot0 * (1 - e));
      if (p.ease === 'inout') {
        const sc = p.s0 + (1 - p.s0) * e, mix = clamp(u * 2.2, 0, 1); ctx.scale(sc, sc);
        ctx.globalAlpha = mix; ctx.drawImage(p.c, p.ox, p.oy);
        if (mix < 1) { const f = p.frag, k = dpr * scale / sc; ctx.globalAlpha = 1 - mix; ctx.drawImage(f.c, -f.w * k / 2, -f.h * k / 2, f.w * k, f.h * k); }
      } else ctx.drawImage(p.c, p.ox, p.oy);
      ctx.restore();
    }
    f = 'grayscale(1)';
  } else {
    drawScene();
    const s = t - REW_SWITCH;
    const lit = s >= 0 && !(s >= 0.05 && s < 0.11) && !(s >= 0.15 && s < 0.19);   // fluorescent flicker on
    f = lit ? 'none' : 'grayscale(1) contrast(40)';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const fa = clamp(1 - (t - REW_FLASH) / 0.3, 0, 1);
    if (fa > 0) { ctx.fillStyle = `rgba(255,46,69,${fa * 0.5})`; ctx.fillRect(0, 0, cv.width, cv.height); }
    if (s >= 0 && popCanvas) {
      const u = clamp(s / 0.2, 0, 1), sc = 0.4 + 0.6 * easeOutBack(u), jit = s < 0.3 ? (0.3 - s) * 20 * dpr : 0;
      ctx.save(); ctx.translate(popPos[0] + rand(-jit, jit), popPos[1] + rand(-jit, jit)); ctx.scale(sc, sc);
      ctx.drawImage(popCanvas, -popCanvas.width / 2, -popCanvas.height / 2); ctx.restore();
    }
  }
  outFilter(f);
}

function drawPieces() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const p of pieces) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.drawImage(p.c, p.ox, p.oy); ctx.restore();
  }
}


// losing screen: pure black & white, elements slam in fast
function drawOverScreen() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  const t = overAge;

  ctx.save(); ctx.translate(CX, 300); ctx.rotate(t * 0.15); ctx.fillStyle = 'rgba(255,255,255,.07)';
  for (let i = 0; i < 18; i++) { ctx.rotate(TAU / 18); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(900, -50); ctx.lineTo(900, 50); ctx.closePath(); ctx.fill(); }
  ctx.restore();

  const slam = (delay, y, fn) => {
    const u = clamp((t - delay) / 0.16, 0, 1); if (u <= 0) return;
    const sc = 1 + 1.4 * Math.pow(1 - u, 3);
    ctx.save(); ctx.globalAlpha = u; ctx.translate(CX, y); ctx.scale(sc, sc); ctx.translate(-CX, -y); fn(); ctx.restore();
  };

    ctx.fillStyle = '#fff'; ctx.save(); ctx.translate(CX, 212); ctx.rotate(-0.06); ctx.fillRect(-W, -34, W * 2, 68); ctx.restore();
    ctx.save(); ctx.translate(CX, 212); ctx.rotate(-0.06); text('OUT OF LIVES', 0, 2, 44, '#000', 'center', 900); ctx.restore();
  });
  slam(0.18, 278, () => {

  });

    text(String(shown), CX, 352, 96, '#fff', 'center', 900);
  });
  slam(0.36, 414, () => text(`STAGE ${stage}  /  ${apples} APPLE${apples === 1 ? '' : 'S'}`, CX, 414, 16, '#fff', 'center', 700));
  slam(0.44, 457, () => {

    else text('BEST  ' + best, CX, 457, 20, '#fff', 'center', 800);

    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(CX - 80, 606, 160, 36); text('MAIN MENU', CX, 625, 14, '#fff', 'center', 700);
  }
}

function drawImpact() {

      ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(CX - 1, k.y + KL, 2, 110); ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(CX - 7, k.y + KL * 0.6, 1.5, 80); ctx.fillRect(CX + 5.5, k.y + KL * 0.6, 1.5, 80);

  else if (!(fx && ((fx.type === 'tankintro' && fx.t < SHOT.reveal) || (fx.type === 'gearintro' && fx.t < GSHOT.reveal) || (fx.type === 'tireintro' && fx.t < TSHOT.reveal) || (fx.type === 'nestintro' && fx.t < NSHOT.reveal) || (fx.type === 'wireintro' && fx.t < WSHOT.reveal)))) { drawHUD(); drawBanner(); drawAbilityButton(); drawTray(); drawFlights(); }
  drawSwirl();
  drawFloaters();

  if (fx && fx.t < fx.freeze) { ctx.save(); applyCam(); drawFxImpactFrame(); ctx.restore(); }
  drawScreenHits();
  drawScreenDrops(); drawPaints();
  drawMute();
}

function draw() {
  if (state === 'tomenu') { drawToMenu(); pixelate(); return; }
  if (state === 'menu') {
    drawMenuScreen(); outFilter('none'); pixelate();
    if (ui.trans && ui.trans.wantFrags) captureSlabFrags();
    return;
  }
  if (state === 'over') {
    drawOverScreen(); drawPieces();
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy); drawMute();
    outFilter('grayscale(1)');
    pixelate();
    return;
  }
  if (state === 'rewind') { drawRewind(); pixelate(); return; }
  drawScene();
  const el = IMPACT_TOTAL - impactT;
  // pure two-tone black & white (inverted on the impact frame), easing back to colour
  if (snapReq && state === 'impact') {
    shatterScreen(); snapReq = false;
    state = 'over'; overAge = 0; overT = 0.9; gray = 0; frac = null;
    ui.bank += apples; save('knaife.bank', ui.bank);
    sfx.screenBreak(); buzz([60, 30, 60]);
    return;   // the next frame draws the losing screen under the falling pieces
  }
  drawRipple();
  postFX();
  const f = fxFilter ? fxFilter : zapT > 0.85 ? (Math.floor(time * 30) % 2 ? INVERT : TWO_TONE) : state === 'impact' && el < hitstopLen() ? 'grayscale(1) contrast(40) invert(1)'
    : gray > 0 ? `grayscale(${gray.toFixed(3)}) contrast(${(1 + 39 * Math.pow(gray, 3)).toFixed(3)})` : 'none';
  outFilter(f);
  if (pieces.length) drawPieces();
  pixelate();
}

  <h2>ADMIN <small>GAME PAUSED</small></h2>
  <label>Next log type<select id="admType"><option value="">Random</option>${types}</select></label>
  <label>Next boss (stage 5, 30, 55...)<select id="admBoss"><option value="">Random</option>${bosses}</select></label>
  <div class="row"><button class="a" data-a="stage">Next stage now</button><button class="a go" data-a="boss">Fight boss now</button></div>
  <div class="row"><button class="a" data-a="hearts">Refill hearts</button><button class="a" data-a="charge">Charge ability</button></div>
  <label class="chk"><input type="checkbox" id="admGod"> God mode: missed throws never cost a heart</label>
  <p id="admNote"></p>
  <button class="a" data-a="close">Resume</button>
</div>`;
  document.body.appendChild(pn); document.body.appendChild(btn);
  const stop = e => e.stopPropagation();
  for (const ev of ['pointerdown', 'pointerup', 'keydown']) { pn.addEventListener(ev, stop); btn.addEventListener(ev, stop); }
  btn.addEventListener('click', () => setAdmin(!adminOpen));
  pn.addEventListener('click', e => { if (e.target === pn) setAdmin(false); });
  pn.querySelector('#admType').addEventListener('change', e => { adminNextType = e.target.value || null; syncAdmin(); });
  pn.querySelector('#admBoss').addEventListener('change', e => { adminNextBoss = e.target.value || null; syncAdmin(); });
  pn.querySelector('#admGod').addEventListener('change', e => { adminGod = e.target.checked; });
  pn.addEventListener('keydown', e => { if (e.key === 'Escape') setAdmin(false); });
  pn.querySelectorAll('button[data-a]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.a; ac();
    if (a === 'close') { setAdmin(false); return; }
    if (a === 'stage') { const n = state === 'menu' ? 1 : stage + 1; adminJump(n); setAdmin(false); return; }
    if (a === 'boss') { let n = state === 'menu' ? 1 : stage + 1; while (!isFirstBossSlot(n)) n++; adminJump(n); setAdmin(false); return; }
    if (a === 'hearts') { if (state !== 'menu') { lives = MAX_LIVES; sfx.heal(); } syncAdmin(); return; }
    if (a === 'charge') { if (state !== 'menu' && abil.state !== 'armed' && abil.state !== 'used') { abil.state = 'ready'; abil.charge = abil.need; abil.flash = 1; sfx.ready(); } return; }
  }));
})();

initGL(); resize();
enterMenu(true);
requestAnimationFrame(frame);
// test hook
window.__knaife = { get lives() { return lives; }, get state() { return state; }, get score() { return score; }, get stage() { return stage; }, get knivesLeft() { return knivesLeft; } };
</script>
</body>
</html>

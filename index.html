<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1233">
<title>Knaife</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔪</text></svg>">
<style>
  html { box-sizing: border-box; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0e0a1c; overflow: hidden; }
  body { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" aria-label="Knaife game. Tap, click or press Space to throw a knife."></canvas>
<script>
'use strict';
// ---------- setup ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2, HALF = Math.PI / 2;
const W = 420, H = 760;                 // virtual playfield
const CX = W / 2, CY = 255, R = 92;     // target
const KL = 118, EMBED = 20;             // knife length, how deep it sinks in
const KNIFE_Y = H - 150;                // tip y of the ready knife
const SPEED = 2600;                     // knife speed px/s
let dpr = 1, scale = 1, ox = 0, oy = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = cv.clientWidth || window.innerWidth, ch = cv.clientHeight || window.innerHeight;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  scale = Math.min(cw / W, ch / H);
  ox = (cw - W * scale) / 2; oy = (ch - H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => Math.abs((((a - b + Math.PI) % TAU) + TAU) % TAU - Math.PI);
const easeOutBack = t => { const c = 1.70158; t -= 1; return 1 + (c + 1) * t * t * t + c * t * t; };

function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// ---------- audio ----------
let actx = null, master = null, verb = null, muted = load('knaife.muted', false);
function makeIR(a, secs) {
  const len = Math.floor(a.sampleRate * secs), b = a.createBuffer(2, len, a.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  return b;
}
function ac() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    master = actx.createDynamicsCompressor(); master.threshold.value = -14; master.ratio.value = 6;
    const mg = actx.createGain(); mg.gain.value = 0.9; master.connect(mg).connect(actx.destination);
    verb = actx.createConvolver(); verb.buffer = makeIR(actx, 2.6); verb.connect(master);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
let driveCurve = null;
function route(a, node, o) {
  let n = node;
  if (o.drive) {
    if (!driveCurve) { driveCurve = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; driveCurve[i] = Math.tanh(x * 4); } }
    const ws = a.createWaveShaper(); ws.curve = driveCurve; n.connect(ws); n = ws;
  }
  n.connect(master);
  if (o.wet) { const g = a.createGain(); g.gain.value = o.wet; n.connect(g).connect(verb); }
}
function tone(type, f0, f1, dur, vol, o = {}) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + (o.delay || 0), osc = a.createOscillator(), g = a.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f0, t); osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (o.attack || 0.003)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); route(a, g, o); osc.start(t); osc.stop(t + dur + 0.05);
}
function noise(dur, freq, q, vol, type = 'bandpass', o = {}) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + (o.delay || 0), len = Math.max(1, Math.floor(a.sampleRate * dur));
  const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  const shape = o.rise ? (i => i / len) : (i => Math.pow(1 - i / len, o.curve || 1));
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * shape(i);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q; g.gain.value = vol;
  if (o.sweepTo) f.frequency.exponentialRampToValueAtTime(o.sweepTo, t + dur);
  src.connect(f).connect(g); route(a, g, o); src.start(t);
}
const sfx = {
  whoosh() { noise(0.07, 3200, 0.8, 0.12); },
  thunk() { noise(0.09, 900, 1.2, 0.55); tone('sine', 190, 55, 0.13, 0.5); },
  clang() { tone('square', 1500, 950, 0.28, 0.08); tone('triangle', 2400, 1900, 0.4, 0.12); noise(0.12, 4500, 2, 0.35); },
  apple() { tone('sine', 620, 1250, 0.13, 0.22); noise(0.06, 2600, 1, 0.25); },
  smash() { noise(0.45, 650, 0.6, 0.7); tone('sine', 130, 40, 0.35, 0.5); },
  over() {
    tone('sawtooth', 110, 36, 2.2, 0.14, { wet: 0.8, attack: 0.05 });
    tone('sine', 55, 30, 2.4, 0.5, { wet: 0.4 });
    for (const [f, d] of [[392, 0], [311, 0.35], [233, 0.7]]) tone('triangle', f, f * 0.97, 1.4, 0.12, { delay: d, wet: 0.9 });
  },
  impact() {
    // the hit: distorted sub boom + crunch
    tone('sine', 120, 26, 1.4, 1, { drive: true, wet: 0.35 });
    tone('square', 70, 30, 0.35, 0.25, { drive: true });
    noise(0.6, 260, 0.7, 1, 'lowpass', { drive: true, wet: 0.5, curve: 2 });
    // ringing steel: inharmonic partials into a long tail
    for (const f of [1180, 1733, 2489, 3317, 4410]) tone('sine', f, f * 0.985, 1.8, 0.07, { wet: 0.9 });
    // glass: a bright crash then a rain of tinkling shards
    noise(0.9, 4200, 0.5, 0.7, 'highpass', { wet: 0.6, curve: 2.5 });
    noise(0.35, 2500, 3, 0.35, 'bandpass', { wet: 0.4 });
    for (let i = 0; i < 34; i++) {
      const d = 0.02 + Math.pow(Math.random(), 1.8) * 0.9, f = rand(2600, 9000);
      tone(Math.random() < 0.5 ? 'sine' : 'triangle', f, f * rand(0.97, 1.02), rand(0.04, 0.22), rand(0.03, 0.1), { delay: d, wet: 0.7 });
    }
    // time-freeze: pitch dropping out from under you
    tone('sawtooth', 600, 45, 0.5, 0.08, { wet: 0.6 });
  },
  finale() {
    // second, bigger hit when everything explodes
    tone('sine', 70, 20, 2.2, 1, { delay: 0.24, drive: true, wet: 0.6 });
    noise(1.2, 400, 0.6, 1, 'lowpass', { delay: 0.24, drive: true, wet: 0.7, curve: 1.5 });
    noise(0.8, 1800, 0.8, 0.5, 'bandpass', { delay: 0.24, wet: 0.6, curve: 2 });
    // rising tension into the screen break
    noise(0.4, 300, 2, 0.3, 'bandpass', { delay: 0.3, sweepTo: 6000, rise: true, wet: 0.4 });
  },
  screenBreak() {
    noise(1.4, 3000, 0.4, 0.9, 'highpass', { wet: 0.7, curve: 2 });
    noise(0.5, 900, 0.8, 0.6, 'bandpass', { drive: true, wet: 0.4, curve: 2 });
    tone('sine', 140, 30, 0.8, 0.9, { drive: true, wet: 0.4 });
    for (let i = 0; i < 60; i++) {
      const d = Math.pow(Math.random(), 1.6) * 1.3, f = rand(2200, 9500);
      tone(Math.random() < 0.5 ? 'sine' : 'triangle', f, f * rand(0.96, 1.02), rand(0.04, 0.25), rand(0.03, 0.09), { delay: d, wet: 0.7 });
    }
    // slam of the losing screen
    tone('square', 98, 49, 0.5, 0.25, { delay: 0.05, drive: true, wet: 0.5 });
    tone('sawtooth', 55, 27, 2.5, 0.18, { delay: 0.25, wet: 0.9, attack: 0.08 });
    for (const [f, d] of [[392, 0.3], [311, 0.5], [233, 0.7]]) tone('triangle', f, f * 0.97, 1.4, 0.1, { delay: d, wet: 0.9 });
  },
  rewind() {
    // reversed glass: swelling hiss and tinkles that bunch up as the rings land
    noise(0.9, 900, 0.7, 0.5, 'highpass', { rise: true, sweepTo: 9000, wet: 0.6 });
    tone('sine', 40, 140, 0.9, 0.35, { attack: 0.8 });
    for (let j = 8; j >= 0; j--) {
      const land = (8 - j) * 0.045 + 0.44;
      tone('triangle', 2400 + j * 500, 2600 + j * 500, 0.08, 0.06, { delay: land, wet: 0.5 });
      noise(0.03, 5000, 2, 0.12, 'bandpass', { delay: land });
    }
    tone('sine', 60, 40, 0.25, 0.6, { delay: 0.86, drive: true });
  },
  flash() {
    for (const f of [1800, 2700, 4050, 6075]) tone('sine', f, f, 1.2, 0.07, { wet: 1 });
    noise(0.25, 7000, 0.5, 0.4, 'highpass', { wet: 0.8 });
  },
  lightSwitch() {
    // heavy breaker lever slamming into place, echoing through a warehouse
    noise(0.04, 1600, 4, 1, 'bandpass', { drive: true, wet: 1.2 });
    tone('square', 90, 40, 0.09, 0.45, { drive: true, wet: 1 });
    noise(0.25, 180, 0.8, 0.9, 'lowpass', { drive: true, wet: 1, curve: 3 });
    noise(0.03, 2600, 5, 0.6, 'bandpass', { delay: 0.07, wet: 1 });
    // flicker ticks and the mains hum coming up
    for (const d of [0.05, 0.11, 0.15, 0.19]) noise(0.015, 4000, 2, 0.35, 'bandpass', { delay: d, wet: 0.6 });
    tone('sawtooth', 50, 50, 1.6, 0.06, { delay: 0.19, attack: 0.05, wet: 0.5 });
    tone('square', 100, 100, 1.3, 0.025, { delay: 0.19, attack: 0.05, wet: 0.5 });
  },
  popBreak() {
    noise(0.7, 3500, 0.5, 0.7, 'highpass', { wet: 0.6, curve: 2 });
    tone('sine', 110, 40, 0.4, 0.6, { drive: true, wet: 0.3 });
    for (let i = 0; i < 28; i++) { const f = rand(2500, 9000); tone('sine', f, f, rand(0.04, 0.18), rand(0.03, 0.08), { delay: Math.pow(Math.random(), 1.7) * 0.6, wet: 0.6 }); }
  },
  heart() { tone('square', 330, 160, 0.25, 0.08, { delay: 0.15 }); tone('square', 247, 110, 0.35, 0.08, { delay: 0.3, wet: 0.5 }); },
  unfreeze() { noise(0.6, 250, 1.5, 0.35, 'bandpass', { sweepTo: 4500, rise: true, wet: 0.5 }); tone('sine', 80, 300, 0.6, 0.12, { attack: 0.4 }); },
};
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

// ---------- palettes ----------
const WOODS = [
  { bark: '#5b3418', light: '#f3c98a', dark: '#c98b4b', ring: 'rgba(120,66,26,.38)', knot: '#9a5f2c' },
  { bark: '#4a2c17', light: '#e8b27a', dark: '#b4723e', ring: 'rgba(100,50,20,.38)', knot: '#87502a' },
  { bark: '#3d2a1e', light: '#f0d3a8', dark: '#c9a06a', ring: 'rgba(110,80,40,.38)', knot: '#8e6a3e' },
  { bark: '#5a2a1c', light: '#eaa58a', dark: '#b85f45', ring: 'rgba(110,40,25,.38)', knot: '#8b3d2b' },
];
const BOSSES = [
  { name: 'Ironbark',    bark: '#23272e', light: '#b7c0ca', dark: '#5d6670', ring: 'rgba(20,25,30,.45)',  knot: '#3c434c' },
  { name: 'Frostheart',  bark: '#244f72', light: '#f0faff', dark: '#93c8ea', ring: 'rgba(40,100,150,.4)',  knot: '#6aa6cf' },
  { name: 'Ember Stump', bark: '#3a1206', light: '#ffc06a', dark: '#d9481c', ring: 'rgba(120,20,0,.45)',   knot: '#8e2a0c' },
  { name: 'Moonwood',    bark: '#241a44', light: '#e2d8ff', dark: '#8a74d6', ring: 'rgba(50,30,110,.4)',   knot: '#5b47a3' },
  { name: 'Old Gnarl',   bark: '#28331a', light: '#d6e39a', dark: '#7f9440', ring: 'rgba(40,60,10,.42)',   knot: '#56692a' },
];

// ---------- state ----------
let state = 'menu';
let stage = 1, score = 0, apples = 0, best = load('knaife.best', 0), newBest = false;
let tgt = null, flying = [], debris = [], parts = [];
let knivesLeft = 0, knivesTotal = 0, readyT = 0, shake = 0, overT = 0, clearT = 0, time = 0;
let banner = { text: '', sub: '', t: 0, color: '#fff' };
const MAX_LIVES = 3;
let lives = MAX_LIVES, heartT = 0;
// impact sequence: hit-stop freeze -> black & white slow-mo -> fade back to colour
const HITSTOP = 0.14, GRAY_HOLD = 0.6, IMPACT_TOTAL = 1.2;
let impactT = 0, impactY = 0, gray = 0, impactLines = [], frac = null, unfrozen = false;
// final heart: longer freeze, everything explodes, then the screen itself shatters into the losing screen
const FINAL_HITSTOP = 0.24, FINAL_SNAP = 0.62;
let finale = false, exploded = false, snapReq = false, pieces = [], overAge = 0, gridFrac = null;
// retry: fragments fly back, lock together, flash, lights switch on, START sign shatters
const REW_FLASH = 0.92, REW_SWITCH = 1.32, REW_BREAK = 2.1;
let rewindT = 0, needRewindSnap = false, rewFlashed = false, rewSwitched = false, popCanvas = null, popPos = [0, 0];
const hitstopLen = () => finale ? FINAL_HITSTOP : HITSTOP;

// polar grid of cracks covering the whole screen; the same vertices cut the screen into pieces
function makeGridFracture() { return makeGrid(12, [0, 34, 80, 140, 220, 330, 480, 700, 1000, 1500]); }
function makeGrid(n, radii) {
  const V = [];
  const base = rand(TAU);
  for (let i = 0; i < n; i++) {
    const a = base + i / n * TAU + rand(-0.12, 0.12), col = [];
    for (let j = 0; j < radii.length; j++) {
      const r = radii[j] * (j ? rand(0.85, 1.15) : 0), aa = a + (j ? rand(-0.09, 0.09) : 0);
      col.push([Math.cos(aa) * r, Math.sin(aa) * r]);
    }
    V.push(col);
  }
  return { n, radii, V };
}

// cracked-glass pattern radiating from the hit point
function makeFracture() {
  const rays = [], web = [], n = 13;
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + rand(-0.18, 0.18), len = rand(170, 430), pts = [[0, 0]];
    for (let r = 0; r < len;) { r += rand(16, 38); const aa = a + rand(-0.1, 0.1); pts.push([Math.cos(aa) * r, Math.sin(aa) * r]); }
    rays.push({ a, len, pts });
  }
  for (const rr of [rand(28, 40), rand(65, 90), rand(115, 150), rand(180, 230)]) {
    for (let i = 0; i < n; i++) {
      const A = rays[i], B = rays[(i + 1) % n];
      if (A.len < rr || B.len < rr || Math.random() < 0.2) continue;
      const r1 = rr * rand(0.88, 1.12), r2 = rr * rand(0.88, 1.12), mid = (A.a + B.a + (i === n - 1 ? TAU : 0)) / 2, rm = (r1 + r2) / 2 * rand(0.85, 1);
      web.push([[Math.cos(A.a) * r1, Math.sin(A.a) * r1], [Math.cos(mid) * rm, Math.sin(mid) * rm], [Math.cos(B.a) * r2, Math.sin(B.a) * r2], rr]);
    }
  }
  return { rays, web };
}

function placeAngles(n, sep, avoid) {
  const out = [];
  for (let tries = 0; out.length < n && tries < 400; tries++) {
    const a = rand(TAU);
    if (avoid.concat(out).every(b => angDiff(a, b) > sep)) out.push(a);
  }
  return out;
}

function makePattern(n, boss) {
  const dir = Math.random() < 0.5 ? -1 : 1;
  const base = Math.min(1.5 + n * 0.11, 3.4) * dir;
  const pool = boss ? ['reverse', 'chaos', 'surge']
    : n < 3 ? ['steady'] : n < 6 ? ['steady', 'wave'] : ['steady', 'wave', 'reverse', 'surge'];
  const type = pool[Math.floor(rand(pool.length))];
  switch (type) {
    case 'wave':    return t => base * (0.55 + 0.65 * Math.sin(t * 1.3));
    case 'reverse': return t => base * 1.25 * Math.tanh(2.5 * Math.sin(t * 0.85));
    case 'surge':   return t => base * (0.25 + 1.8 * Math.pow(Math.max(0, Math.sin(t * 1.6)), 2));
    case 'chaos':   return t => base * 1.15 * (Math.sin(t * 1.1) + 0.6 * Math.sin(t * 2.7 + 1));
    default:        return () => base;
  }
}

function makeTarget(pal, pat, stuckAngles, appleAngles, boss) {
  const rings = [], cracks = [], knots = [];
  const pox = rand(-8, 8), poy = rand(-8, 8);
  for (let i = 1; i <= 5; i++) rings.push({ r: (R - 14) * i / 5.6 + rand(-3, 3), x: pox * (1 - i / 6), y: poy * (1 - i / 6) });
  for (let i = 0, n = 2 + Math.floor(rand(2)); i < n; i++) {
    const a = rand(TAU), len = rand(0.3, 0.6) * R, pts = [];
    for (let j = 0; j <= 3; j++) {
      const r = R - 8 - len * j / 3, aa = a + rand(-0.08, 0.08);
      pts.push([Math.cos(aa) * r, Math.sin(aa) * r]);
    }
    cracks.push(pts);
  }
  for (let i = 0, n = 1 + Math.floor(rand(2)); i < n; i++) {
    const a = rand(TAU), r = rand(0.35, 0.7) * R;
    knots.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, rx: rand(5, 8), ry: rand(3, 5), rot: a });
  }
  return {
    rot: rand(TAU), t: 0, pop: 0, hit: 0, pat, pal, boss, rings, cracks, knots, pith: [pox, poy],
    stuck: stuckAngles.map(a => ({ a })), apples: appleAngles.map(a => ({ a, cut: false })),
  };
}

function menuTarget() {
  const stuck = placeAngles(3, 0.8, []);
  tgt = makeTarget(WOODS[0], () => 0.9, stuck, placeAngles(1, 0.6, stuck), false);
  tgt.pop = 1;
}

function newStage() {
  const boss = stage % 5 === 0;
  knivesTotal = boss ? Math.min(8 + Math.floor(stage / 5), 12) : Math.min(5 + Math.ceil(stage * 0.6), 10);
  knivesLeft = knivesTotal;
  const pre = boss ? Math.min(2 + Math.floor(stage / 10), 5) : Math.min(Math.floor((stage - 1) / 2), 4);
  const stuck = placeAngles(pre, 0.6, []);
  const nApples = Math.random() < (boss ? 0.9 : 0.55) ? (Math.random() < 0.35 ? 2 : 1) : 0;
  const appleAngles = placeAngles(nApples, 0.5, stuck);
  const pal = boss ? BOSSES[(stage / 5 - 1) % BOSSES.length] : WOODS[stage % WOODS.length];
  tgt = makeTarget(pal, makePattern(stage, boss), stuck, appleAngles, boss);
  banner = boss ? { text: 'BOSS', sub: pal.name, t: 1.6, color: '#ff5d6c' } : { text: 'STAGE ' + stage, sub: '', t: 1.0, color: '#fff' };
  readyT = 0.3;
  state = 'play';
}

function startGame() {
  stage = 1; score = 0; apples = 0; newBest = false;
  lives = MAX_LIVES; impactT = 0; gray = 0; finale = false; pieces = []; gridFrac = null; frac = null;
  flying = []; debris = []; parts = [];
  newStage();
}

// ---------- actions ----------
function throwKnife() {
  if (state !== 'play' || knivesLeft <= 0 || readyT > 0.04) return;
  knivesLeft--;
  flying.push({ y: KNIFE_Y, done: false });
  readyT = knivesLeft > 0 ? 0.12 : 0;
  sfx.whoosh();
}

function action() {
  ac();
  if (state === 'menu') { startGame(); return; }
  if (state === 'over') { if (overT <= 0) startRewind(); return; }
  throwKnife();
}

function burst(x, y, n, colors, spd, up = 0, size = 4, life = 0.6) {
  for (let i = 0; i < n; i++) {
    const a = rand(TAU), s = rand(0.3, 1) * spd;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - up, life: rand(0.6, 1) * life, max: life,
      c: colors[Math.floor(rand(colors.length))], s: rand(0.5, 1) * size, rot: rand(TAU), vr: rand(-10, 10) });
  }
}

function stepKnife(k) {
  const t = tgt;
  if (!t) { k.done = true; return; }
  const tip = k.y;
  // hit another knife?
  for (const s of t.stuck) {
    const w = t.rot + s.a;
    if (angDiff(w, HALF) > 0.5) continue;
    const c = Math.cos(w), sn = Math.sin(w);
    for (let r = R - EMBED + 8; r <= R - EMBED + KL; r += 5) {
      const px = CX + r * c, py = CY + r * sn;
      if (Math.abs(px - CX) < 10 && py >= tip && py <= tip + KL) { fail(k); return; }
    }
  }
  // slice apples
  for (const ap of t.apples) {
    if (ap.cut) continue;
    const w = t.rot + ap.a;
    if (angDiff(w, HALF) < 0.2 && tip <= CY + R + 25) sliceApple(ap, w);
  }
  // stick
  if (tip <= CY + R - EMBED) {
    k.done = true;
    t.stuck.push({ a: HALF - t.rot });
    t.hit = 1; score++;
    burst(CX, CY + R, 8, [t.pal.light, t.pal.dark, t.pal.bark], 260, 60, 5, 0.55);
    sfx.thunk(); buzz(8);
  }
}

function sliceApple(ap, w) {
  ap.cut = true; apples++; score += 2;
  const x = CX + Math.cos(w) * (R + 12), y = CY + Math.sin(w) * (R + 12);
  for (const side of [-1, 1]) debris.push({ kind: 'apple', half: side, x, y, vx: side * rand(120, 220), vy: rand(-380, -260), rot: 0, vr: side * rand(4, 8) });
  burst(x, y, 12, ['#ff4757', '#ffd1d6', '#fff2b0'], 300, 80, 4, 0.6);
  sfx.apple(); buzz(12);
}

function shatterKnife(y) {
  const cols = ['#eef2f6', '#c3ccd6', '#8e98a6', '#e2604a', '#9b2f22', '#3b3f4a'];
  for (let i = 0; i < 18; i++) {
    const along = rand(0, KL), x = CX + rand(-5, 5), py = y + along;
    const c = along < 58 ? cols[Math.floor(rand(3))] : along < 64 ? cols[5] : cols[3 + Math.floor(rand(2))];
    const a = Math.atan2(py - y + 10, x - CX + rand(-30, 30)) + rand(-0.6, 0.6), sp = rand(250, 650);
    const pts = []; for (let j = 0; j < 3; j++) { const r = rand(3, 8), ang = j / 3 * TAU + rand(-0.6, 0.6); pts.push([Math.cos(ang) * r, Math.sin(ang) * r]); }
    debris.push({ kind: 'shard', x, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 150, rot: rand(TAU), vr: rand(-20, 20), c, pts });
  }
}

function fail(k) {
  k.done = true;
  shatterKnife(k.y);
  burst(CX, k.y, 18, ['#ffffff', '#fff7c2', '#ffd35c'], 420, 40, 3, 0.5);
  if (state !== 'play') { sfx.clang(); return; }   // a second knife in the same moment costs nothing extra
  lives--; heartT = 1;
  finale = lives <= 0; exploded = false; snapReq = false;
  sfx.impact(); sfx.heart();
  if (finale) sfx.finale();
  frac = finale ? null : makeFracture(); gridFrac = finale ? makeGridFracture() : null; unfrozen = false;
  for (let i = 0; i < 24; i++) {
    const a = rand(TAU), sp = rand(200, 750), pts = [];
    for (let j = 0; j < 3 + Math.floor(rand(2)); j++) { const r = rand(4, 15), ang = j / 4 * TAU + rand(-0.5, 0.5); pts.push([Math.cos(ang) * r, Math.sin(ang) * r]); }
    debris.push({ kind: 'glass', x: CX + rand(-10, 10), y: k.y + rand(-10, 10), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200, rot: rand(TAU), vr: rand(-14, 14), pts });
  }
  impactT = IMPACT_TOTAL; impactY = k.y; gray = 1; shake = finale ? 24 : 16;
  const nl = finale ? 26 : 16;
  impactLines = Array.from({ length: nl }, (_, i) => ({ a: i / nl * TAU + rand(-0.12, 0.12), r0: rand(40, 70), r1: rand(260, finale ? 900 : 520), w: rand(2, finale ? 11 : 7) }));
  state = 'impact';
  if (lives <= 0 && score > best) { best = score; newBest = true; save('knaife.best', best); }
  buzz(finale ? [80, 40, 120, 40, 200] : [40, 30, 60]);
}

function breakTarget(t, power = 1) {
  const cuts = [0], nc = power > 1 ? 8 + Math.floor(rand(3)) : 4 + Math.floor(rand(3));
  for (let i = 1; i < nc; i++) cuts.push(i / nc * TAU + rand(-0.2, 0.2));
  cuts.push(TAU);
  for (let i = 0; i < cuts.length - 1; i++) {
    const mid = t.rot + (cuts[i] + cuts[i + 1]) / 2, s = rand(180, 360) * power;
    debris.push({ kind: 'wedge', a0: cuts[i], a1: cuts[i + 1], t, x: CX, y: CY, vx: Math.cos(mid) * s, vy: Math.sin(mid) * s - 320, rot: t.rot, vr: rand(-3, 3) * power });
  }
  for (const s of t.stuck) {
    const w = t.rot + s.a, sp = rand(260, 520) * power;
    debris.push({ kind: 'knife', x: CX + Math.cos(w) * (R - EMBED), y: CY + Math.sin(w) * (R - EMBED),
      vx: Math.cos(w) * sp, vy: Math.sin(w) * sp - 260, rot: w - HALF, vr: rand(-9, 9) });
  }
  for (const ap of t.apples) if (!ap.cut) {
    const w = t.rot + ap.a;
    debris.push({ kind: 'apple', half: 0, x: CX + Math.cos(w) * (R + 12), y: CY + Math.sin(w) * (R + 12), vx: Math.cos(w) * 300, vy: Math.sin(w) * 300 - 260, rot: w + HALF, vr: rand(-6, 6) });
  }
  burst(CX, CY, Math.round(40 * power), [t.pal.light, t.pal.dark, t.pal.bark], 520 * power, 120, 7, 0.9);
}

function clearStage() {
  const t = tgt;
  state = 'clearing'; clearT = 1.15;
  breakTarget(t);
  if (t.boss) { banner = { text: 'BOSS DOWN!', sub: '+5 bonus', t: 1.1, color: '#ffd35c' }; score += 5; }
  tgt = null; shake = 10;
  sfx.smash(); buzz(25);
}

// ---------- update ----------
function update(dt) {
  time += dt;
  heartT = Math.max(0, heartT - dt * 1.5);
  if (state === 'impact') {
    impactT = Math.max(0, impactT - dt);
    const el = IMPACT_TOTAL - impactT;
    if (el < hitstopLen()) return;                         // frozen impact frame
    if (finale) {
      if (!exploded) {
        exploded = true; shake = 30;
        if (tgt) { breakTarget(tgt, 2.2); tgt = null; }
        for (const f of flying) shatterKnife(f.y); flying = [];
        burst(CX, impactY, 50, ['#ffffff', '#dddddd'], 900, 0, 6, 0.8);
      }
      dt *= 0.25;                                          // heavy slow-mo until the screen breaks
      if (el >= FINAL_SNAP && !snapReq) { snapReq = true; shake = 0; }
    }
    else if (el < HITSTOP + 0.3) dt *= 0.3;                // slow-mo
    gray = finale || el < GRAY_HOLD ? 1 : clamp(1 - (el - GRAY_HOLD) / (IMPACT_TOTAL - GRAY_HOLD), 0, 1);
    if (!finale && el >= GRAY_HOLD && !unfrozen) { unfrozen = true; sfx.unfreeze(); }
    if (impactT <= 0) {
      gray = 0; frac = null;
      if (lives > 0) state = 'play';
      else { state = 'dying'; overT = 0.4; }
    }
  }
  const t = tgt;
  if (t && state !== 'rewind') {
    t.t += dt;
    t.pop = Math.min(1, t.pop + dt / 0.35);
    t.rot += t.pat(t.t) * dt;
    t.hit = Math.max(0, t.hit - dt * 7);
  }
  readyT = Math.max(0, readyT - dt);

  for (const k of flying) {
    let move = SPEED * dt;
    while (move > 0 && !k.done) { const st = Math.min(8, move); move -= st; k.y -= st; stepKnife(k); }
  }
  flying = flying.filter(k => !k.done);
  if (state === 'play' && knivesLeft === 0 && flying.length === 0) clearStage();

  for (const d of debris) { if (d.kind === 'shard' || d.kind === 'glass') d.vx *= 1 - dt * 1.5; d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 1500 * dt; d.rot += d.vr * dt; }
  debris = debris.filter(d => d.y < H + 220 && d.x > -220 && d.x < W + 220);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; p.rot += p.vr * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);

  shake = Math.max(0, shake - dt * 40);
  banner.t = Math.max(0, banner.t - dt);

  if (state === 'dying') { overT -= dt; if (overT <= 0) { state = 'over'; overT = 0.6; sfx.over(); } }
  else if (state === 'over') { overT = Math.max(0, overT - dt); overAge += dt; }
  else if (state === 'rewind') {
    rewindT += dt;
    if (!rewFlashed && rewindT >= REW_FLASH) { rewFlashed = true; pieces = []; sfx.flash(); buzz(20); }
    if (!rewSwitched && rewindT >= REW_SWITCH) { rewSwitched = true; makePopup(); sfx.lightSwitch(); shake = 6; buzz([30, 50, 15, 40, 15]); }
    if (rewindT >= REW_BREAK) { shatterPopup(); sfx.popBreak(); shake = 10; state = 'play'; readyT = 0.25; buzz(25); }
  }
  else if (state === 'clearing') { clearT -= dt; if (clearT <= 0) { stage++; newStage(); } }
  updatePieces(dt);
}

// ---------- drawing ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// knife in local space: tip at (0,0), extends toward +y
function drawKnife() {
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.quadraticCurveTo(7, 16, 6.5, 58); ctx.lineTo(-5.5, 58); ctx.lineTo(-5.5, 20); ctx.quadraticCurveTo(-4, 8, 0, 0);
  ctx.closePath();
  const g = ctx.createLinearGradient(-6, 0, 7, 0);
  g.addColorStop(0, '#8e98a6'); g.addColorStop(0.5, '#f4f7fb'); g.addColorStop(1, '#aeb8c4');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(1, 6); ctx.quadraticCurveTo(5, 18, 4.5, 56); ctx.stroke();
  ctx.fillStyle = '#3b3f4a'; rr(-10, 57, 20, 7, 3); ctx.fill();
  const hg = ctx.createLinearGradient(-6.5, 0, 6.5, 0);
  hg.addColorStop(0, '#9b2f22'); hg.addColorStop(0.45, '#e2604a'); hg.addColorStop(1, '#8a281c');
  ctx.fillStyle = hg; rr(-6.5, 63, 13, KL - 66, 5); ctx.fill();
  ctx.fillStyle = '#f3d27a';
  ctx.beginPath(); ctx.arc(0, 78, 2, 0, TAU); ctx.arc(0, 98, 2, 0, TAU); ctx.fill();
  ctx.fillStyle = '#3b3f4a'; rr(-8, KL - 7, 16, 7, 3); ctx.fill();
}

// apple in local space, stem pointing toward -y
function drawApple(half = 0) {
  ctx.save();
  if (half) { ctx.beginPath(); ctx.rect(half < 0 ? -20 : 0, -25, 20, 45); ctx.clip(); }
  const g = ctx.createRadialGradient(-4, -4, 2, 0, 0, 15);
  g.addColorStop(0, '#ff8a8a'); g.addColorStop(0.6, '#e8303f'); g.addColorStop(1, '#a3121f');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(-5, 1, 10.5, 0, TAU); ctx.arc(5, 1, 10.5, 0, TAU); ctx.fill();
  if (half) {
    ctx.fillStyle = '#fff1cf';
    ctx.beginPath(); ctx.ellipse(0, 1, 2.5, 9, 0, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = '#5a3418'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -7); ctx.quadraticCurveTo(1, -12, 3, -15); ctx.stroke();
  ctx.fillStyle = '#4cc36b';
  ctx.beginPath(); ctx.ellipse(7, -13, 5.5, 2.6, -0.5, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(-8, -3, 2, 3.5, 0.4, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawFace(t) {
  const p = t.pal;
  ctx.fillStyle = p.bark;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 28; i++) { const a = i / 28 * TAU; ctx.moveTo(Math.cos(a) * (R - 8), Math.sin(a) * (R - 8)); ctx.lineTo(Math.cos(a + 0.05) * (R - 1), Math.sin(a + 0.05) * (R - 1)); }
  ctx.stroke();
  const [px, py] = t.pith;
  const g = ctx.createRadialGradient(px, py, 4, px, py, R);
  g.addColorStop(0, p.light); g.addColorStop(1, p.dark);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, R - 8, 0, TAU); ctx.fill();
  ctx.strokeStyle = p.ring; ctx.lineWidth = 2;
  for (const r of t.rings) { ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  for (const c of t.cracks) { ctx.beginPath(); ctx.moveTo(c[0][0], c[0][1]); for (const q of c) ctx.lineTo(q[0], q[1]); ctx.stroke(); }
  ctx.fillStyle = p.knot;
  for (const k of t.knots) { ctx.beginPath(); ctx.ellipse(k.x, k.y, k.rx, k.ry, k.rot, 0, TAU); ctx.fill(); }
  ctx.fillStyle = p.ring;
  ctx.beginPath(); ctx.arc(px, py, 4, 0, TAU); ctx.fill();
}

function drawTarget() {
  const t = tgt, s = easeOutBack(t.pop);
  ctx.save();
  ctx.translate(CX, CY - 7 * t.hit);
  ctx.scale(s, s);
  for (const k of t.stuck) { ctx.save(); ctx.rotate(t.rot + k.a - HALF); ctx.translate(0, R - EMBED); drawKnife(); ctx.restore(); }
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  ctx.fillStyle = t.pal.bark; ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.rotate(t.rot); drawFace(t); ctx.restore();
  const sh = ctx.createRadialGradient(-R * 0.35, -R * 0.4, 5, 0, 0, R);
  sh.addColorStop(0, 'rgba(255,255,255,.22)'); sh.addColorStop(0.55, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(0,0,0,.28)');
  ctx.fillStyle = sh; ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
  if (t.hit > 0) { ctx.fillStyle = `rgba(255,255,255,${0.35 * t.hit})`; ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill(); }
  for (const ap of t.apples) {
    if (ap.cut) continue;
    ctx.save(); ctx.rotate(t.rot + ap.a - HALF); ctx.translate(0, R + 12); ctx.rotate(Math.PI); drawApple(); ctx.restore();
  }
  ctx.restore();
}

function drawDebris(d) {
  ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot);
  if (d.kind === 'knife') drawKnife();
  else if (d.kind === 'glass') {
    ctx.beginPath(); ctx.moveTo(d.pts[0][0], d.pts[0][1]);
    for (const q of d.pts) ctx.lineTo(q[0], q[1]); ctx.closePath();
    ctx.fillStyle = 'rgba(225,240,255,.35)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 1.2; ctx.stroke();
  }
  else if (d.kind === 'shard') {
    ctx.fillStyle = d.c; ctx.beginPath(); ctx.moveTo(d.pts[0][0], d.pts[0][1]);
    for (const q of d.pts) ctx.lineTo(q[0], q[1]); ctx.closePath(); ctx.fill();
  }
  else if (d.kind === 'apple') drawApple(d.half);
  else if (d.kind === 'wedge') {
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, d.a0, d.a1); ctx.closePath(); ctx.clip();
    drawFace(d.t);
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.restore();
}

function text(str, x, y, size, color, align = 'center', weight = 800) {
  ctx.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
}

function drawMute() {
  const x = W - 34, y = 34;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(-8, -4); ctx.lineTo(-3, -4); ctx.lineTo(3, -9); ctx.lineTo(3, 9); ctx.lineTo(-3, 4); ctx.lineTo(-8, 4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  if (muted) { ctx.beginPath(); ctx.moveTo(6, -4); ctx.lineTo(12, 4); ctx.moveTo(12, -4); ctx.lineTo(6, 4); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(4, 0, 5, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(4, 0, 9, -0.9, 0.9); ctx.stroke(); }
  ctx.restore();
}

function drawHUD() {
  text(String(score), 22, 40, 40, '#fff', 'left');
  ctx.save(); ctx.translate(32, 82); ctx.scale(0.75, 0.75); drawApple(); ctx.restore();
  text(String(apples), 48, 83, 20, '#ffd1d6', 'left', 700);
  for (let i = 0; i < MAX_LIVES; i++) {
    const lost = i >= lives, justLost = i === lives && heartT > 0;
    const pop = justLost ? 1 + 0.6 * heartT : 1;
    ctx.save(); ctx.translate(W - 34 - i * 26 + (justLost ? rand(-3, 3) * heartT : 0), 76); ctx.scale(pop, pop);
    drawHeart(lost ? 'rgba(255,255,255,.18)' : '#ff4d6a'); ctx.restore();
  }
  // stage dots
  const g0 = Math.floor((stage - 1) / 5) * 5 + 1;
  for (let i = 0; i < 5; i++) {
    const s = g0 + i, x = CX + (i - 2) * 24, y = 30, isBoss = i === 4;
    const col = s < stage ? '#ffd35c' : s === stage ? '#ffffff' : 'rgba(255,255,255,.22)';
    ctx.fillStyle = isBoss && s >= stage ? (s === stage ? '#ff5d6c' : 'rgba(255,93,108,.35)') : col;
    ctx.beginPath();
    if (isBoss) { ctx.moveTo(x, y - 9); ctx.lineTo(x + 9, y); ctx.lineTo(x, y + 9); ctx.lineTo(x - 9, y); }
    else ctx.arc(x, y, s === stage ? 7 : 5.5, 0, TAU);
    ctx.fill();
  }
  const bossName = stage % 5 === 0 ? BOSSES[(stage / 5 - 1) % BOSSES.length].name : null;
  text(bossName ? 'BOSS · ' + bossName : 'STAGE ' + stage, CX, 56, 14, bossName ? '#ff8a95' : 'rgba(255,255,255,.7)', 'center', 700);
  // remaining knives
  for (let i = 0; i < knivesTotal; i++) {
    ctx.save(); ctx.translate(22, H - 52 - i * 22); ctx.rotate(-Math.PI / 4); ctx.scale(0.32, 0.32);
    ctx.globalAlpha = i < knivesLeft ? 1 : 0.2;
    drawKnife(); ctx.restore();
  }
}

function drawHeart(c) {
  ctx.fillStyle = c; ctx.beginPath();
  ctx.moveTo(0, 8); ctx.bezierCurveTo(-12, -1, -9, -11, 0, -5); ctx.bezierCurveTo(9, -11, 12, -1, 0, 8);
  ctx.fill();
}

function drawFracture() {
  if (!frac) return;
  const el = IMPACT_TOTAL - impactT, p = clamp(el / 0.1, 0, 1), alpha = el < GRAY_HOLD ? 1 : gray;
  if (alpha <= 0) return;
  ctx.save(); ctx.translate(CX, impactY); ctx.globalAlpha = alpha;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // glassy panes in the innermost ring
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  frac.web.forEach((w, i) => { if (w[3] < 100 && i % 2 === 0) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(...w[0]); ctx.lineTo(...w[1]); ctx.lineTo(...w[2]); ctx.closePath(); ctx.fill(); } });
  const path = () => {
    ctx.beginPath();
    for (const r of frac.rays) {
      const n = Math.max(1, Math.floor(r.pts.length * p));
      ctx.moveTo(0, 0); for (let i = 1; i < n; i++) ctx.lineTo(...r.pts[i]);
    }
    if (p >= 1) for (const w of frac.web) { ctx.moveTo(...w[0]); ctx.lineTo(...w[1]); ctx.lineTo(...w[2]); }
  };
  path(); ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 4; ctx.stroke();
  path(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; ctx.stroke();
  // crushed point of impact
  ctx.fillStyle = '#fff'; ctx.beginPath();
  for (let i = 0; i < 16; i++) { const r = i % 2 ? 5 : 15, a = i / 16 * TAU; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function gridPath(g, upto) {
  ctx.beginPath();
  for (let i = 0; i < g.n; i++) {
    const col = g.V[i], nxt = g.V[(i + 1) % g.n];
    ctx.moveTo(0, 0);
    for (let j = 1; j < col.length && g.radii[j - 1] <= upto; j++) ctx.lineTo(...col[j]);
    for (let j = 1; j < col.length && g.radii[j] <= upto; j++) { ctx.moveTo(...col[j]); ctx.lineTo(...nxt[j]); }
  }
}

function drawGridFracture() {
  if (!gridFrac || state !== 'impact') return;
  const el = IMPACT_TOTAL - impactT;
  const p = clamp((el - 0.02) / (FINAL_SNAP - 0.08), 0, 1), upto = 1500 * (1 - Math.pow(1 - p, 3));
  ctx.save(); ctx.translate(CX, impactY); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  gridPath(gridFrac, upto); ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.lineWidth = 5; ctx.stroke();
  gridPath(gridFrac, upto); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath();
  for (let i = 0; i < 20; i++) { const r = i % 2 ? 7 : 22, a = i / 20 * TAU; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// freeze the current two-tone frame and cut it into glass pieces along the grid cracks
function thresholdSnapshot() {
  const w = cv.width, h = cv.height;
  let img;
  try { img = ctx.getImageData(0, 0, w, h); } catch (e) { return null; }
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) { const v = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) > 128 ? 255 : 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  const snap = document.createElement('canvas'); snap.width = w; snap.height = h; snap.getContext('2d').putImageData(img, 0, 0);
  return snap;
}

// cut an image (drawn at device sx,sy) into pieces along grid g centred at device gcx,gcy (k = device px per grid unit)
function cutPieces(src, sx, sy, g, gcx, gcy, k, edge) {
  const out = [], toDev = p => [gcx + p[0] * k, gcy + p[1] * k];
  for (let j = 0; j < g.radii.length - 1; j++) for (let i = 0; i < g.n; i++) {
    const A = g.V[i], B = g.V[(i + 1) % g.n];
    const poly = (j === 0 ? [A[0], A[1], B[1]] : [A[j], A[j + 1], B[j + 1], B[j]]).map(toDev);
    const xs = poly.map(p => p[0]), ys = poly.map(p => p[1]);
    const bx = Math.max(sx, Math.floor(Math.min(...xs))), by = Math.max(sy, Math.floor(Math.min(...ys)));
    const bw = Math.min(sx + src.width, Math.ceil(Math.max(...xs))) - bx, bh = Math.min(sy + src.height, Math.ceil(Math.max(...ys))) - by;
    if (bw <= 1 || bh <= 1) continue;
    const c = document.createElement('canvas'); c.width = bw; c.height = bh;
    const cx2 = c.getContext('2d');
    cx2.translate(-bx, -by); cx2.beginPath(); poly.forEach((p, q) => cx2[q ? 'lineTo' : 'moveTo'](p[0], p[1])); cx2.closePath();
    cx2.save(); cx2.clip(); cx2.drawImage(src, sx, sy); cx2.restore();
    cx2.strokeStyle = '#fff'; cx2.lineWidth = edge; cx2.stroke();
    const mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
    out.push({ c, j, ox: bx - mx, oy: by - my, x: mx, y: my, hx: mx, hy: my, r: Math.hypot(bw, bh) / 2, rot: 0, vr: 0, vx: 0, vy: 0, age: 0, delay: 0 });
  }
  return out;
}

function launch(pcs, gcx, gcy, k, lo, hi, stagger) {
  for (const p of pcs) {
    let dx = p.x - gcx, dy = p.y - gcy; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    const sp = rand(lo, hi) * k;
    p.vx = dx * sp + rand(-80, 80) * k; p.vy = dy * sp - rand(150, 450) * k;
    p.vr = rand(-5, 5) * (p.j < 3 ? 2 : 1); p.delay = p.j * stagger;
  }
}

function updatePieces(dt) {
  const g = 2600 * dpr * scale;
  for (const p of pieces) {
    p.age += dt;
    if (p.home || p.age < p.delay) continue;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += g * dt; p.rot += p.vr * dt;
  }
  pieces = pieces.filter(p => p.home || (p.y - p.r < cv.height * 1.2 && p.x + p.r > -cv.width * 0.2 && p.x - p.r < cv.width * 1.2));
}

function shatterScreen() {
  const snap = thresholdSnapshot();
  if (!snap) { pieces = []; return; }
  const k = dpr * scale, icx = dpr * (ox + CX * scale), icy = dpr * (oy + impactY * scale);
  pieces = cutPieces(snap, 0, 0, gridFrac, icx, icy, k, 2.5 * dpr);
  launch(pieces, icx, icy, k, 350, 900, 0.025);
}

function startRewind() {
  startGame();
  state = 'rewind'; rewindT = 0; needRewindSnap = true; rewFlashed = false; rewSwitched = false; popCanvas = null;
  banner.t = 0; tgt.pop = 1; readyT = 0; pieces = [];
  sfx.rewind();
}

function buildRewindPieces() {
  const snap = thresholdSnapshot();
  if (!snap) { pieces = []; return; }
  const k = dpr * scale, gcx = dpr * (ox + CX * scale), gcy = dpr * (oy + CY * scale);
  pieces = cutPieces(snap, 0, 0, makeGridFracture(), gcx, gcy, k, 2.5 * dpr);
  const far = Math.max(cv.width, cv.height);
  for (const p of pieces) {
    let dx = p.hx - gcx, dy = p.hy - gcy; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    const dist = far * rand(0.7, 1.2);
    p.home = true; p.sx = p.hx + dx * dist + rand(-0.15, 0.15) * far; p.sy = p.hy + dy * dist + rand(0, 0.3) * far;
    p.rot0 = rand(-6, 6); p.dur = 0.42; p.delay = (8 - p.j) * 0.045 + rand(0, 0.05);
  }
}

const POP_W = 260, POP_H = 104;
function makePopup() {
  const k = dpr * scale, m = 12, c = document.createElement('canvas');
  c.width = Math.ceil((POP_W + m * 2) * k); c.height = Math.ceil((POP_H + m * 2) * k);
  const g = c.getContext('2d'), saved = ctx;
  g.scale(k, k); g.translate(m, m);
  // hazard-striped steel sign
  g.save(); g.beginPath(); g.rect(0, 0, POP_W, POP_H); g.clip();
  g.fillStyle = '#ffc61a'; g.fillRect(0, 0, POP_W, POP_H);
  g.fillStyle = '#111'; for (let x = -POP_H; x < POP_W + POP_H; x += 26) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 13, 0); g.lineTo(x + 13 - POP_H, POP_H); g.lineTo(x - POP_H, POP_H); g.closePath(); g.fill(); }
  g.restore();
  const pg = g.createLinearGradient(0, 12, 0, POP_H - 12); pg.addColorStop(0, '#3a3e46'); pg.addColorStop(1, '#1b1d22');
  g.fillStyle = pg; g.fillRect(12, 12, POP_W - 24, POP_H - 24);
  g.fillStyle = '#8b919b'; for (const [x, y] of [[20, 20], [POP_W - 20, 20], [20, POP_H - 20], [POP_W - 20, POP_H - 20]]) { g.beginPath(); g.arc(x, y, 3, 0, TAU); g.fill(); }
  g.font = '900 60px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = 'rgba(255,214,90,.8)'; g.shadowBlur = 18; g.fillStyle = '#fff';
  if ('letterSpacing' in g) g.letterSpacing = '8px';
  g.fillText('START', POP_W / 2 + 4, POP_H / 2 + 3);
  popCanvas = c;
  popPos = [dpr * (ox + CX * scale), dpr * (oy + 455 * scale)];
}

function shatterPopup() {
  if (!popCanvas) return;
  const k = dpr * scale, [px, py] = popPos;
  const shards = cutPieces(popCanvas, Math.round(px - popCanvas.width / 2), Math.round(py - popCanvas.height / 2), makeGrid(9, [0, 22, 55, 100, 160, 240]), px, py, k, 1.2 * dpr);
  launch(shards, px, py, k, 250, 700, 0.012);
  pieces = shards; popCanvas = null;
  for (let i = 0; i < 14; i++) {
    const a = rand(TAU), sp = rand(200, 600), pts = [];
    for (let j = 0; j < 3; j++) { const r = rand(3, 10), ang = j / 3 * TAU + rand(-0.5, 0.5); pts.push([Math.cos(ang) * r, Math.sin(ang) * r]); }
    debris.push({ kind: 'glass', x: CX + rand(-60, 60), y: 455 + rand(-20, 20), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200, rot: rand(TAU), vr: rand(-14, 14), pts });
  }
}

function drawRewind() {
  const t = rewindT;
  if (needRewindSnap) { drawScene(); buildRewindPieces(); needRewindSnap = false; }
  let f;
  if (t < REW_FLASH) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
    for (const p of pieces) {
      const u = clamp((t - p.delay) / p.dur, 0, 1), e = 1 - Math.pow(1 - u, 3);
      ctx.save(); ctx.translate(p.sx + (p.hx - p.sx) * e, p.sy + (p.hy - p.sy) * e); ctx.rotate(p.rot0 * (1 - e));
      ctx.drawImage(p.c, p.ox, p.oy); ctx.restore();
    }
    f = 'grayscale(1)';
  } else {
    drawScene();
    const s = t - REW_SWITCH;
    const lit = s >= 0 && !(s >= 0.05 && s < 0.11) && !(s >= 0.15 && s < 0.19);   // fluorescent flicker on
    f = lit ? 'none' : 'grayscale(1) contrast(40)';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const fa = clamp(1 - (t - REW_FLASH) / 0.3, 0, 1);
    if (fa > 0) { ctx.fillStyle = `rgba(255,255,255,${fa})`; ctx.fillRect(0, 0, cv.width, cv.height); }
    if (s >= 0 && popCanvas) {
      const u = clamp(s / 0.2, 0, 1), sc = 0.4 + 0.6 * easeOutBack(u), jit = s < 0.3 ? (0.3 - s) * 20 * dpr : 0;
      ctx.save(); ctx.translate(popPos[0] + rand(-jit, jit), popPos[1] + rand(-jit, jit)); ctx.scale(sc, sc);
      ctx.drawImage(popCanvas, -popCanvas.width / 2, -popCanvas.height / 2); ctx.restore();
    }
  }
  if (cv.style.filter !== f) cv.style.filter = f;
}

function drawPieces() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const p of pieces) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.drawImage(p.c, p.ox, p.oy); ctx.restore();
  }
}

function drawHeartOutline(cracked) {
  ctx.beginPath();
  ctx.moveTo(0, 8); ctx.bezierCurveTo(-12, -1, -9, -11, 0, -5); ctx.bezierCurveTo(9, -11, 12, -1, 0, 8);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  if (cracked) { ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(-2, 0); ctx.lineTo(2, 2); ctx.lineTo(0, 8); ctx.stroke(); }
}

// losing screen: pure black & white, elements slam in fast
function drawOverScreen() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  const t = overAge;
  // spinning speed rays
  ctx.save(); ctx.translate(CX, 300); ctx.rotate(t * 0.15); ctx.fillStyle = 'rgba(255,255,255,.07)';
  for (let i = 0; i < 18; i++) { ctx.rotate(TAU / 18); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(900, -50); ctx.lineTo(900, 50); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  // leftover cracks
  if (gridFrac) { ctx.save(); ctx.translate(CX, impactY); gridPath(gridFrac, 1500); ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore(); }
  const slam = (delay, y, fn) => {
    const u = clamp((t - delay) / 0.16, 0, 1); if (u <= 0) return;
    const sc = 1 + 1.4 * Math.pow(1 - u, 3);
    ctx.save(); ctx.globalAlpha = u; ctx.translate(CX, y); ctx.scale(sc, sc); ctx.translate(-CX, -y); fn(); ctx.restore();
  };
  slam(0.05, 212, () => {
    ctx.fillStyle = '#fff'; ctx.save(); ctx.translate(CX, 212); ctx.rotate(-0.06); ctx.fillRect(-W, -34, W * 2, 68); ctx.restore();
    ctx.save(); ctx.translate(CX, 212); ctx.rotate(-0.06); text('OUT OF LIVES', 0, 2, 44, '#000', 'center', 900); ctx.restore();
  });
  slam(0.18, 278, () => {
    for (let i = 0; i < MAX_LIVES; i++) { ctx.save(); ctx.translate(CX + (i - 1) * 34, 278); ctx.scale(1.2, 1.2); drawHeartOutline(true); ctx.restore(); }
  });
  slam(0.26, 352, () => {
    const shown = Math.round(score * clamp((t - 0.26) / 0.45, 0, 1));
    text(String(shown), CX, 352, 96, '#fff', 'center', 900);
  });
  slam(0.36, 414, () => text(`STAGE ${stage}  ·  ${apples} APPLE${apples === 1 ? '' : 'S'}`, CX, 414, 16, '#fff', 'center', 700));
  slam(0.44, 457, () => {
    if (newBest) { ctx.fillStyle = '#fff'; rr(CX - 80, 438, 160, 36, 4); ctx.fill(); text('NEW BEST!', CX, 457, 20, '#000', 'center', 900); }
    else text('BEST  ' + best, CX, 457, 20, '#fff', 'center', 800);
  });
  if (overT <= 0) { ctx.save(); ctx.globalAlpha = 0.55 + 0.45 * Math.sin(time * 5); text('TAP TO RETRY', CX, 560, 26, '#fff'); ctx.restore(); }
}

function drawImpact() {
  const el = IMPACT_TOTAL - impactT;
  if (el < hitstopLen()) {
    // impact frame: speed lines bursting from the hit point
    ctx.save(); ctx.translate(CX, impactY);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-W, -H * 2, W * 3, H * 4);
    ctx.fillStyle = '#fff';
    for (const l of impactLines) {
      ctx.save(); ctx.rotate(l.a); ctx.beginPath();
      ctx.moveTo(l.r0, 0); ctx.lineTo(l.r1, -l.w); ctx.lineTo(l.r1, l.w); ctx.closePath(); ctx.fill(); ctx.restore();
    }
    ctx.lineWidth = 5; ctx.strokeStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, 26 + el * 400, 0, TAU); ctx.stroke();
    ctx.restore();
  } else if (el < hitstopLen() + 0.1) {
    ctx.fillStyle = `rgba(255,255,255,${0.5 * (1 - (el - hitstopLen()) / 0.1)})`; ctx.fillRect(-W, -H, W * 3, H * 3);
  }
}

function drawBanner() {
  if (banner.t <= 0) return;
  const a = clamp(banner.t / 0.3, 0, 1);
  ctx.save(); ctx.globalAlpha = a;
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 12;
  text(banner.text, CX, 470, 46, banner.color);
  if (banner.sub) text(banner.sub, CX, 512, 20, 'rgba(255,255,255,.85)', 'center', 700);
  ctx.restore();
}

function drawMenu() {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 16;
  const g = ctx.createLinearGradient(0, 70, 0, 120);
  g.addColorStop(0, '#fff3c4'); g.addColorStop(1, '#ffb347');
  ctx.font = '900 64px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillStyle = g; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('KNAIFE', CX, 92);
  ctx.restore();
  text('stick every knife · never hit steel', CX, 134, 15, 'rgba(255,255,255,.7)', 'center', 600);
  const p = 0.6 + 0.4 * Math.sin(time * 4);
  ctx.save(); ctx.globalAlpha = p; text('TAP TO PLAY', CX, 450, 28, '#fff'); ctx.restore();
  if (best > 0) text('BEST  ' + best, CX, 492, 18, '#ffd35c', 'center', 700);
  text('tap · click · space', CX, H - 22, 13, 'rgba(255,255,255,.45)', 'center', 600);
}


function drawScene() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const bg = ctx.createLinearGradient(0, 0, 0, cv.height);
  bg.addColorStop(0, '#2b1c52'); bg.addColorStop(1, '#0e0a1c');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, cv.width, cv.height);

  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  if (shake > 0) ctx.translate(rand(-shake, shake) / 2, rand(-shake, shake) / 2);

  const glow = ctx.createRadialGradient(CX, CY, 20, CX, CY, 280);
  glow.addColorStop(0, tgt && tgt.boss ? 'rgba(255,90,110,.16)' : 'rgba(255,200,120,.13)'); glow.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = glow; ctx.fillRect(-W, -H, W * 3, H * 3);

  if (tgt) drawTarget();
  drawFracture(); drawGridFracture();
  for (const d of debris) drawDebris(d);
  for (const k of flying) { ctx.save(); ctx.translate(CX, k.y); drawKnife(); ctx.restore(); }
  if (((state === 'play' || state === 'rewind') && knivesLeft > 0) || state === 'menu') {
    const off = state === 'play' ? (readyT / 0.12) * 40 : 0;
    ctx.save(); ctx.globalAlpha = clamp(1 - readyT / 0.15, 0.2, 1); ctx.translate(CX, KNIFE_Y + Math.min(off, 60)); drawKnife(); ctx.restore();
  }
  for (const p of parts) {
    ctx.save(); ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); ctx.restore();
  }

  if (state === 'menu') drawMenu();
  else { drawHUD(); drawBanner(); }
  if (state === 'impact') drawImpact();
  drawMute();
}

function draw() {
  if (state === 'over') {
    drawOverScreen(); drawPieces();
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy); drawMute();
    if (cv.style.filter !== 'grayscale(1)') cv.style.filter = 'grayscale(1)';
    return;
  }
  if (state === 'rewind') { drawRewind(); return; }
  drawScene();
  const el = IMPACT_TOTAL - impactT;
  // pure two-tone black & white (inverted on the impact frame), easing back to colour
  if (snapReq && state === 'impact') {
    shatterScreen(); snapReq = false;
    state = 'over'; overAge = 0; overT = 0.9; gray = 0; frac = null;
    sfx.screenBreak(); buzz([60, 30, 60]);
    return;   // the next frame draws the losing screen under the falling pieces
  }
  const f = state === 'impact' && el < hitstopLen() ? 'grayscale(1) contrast(40) invert(1)'
    : gray > 0 ? `grayscale(${gray.toFixed(3)}) contrast(${(1 + 39 * Math.pow(gray, 3)).toFixed(3)})` : 'none';
  if (cv.style.filter !== f) cv.style.filter = f;
  if (pieces.length) drawPieces();
}

// ---------- input ----------
function toVirtual(e) { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left - ox) / scale, (e.clientY - b.top - oy) / scale]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const [x, y] = toVirtual(e);
  if (Math.hypot(x - (W - 34), y - 34) < 24) { muted = !muted; save('knaife.muted', muted); ac(); return; }
  action();
});
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp') { e.preventDefault(); action(); }
  else if (e.code === 'KeyM') { muted = !muted; save('knaife.muted', muted); }
});

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
menuTarget();
requestAnimationFrame(frame);
// test hook
window.__knaife = { get lives() { return lives; }, get state() { return state; }, get score() { return score; }, get stage() { return stage; }, get knivesLeft() { return knivesLeft; } };
</script>
</body>

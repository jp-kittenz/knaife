// ---------- setup ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2, HALF = Math.PI / 2;
const W = 420, H = 760;                 // virtual playfield
const CX = W / 2, CY = 255, R = 92;     // target
const KL = 118, EMBED = 20;             // knife length, how deep it sinks in

const SPEED = 2600;                     // knife speed px/s
let dpr = 1, scale = 1, ox = 0, oy = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = cv.clientWidth || window.innerWidth, ch = cv.clientHeight || window.innerHeight;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  scale = Math.min(cw / W, ch / H);
  ox = (cw - W * scale) / 2; oy = (ch - H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => Math.abs((((a - b + Math.PI) % TAU) + TAU) % TAU - Math.PI);
const easeOutBack = t => { const c = 1.70158; t -= 1; return 1 + (c + 1) * t * t * t + c * t * t; };

function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// ---------- audio ----------
let actx = null, master = null, verb = null, muted = load('knaife.muted', false);
function makeIR(a, secs) {
  const len = Math.floor(a.sampleRate * secs), b = a.createBuffer(2, len, a.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  return b;
}
function ac() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    master = actx.createDynamicsCompressor(); master.threshold.value = -14; master.ratio.value = 6;
    const mg = actx.createGain(); mg.gain.value = 0.9; master.connect(mg).connect(actx.destination);
    verb = actx.createConvolver(); verb.buffer = makeIR(actx, 2.6); verb.connect(master);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
let driveCurve = null;
function route(a, node, o) {
  let n = node;
  if (o.drive) {
    if (!driveCurve) { driveCurve = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; driveCurve[i] = Math.tanh(x * 4); } }
    const ws = a.createWaveShaper(); ws.curve = driveCurve; n.connect(ws); n = ws;
  }
  n.connect(master);
  if (o.wet) { const g = a.createGain(); g.gain.value = o.wet; n.connect(g).connect(verb); }
}
function tone(type, f0, f1, dur, vol, o = {}) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + (o.delay || 0), osc = a.createOscillator(), g = a.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f0, t); osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (o.attack || 0.003)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); route(a, g, o); osc.start(t); osc.stop(t + dur + 0.05);
}
function noise(dur, freq, q, vol, type = 'bandpass', o = {}) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + (o.delay || 0), len = Math.max(1, Math.floor(a.sampleRate * dur));
  const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  const shape = o.rise ? (i => i / len) : (i => Math.pow(1 - i / len, o.curve || 1));
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * shape(i);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q; g.gain.value = vol;
  if (o.sweepTo) f.frequency.exponentialRampToValueAtTime(o.sweepTo, t + dur);
  src.connect(f).connect(g); route(a, g, o); src.start(t);
}
const sfx = {

    for (const [f, d] of [[1046, 0.1], [1568, 0.17], [2093, 0.24]]) tone('triangle', f, f, 0.7, 0.07, { delay: d, wet: 0.9 });

  logExplode() {

// polar grid of cracks covering the whole screen; the same vertices cut the screen into pieces
function makeGridFracture() { return makeGrid(12, [0, 34, 80, 140, 220, 330, 480, 700, 1000, 1500]); }
function makeGrid(n, radii) {
  const V = [];
  const base = rand(TAU);
  for (let i = 0; i < n; i++) {
    const a = base + i / n * TAU + rand(-0.12, 0.12), col = [];
    for (let j = 0; j < radii.length; j++) {
      const r = radii[j] * (j ? rand(0.85, 1.15) : 0), aa = a + (j ? rand(-0.09, 0.09) : 0);
      col.push([Math.cos(aa) * r, Math.sin(aa) * r]);
    }
    V.push(col);
  }
  return { n, radii, V };
}

// cracked-glass pattern radiating from the hit point
function makeFracture() {
  const rays = [], web = [], n = 13;
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + rand(-0.18, 0.18), len = rand(170, 430), pts = [[0, 0]];
    for (let r = 0; r < len;) { r += rand(16, 38); const aa = a + rand(-0.1, 0.1); pts.push([Math.cos(aa) * r, Math.sin(aa) * r]); }
    rays.push({ a, len, pts });
  }
  for (const rr of [rand(28, 40), rand(65, 90), rand(115, 150), rand(180, 230)]) {
    for (let i = 0; i < n; i++) {
      const A = rays[i], B = rays[(i + 1) % n];
      if (A.len < rr || B.len < rr || Math.random() < 0.2) continue;
      const r1 = rr * rand(0.88, 1.12), r2 = rr * rand(0.88, 1.12), mid = (A.a + B.a + (i === n - 1 ? TAU : 0)) / 2, rm = (r1 + r2) / 2 * rand(0.85, 1);
      web.push([[Math.cos(A.a) * r1, Math.sin(A.a) * r1], [Math.cos(mid) * rm, Math.sin(mid) * rm], [Math.cos(B.a) * r2, Math.sin(B.a) * r2], rr]);
    }
  }
  return { rays, web };
}

function placeAngles(n, sep, avoid) {
  const out = [];
  for (let tries = 0; out.length < n && tries < 400; tries++) {
    const a = rand(TAU);
    if (avoid.concat(out).every(b => angDiff(a, b) > sep)) out.push(a);
  }
  return out;
}

function makePattern(n, boss) {
  const dir = Math.random() < 0.5 ? -1 : 1;
  const base = Math.min(1.5 + n * 0.11, 3.4) * dir;
  const pool = boss ? ['reverse', 'chaos', 'surge']
    : n < 3 ? ['steady'] : n < 6 ? ['steady', 'wave'] : ['steady', 'wave', 'reverse', 'surge'];
  const type = pool[Math.floor(rand(pool.length))];
  switch (type) {
    case 'wave':    return t => base * (0.55 + 0.65 * Math.sin(t * 1.3));
    case 'reverse': return t => base * 1.25 * Math.tanh(2.5 * Math.sin(t * 0.85));
    case 'surge':   return t => base * (0.25 + 1.8 * Math.pow(Math.max(0, Math.sin(t * 1.6)), 2));
    case 'chaos':   return t => base * 1.15 * (Math.sin(t * 1.1) + 0.6 * Math.sin(t * 2.7 + 1));
    default:        return () => base;
  }
}

function makeTarget(pal, pat, stuckAngles, appleAngles, boss) {
  const rings = [], cracks = [], knots = [];
  const pox = rand(-8, 8), poy = rand(-8, 8);
  for (let i = 1; i <= 5; i++) rings.push({ r: (R - 14) * i / 5.6 + rand(-3, 3), x: pox * (1 - i / 6), y: poy * (1 - i / 6) });
  for (let i = 0, n = 2 + Math.floor(rand(2)); i < n; i++) {
    const a = rand(TAU), len = rand(0.3, 0.6) * R, pts = [];
    for (let j = 0; j <= 3; j++) {
      const r = R - 8 - len * j / 3, aa = a + rand(-0.08, 0.08);
      pts.push([Math.cos(aa) * r, Math.sin(aa) * r]);
    }
    cracks.push(pts);
  }
  for (let i = 0, n = 1 + Math.floor(rand(2)); i < n; i++) {
    const a = rand(TAU), r = rand(0.35, 0.7) * R;
    knots.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, rx: rand(5, 8), ry: rand(3, 5), rot: a });
  }
  return {
    rot: rand(TAU), t: 0, pop: 0, hit: 0, pat, pal, boss, rings, cracks, knots, pith: [pox, poy],
    stuck: stuckAngles.map(a => ({ a })), apples: appleAngles.map(a => ({ a, cut: false })), craters: [],
  };
}

function menuTarget() {
  const stuck = placeAngles(3, 0.8, []);
  tgt = makeTarget(WOODS[0], () => 0.9, stuck, placeAngles(1, 0.6, stuck), false);
  tgt.pop = 1;
}

function newStage() {
  const boss = stage % 5 === 0;
  knivesTotal = boss ? Math.min(8 + Math.floor(stage / 5), 12) : Math.min(5 + Math.ceil(stage * 0.6), 10);
  knivesLeft = knivesTotal;
  const pre = boss ? Math.min(2 + Math.floor(stage / 10), 5) : Math.min(Math.floor((stage - 1) / 2), 4);
  const stuck = placeAngles(pre, 0.6, []);
  const nApples = Math.random() < (boss ? 0.9 : 0.55) ? (Math.random() < 0.35 ? 2 : 1) : 0;
  const appleAngles = placeAngles(nApples, 0.5, stuck);
  const pal = boss ? BOSSES[(stage / 5 - 1) % BOSSES.length] : WOODS[stage % WOODS.length];
  tgt = makeTarget(pal, makePattern(stage, boss), stuck, appleAngles, boss);
  banner = boss ? { text: 'BOSS', sub: pal.name, t: 1.6, color: '#ff5d6c' } : { text: 'STAGE ' + stage, sub: '', t: 1.0, color: '#fff' };
  readyT = 0.3;
  state = 'play';
}

function startGame() {
  stage = 1; score = 0; apples = 0; newBest = false;
  lives = MAX_LIVES; impactT = 0; gray = 0; finale = false; pieces = []; gridFrac = null; frac = null;
  flying = []; debris = []; parts = [];
  resetAbility();
  newStage();
}

// ---------- actions ----------
function throwKnife() {
  if (state !== 'play' || knivesLeft <= 0 || readyT > 0.04 || abil.state === 'arming') return;
  if (abil.state === 'armed') { abilityThrow(); return; }
  knivesLeft--;
  flying.push({ y: KNIFE_Y, done: false });
  readyT = knivesLeft > 0 ? 0.12 : 0;
  sfx.whoosh();
}

function action() {
  ac();
  if (state === 'menu') { startGame(); return; }
  if (state === 'over') { if (overT <= 0) startRewind(); return; }
  throwKnife();
}

function burst(x, y, n, colors, spd, up = 0, size = 4, life = 0.6) {
  for (let i = 0; i < n; i++) {
    const a = rand(TAU), s = rand(0.3, 1) * spd;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - up, life: rand(0.6, 1) * life, max: life,
      c: colors[Math.floor(rand(colors.length))], s: rand(0.5, 1) * size, rot: rand(TAU), vr: rand(-10, 10) });
  }
}

function stepKnife(k) {
  if (k.slicing) { if (k.y < -KL - 400) k.done = true; return; }
  const t = tgt;
  if (!t) { k.done = true; return; }
  const tip = k.y;
  if (k.ability) k.trail.push(tip);
  // hit another knife?
  if (!k.pierce) for (const s of t.stuck) {
    const w = t.rot + s.a;
    if (angDiff(w, HALF) > 0.5) continue;
    const c = Math.cos(w), sn = Math.sin(w);
    for (let r = R - EMBED + 8; r <= R - EMBED + KL; r += 5) {
      const px = CX + r * c, py = CY + r * sn;
      if (Math.abs(px - CX) < 10 && py >= tip && py <= tip + KL) { if (k.ability) abilityClank(k, s); else fail(k); return; }
    }
  }
  // slice apples
  for (const ap of t.apples) {
    if (ap.cut) continue;
    const w = t.rot + ap.a;
    if (angDiff(w, HALF) < 0.2 && tip <= CY + R + 25) sliceApple(ap, w);
  }
  // stick
  if (tip <= CY + R - EMBED) {
    if (k.ability) { abilityStick(k); return; }
    k.done = true;
    chargeAbility();
    t.stuck.push({ a: HALF - t.rot });
    t.hit = 1; score++;
    burst(CX, CY + R, 8, [t.pal.light, t.pal.dark, t.pal.bark], 260, 60, 5, 0.55);
    sfx.thunk(); buzz(8);
  }
}

function sliceApple(ap, w) {
  ap.cut = true; apples++; score += 2;
  const x = CX + Math.cos(w) * (R + 12), y = CY + Math.sin(w) * (R + 12);
  for (const side of [-1, 1]) debris.push({ kind: 'apple', half: side, x, y, vx: side * rand(120, 220), vy: rand(-380, -260), rot: 0, vr: side * rand(4, 8) });
  burst(x, y, 12, ['#ff4757', '#ffd1d6', '#fff2b0'], 300, 80, 4, 0.6);
  sfx.apple(); buzz(12);
}

function shatterKnife(y) {
  const cols = ['#eef2f6', '#c3ccd6', '#8e98a6', '#e2604a', '#9b2f22', '#3b3f4a'];
  for (let i = 0; i < 18; i++) {
    const along = rand(0, KL), x = CX + rand(-5, 5), py = y + along;
    const c = along < 58 ? cols[Math.floor(rand(3))] : along < 64 ? cols[5] : cols[3 + Math.floor(rand(2))];
    const a = Math.atan2(py - y + 10, x - CX + rand(-30, 30)) + rand(-0.6, 0.6), sp = rand(250, 650);
    const pts = []; for (let j = 0; j < 3; j++) { const r = rand(3, 8), ang = j / 3 * TAU + rand(-0.6, 0.6); pts.push([Math.cos(ang) * r, Math.sin(ang) * r]); }
    debris.push({ kind: 'shard', x, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 150, rot: rand(TAU), vr: rand(-20, 20), c, pts });
  }
}

function fail(k) {
  k.done = true;
  shatterKnife(k.y);
  burst(CX, k.y, 18, ['#ffffff', '#fff7c2', '#ffd35c'], 420, 40, 3, 0.5);
  if (state !== 'play') { sfx.clang(); return; }   // a second knife in the same moment costs nothing extra
  lives--; heartT = 1; breakHeart(lives);
  finale = lives <= 0; exploded = false; snapReq = false;
  sfx.impact(); sfx.heart();
  if (finale) sfx.finale();
  frac = finale ? null : makeFracture(); gridFrac = finale ? makeGridFracture() : null; unfrozen = false;
  for (let i = 0; i < 24; i++) {
    const a = rand(TAU), sp = rand(200, 750), pts = [];
    for (let j = 0; j < 3 + Math.floor(rand(2)); j++) { const r = rand(4, 15), ang = j / 4 * TAU + rand(-0.5, 0.5); pts.push([Math.cos(ang) * r, Math.sin(ang) * r]); }
    debris.push({ kind: 'glass', x: CX + rand(-10, 10), y: k.y + rand(-10, 10), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200, rot: rand(TAU), vr: rand(-14, 14), pts });
  }
  impactT = IMPACT_TOTAL; impactY = k.y; gray = 1; shake = finale ? 24 : 16;
  const nl = finale ? 26 : 16;
  impactLines = Array.from({ length: nl }, (_, i) => ({ a: i / nl * TAU + rand(-0.12, 0.12), r0: rand(40, 70), r1: rand(260, finale ? 900 : 520), w: rand(2, finale ? 11 : 7) }));
  state = 'impact';
  if (lives <= 0 && score > best) { best = score; newBest = true; save('knaife.best', best); }
  buzz(finale ? [80, 40, 120, 40, 200] : [40, 30, 60]);
}

function breakTarget(t, power = 1, halves = false) {
  if (halves) {
    for (const side of [-1, 1]) debris.push({ kind: 'half', side, t, lrot: t.rot, x: CX, y: CY, vx: side * 230, vy: -180, rot: 0, vr: side * 1.1 });
  }
  const cuts = [0], nc = power > 1 ? 8 + Math.floor(rand(3)) : 4 + Math.floor(rand(3));
  for (let i = 1; i < nc; i++) cuts.push(i / nc * TAU + rand(-0.2, 0.2));
  cuts.push(TAU);
  for (let i = 0; i < (halves ? 0 : cuts.length - 1); i++) {
    const mid = t.rot + (cuts[i] + cuts[i + 1]) / 2, s = rand(180, 360) * power;
    debris.push({ kind: 'wedge', a0: cuts[i], a1: cuts[i + 1], t, x: CX, y: CY, vx: Math.cos(mid) * s, vy: Math.sin(mid) * s - 320, rot: t.rot, vr: rand(-3, 3) * power });
  }
  for (const s of t.stuck) {
    const w = t.rot + s.a, sp = rand(260, 520) * power;
    debris.push({ kind: 'knife', x: CX + Math.cos(w) * (R - EMBED), y: CY + Math.sin(w) * (R - EMBED),
      vx: Math.cos(w) * sp, vy: Math.sin(w) * sp - 260, rot: w - HALF, vr: rand(-9, 9) });
  }
  for (const ap of t.apples) if (!ap.cut) {
    const w = t.rot + ap.a;
    debris.push({ kind: 'apple', half: 0, x: CX + Math.cos(w) * (R + 12), y: CY + Math.sin(w) * (R + 12), vx: Math.cos(w) * 300, vy: Math.sin(w) * 300 - 260, rot: w + HALF, vr: rand(-6, 6) });
  }
  burst(CX, CY, Math.round(40 * power), [t.pal.light, t.pal.dark, t.pal.bark], 520 * power, 120, 7, 0.9);
}

function clearStage() {
  const t = tgt;
  state = 'clearing'; clearT = 1.15;
  breakTarget(t);
  if (t.boss) { banner = { text: 'BOSS DOWN!', sub: '+5 bonus', t: 1.1, color: '#ffd35c' }; score += 5; }
  tgt = null; shake = 10;
  sfx.smash(); buzz(25);
}

// ---------- ability: the Shroud Blade ----------
const BTN = [W - 56, H - 80];
const KNIFE_MID = () => [CX, KNIFE_Y + KL / 2];
const abil = { state: 'ready', charge: 0, need: 4, swirl: null, flash: 0 };
const INVERT = 'grayscale(1) contrast(40) invert(1)', TWO_TONE = 'grayscale(1) contrast(40)';
const CANVAS_FILTER = typeof ctx.filter === 'string';
let fx = null, tscale = 1, fxFilter = null, slash = 0, ripple = null, rippleBuf = null;
let smoke = [], screenHits = [], floaters = [], rings = [];
const hash = (i, q, k) => { const v = Math.sin(i * 12.9898 + q * 78.233 + k * 37.719) * 43758.5453; return v - Math.floor(v); };

function resetAbility() {
  abil.state = 'ready'; abil.charge = 0; abil.swirl = null; abil.flash = 0;
  fx = null; tscale = 1; fxFilter = null; slash = 0; ripple = null;
  smoke = []; screenHits = []; floaters = []; rings = [];
}

function makeSwirl(dir, from, to, dur) {
  const parts = [];
  for (let i = 0; i < 70; i++) parts.push({ a0: rand(TAU), r0: rand(14, 48), s: 2 + Math.floor(rand(3)) * 1.5, c: Math.random() < 0.5 ? '#fff' : '#000', off: rand(0, 0.18), spin: rand(0.7, 1.3) });
  return { dir, from, to, t: 0, dur, parts };
}

function activateAbility() {
  if (state !== 'play' || abil.state !== 'ready' || knivesLeft <= 0) return;
  abil.state = 'arming'; abil.swirl = makeSwirl('in', BTN, KNIFE_MID(), 0.6);
  sfx.abilityArm(); buzz(15);
}

function summonButton(x, y) {
  abil.state = 'summoning'; abil.swirl = makeSwirl('out', [x, y], BTN, 0.65);
  sfx.summon();
}

function chargeAbility() {
  if (abil.state !== 'cooldown') return;
  abil.charge++;
  if (abil.charge >= abil.need) { abil.state = 'ready'; abil.flash = 1; sfx.ready(); buzz(10); }
}

function updateAbility(rdt) {
  abil.flash = Math.max(0, abil.flash - rdt * 2);
  const sw = abil.swirl;
  if (sw) {
    sw.t += rdt;
    if (sw.t >= sw.dur) {
      abil.swirl = null;
      if (sw.dir === 'in') { abil.state = 'armed'; sfx.abilityArmed(); buzz([20, 30, 40]); }
      else { abil.state = abil.charge >= abil.need ? 'ready' : 'cooldown'; }
    }
  }
  for (const f of floaters) f.t += rdt;
  floaters = floaters.filter(f => f.t < 1.1);
  for (const h of screenHits) {
    const was = h.t; h.t += rdt;
    if (was < 0 && h.t >= 0) { sfx.screenHit(); shake = Math.max(shake, 5); buzz(8); }
  }
  screenHits = screenHits.filter(h => h.t < h.life);
  if (ripple) { ripple.t += rdt; if (ripple.t > 0.42) ripple = null; }
  slash = Math.max(0, slash - rdt * 2.2);
}

function abilityThrow() {
  knivesLeft--;
  flying.push({ y: KNIFE_Y, done: false, ability: true, trail: [] });
  abil.state = 'used';
  fx = { type: 'flight', t: 0, freeze: 0 };
  state = 'fx'; readyT = 0;
  sfx.heavyThrow(); buzz(30);
}

function floater(text, x, y, color = '#fff') { floaters.push({ text, x, y, t: 0, color }); }
function shock(x, y, max = 0.5, size = 160) { rings.push({ x, y, t: 0, max, size }); }
function impactLinesFor(n, len) { return Array.from({ length: n }, (_, i) => ({ a: i / n * TAU + rand(-0.12, 0.12), r0: rand(30, 60), r1: rand(200, len), w: rand(2, 9) })); }

function addCrater(t, a) {
  const cracks = [];
  for (let i = 0; i < 6; i++) {
    const ang = Math.PI + rand(-1.1, 1.1), pts = [[R - 12, 0]];
    let x = R - 12, y = 0;
    for (let j = 0; j < 3; j++) { const l = rand(6, 13), aa = ang + rand(-0.35, 0.35); x += Math.cos(aa) * l; y += Math.sin(aa) * l; pts.push([x, y]); }
    cracks.push(pts);
  }
  t.craters.push({ a, cracks, smoke: 5, acc: 0 });
}

function drawCraters(t) {
  for (const c of t.craters) {
    ctx.save(); ctx.rotate(c.a);
    ctx.beginPath(); ctx.arc(0, 0, R - 0.5, 0, TAU); ctx.clip();
    const g = ctx.createRadialGradient(R - 8, 0, 2, R - 8, 0, 26);
    g.addColorStop(0, 'rgba(15,6,2,.95)'); g.addColorStop(0.45, 'rgba(40,18,6,.7)'); g.addColorStop(1, 'rgba(40,18,6,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(R - 8, 0, 26, 0, TAU); ctx.fill();
    ctx.lineJoin = 'round';
    for (const cr of c.cracks) {
      ctx.beginPath(); cr.forEach((p, i) => ctx[i ? 'lineTo' : 'moveTo'](p[0], p[1]));
      ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineWidth = 2.2; ctx.stroke();
      ctx.strokeStyle = 'rgba(255,220,170,.25)'; ctx.lineWidth = 0.7; ctx.stroke();
    }
    ctx.fillStyle = '#0d0502'; ctx.beginPath(); ctx.ellipse(R - 7, 0, 8, 11, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,200,140,.35)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(R - 7, 0, 9.5, 12.5, 0, Math.PI * 0.6, Math.PI * 1.4); ctx.stroke();
    ctx.restore();
  }
}

// smoke rises from craters and is flung by the spinning log
function emitSmoke(t, dt) {
  const omega = t.pat(t.t);
  for (const c of t.craters) {
    if (c.smoke <= 0) continue;
    c.smoke -= dt; c.acc += dt * 40 * clamp(c.smoke / 5, 0.15, 1);
    while (c.acc >= 1) {
      c.acc--;
      const w = t.rot + c.a, r = R - 4, x = CX + Math.cos(w) * r, y = CY + Math.sin(w) * r;
      const tv = omega * r * 0.75;
      smoke.push({ x, y, vx: -Math.sin(w) * tv + Math.cos(w) * rand(10, 40), vy: Math.cos(w) * tv + Math.sin(w) * rand(10, 40), r: rand(3, 6), life: rand(1.2, 2), max: 2, g: rand(90, 150) });
    }
  }
}
function updateSmoke(dt) {
  for (const p of smoke) { p.vx *= 1 - dt * 1.6; p.vy = p.vy * (1 - dt * 1.6) - 45 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += 16 * dt; p.life -= dt; }
  smoke = smoke.filter(p => p.life > 0);
}
function drawSmoke() {
  for (const p of smoke) {
    ctx.globalAlpha = 0.32 * clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = `rgb(${p.g},${p.g},${p.g + 8})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// knife broken into shards along any direction (tip at x,y, pointing along ang toward the tip)
function shatterKnifeAt(x, y, ang, power) {
  const cols = ['#eef2f6', '#c3ccd6', '#8e98a6', '#e2604a', '#9b2f22', '#3b3f4a'];
  const dx = -Math.cos(ang), dy = -Math.sin(ang);
  for (let i = 0; i < 26; i++) {
    const along = rand(0, KL), px = x + dx * along, py = y + dy * along;
    const c = along < 58 ? cols[Math.floor(rand(3))] : along < 64 ? cols[5] : cols[3 + Math.floor(rand(2))];
    const a = rand(TAU), sp = rand(200, 700) * power;
    const pts = []; for (let j = 0; j < 3; j++) { const r = rand(3, 9), q = j / 3 * TAU + rand(-0.6, 0.6); pts.push([Math.cos(q) * r, Math.sin(q) * r]); }
    debris.push({ kind: 'shard', x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200, rot: rand(TAU), vr: rand(-22, 22), c, pts });
  }
}

// fragments that fly at the camera and crack the screen itself
function scheduleScreenHits(n, colors, spread = 1.0) {
  const vx0 = -ox / scale, vx1 = (cv.width / dpr - ox) / scale, vy0 = -oy / scale, vy1 = (cv.height / dpr - oy) / scale;
  for (let i = 0; i < n; i++) {
    const rays = [];
    for (let k = 0, m = 7 + Math.floor(rand(4)); k < m; k++) {
      const a = k / m * TAU + rand(-0.2, 0.2), len = rand(25, 70), pts = [[0, 0]];
      for (let r = 0; r < len;) { r += rand(6, 14); const aa = a + rand(-0.15, 0.15); pts.push([Math.cos(aa) * r, Math.sin(aa) * r]); }
      rays.push(pts);
    }
    const shard = []; for (let j = 0; j < 4; j++) { const r = rand(4, 10), q = j / 4 * TAU + rand(-0.5, 0.5); shard.push([Math.cos(q) * r, Math.sin(q) * r]); }
    screenHits.push({ x: rand(vx0 + 30, vx1 - 30), y: rand(vy0 + 60, vy1 - 60), t: -rand(0.05, spread), life: 2.8, rays, shard, c: colors[Math.floor(rand(colors.length))], rot: rand(TAU) });
  }
}
function drawScreenHits() {
  for (const h of screenHits) {
    if (h.t < 0) continue;
    const a = h.t < 0.6 ? 1 : clamp(1 - (h.t - 0.6) / (h.life - 0.6), 0, 1);
    ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.rot); ctx.globalAlpha = a; ctx.lineJoin = 'round';
    if (h.t < 0.08) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 30 * (1 - h.t / 0.08) + 6, 0, TAU); ctx.fill(); }
    const grow = clamp(h.t / 0.06, 0, 1);
    ctx.beginPath();
    for (const r of h.rays) { const n = Math.max(2, Math.ceil(r.length * grow)); ctx.moveTo(0, 0); for (let i = 1; i < n; i++) ctx.lineTo(...r[i]); }
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 3; ctx.stroke(); ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 1.2; ctx.stroke();
    if (grow >= 1) {
      ctx.beginPath();
      h.rays.forEach((r, i) => { const nx = h.rays[(i + 1) % h.rays.length]; const j = Math.min(2, r.length - 1, nx.length - 1); ctx.moveTo(...r[j]); ctx.lineTo(...nx[j]); });
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 0.9; ctx.stroke();
    }
    ctx.beginPath(); h.shard.forEach((p, i) => ctx[i ? 'lineTo' : 'moveTo'](...p)); ctx.closePath();
    ctx.fillStyle = h.c; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }
}

function drawRings() {
  for (const r of rings) {
    const u = r.t / r.max;
    ctx.strokeStyle = `rgba(255,255,255,${(1 - u) * 0.9})`; ctx.lineWidth = 10 * (1 - u) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, 20 + r.size * (1 - Math.pow(1 - u, 3)), 0, TAU); ctx.stroke();
  }
}

function drawFloaters() {
  for (const f of floaters) {
    const u = f.t / 1.1, sc = f.t < 0.12 ? 1.8 - 0.8 * f.t / 0.12 : 1;
    ctx.save(); ctx.globalAlpha = clamp((1 - u) * 2, 0, 1); ctx.translate(f.x, f.y - 40 * u); ctx.scale(sc, sc);
    ctx.lineWidth = 5; ctx.strokeStyle = '#000';
    ctx.font = '900 30px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeText(f.text, 0, 0); ctx.fillStyle = f.color; ctx.fillText(f.text, 0, 0);
    ctx.restore();
  }
}

function drawSlash() {
  if (slash <= 0) return;
  ctx.save(); ctx.globalAlpha = slash;
  ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 20;
  ctx.fillRect(CX - 2 - 6 * slash, CY - R - 120, 4 + 12 * slash, 2 * R + 240);
  ctx.restore();
}

function drawFxImpactFrame() {
  ctx.save(); ctx.translate(fx.x, fx.y);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-W * 2, -H * 2, W * 4, H * 4);
  ctx.fillStyle = '#fff';
  for (const l of fx.lines) { ctx.save(); ctx.rotate(l.a); ctx.beginPath(); ctx.moveTo(l.r0, 0); ctx.lineTo(l.r1, -l.w); ctx.lineTo(l.r1, l.w); ctx.closePath(); ctx.fill(); ctx.restore(); }
  ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 24 + fx.t * 500, 0, TAU); ctx.stroke();
  ctx.restore();
}

// colour floods back in from a ripple; everything outside it stays two-tone
function drawRipple() {
  if (!ripple || !CANVAS_FILTER) return;
  const u = clamp(ripple.t / 0.4, 0, 1), e = 1 - Math.pow(1 - u, 3);
  const x = dpr * (ox + ripple.x * scale), y = dpr * (oy + ripple.y * scale), r = Math.hypot(cv.width, cv.height) * e;
  if (!rippleBuf || rippleBuf.width !== cv.width || rippleBuf.height !== cv.height) { rippleBuf = document.createElement('canvas'); rippleBuf.width = cv.width; rippleBuf.height = cv.height; }
  const b = rippleBuf.getContext('2d'); b.clearRect(0, 0, cv.width, cv.height); b.drawImage(cv, 0, 0);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.beginPath(); ctx.rect(0, 0, cv.width, cv.height); ctx.arc(x, y, r, 0, TAU); ctx.clip('evenodd');
  ctx.filter = TWO_TONE; ctx.drawImage(rippleBuf, 0, 0); ctx.filter = 'none';
  ctx.restore();
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.strokeStyle = `rgba(255,255,255,${1 - u})`; ctx.lineWidth = 10 * dpr * (1 - u) + 2;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.strokeStyle = `rgba(255,255,255,${0.5 * (1 - u)})`; ctx.lineWidth = 3 * dpr;
  ctx.beginPath(); ctx.arc(x, y, r * 0.8, 0, TAU); ctx.stroke();
  ctx.restore();
}

// ---- the three outcomes ----
function abilityStick(k) {
  const t = tgt;
  const extra = k.dmg === 1 ? 0 : 1, remaining = Math.max(0, knivesLeft - extra);
  const lethal = remaining === 0;
  if (extra && lethal) { startSlice(k); return; }                       // CASE 2
  k.done = true;
  const a = HALF - t.rot;
  t.stuck.push({ a, ability: true }); addCrater(t, a);
  knivesLeft = remaining; score += 1 + extra; t.hit = 1;
  burst(CX, CY + R, 30, [t.pal.light, t.pal.dark, t.pal.bark, '#222'], 520, 120, 7, 0.8);
  if (fx && fx.type === 'clank') {
    sfx.thunk(); sfx.abilityImpact(); shake = 14;
    if (lethal) explodeLog();                                          // CASE 3
    return;
  }
  // plain double-damage hit
  fx = { type: 'hit', t: 0, freeze: 0.13, x: CX, y: CY + R, lines: impactLinesFor(22, 700) };
  shock(CX, CY + R, 0.5, 200); floater('×2', CX + 70, CY + R + 10, '#fff');
  sfx.abilityImpact(); shake = 20; buzz([50, 30, 80]);
}

function abilityClank(k, s) {                                           // CASE 1 / 3 start
  k.hold = true;
  fx = { type: 'clank', t: 0, freeze: 0.15, x: CX, y: k.y, k, s, exploded: 0, lethal: false, frac: makeFracture(), lines: impactLinesFor(18, 600) };
  burst(CX, k.y, 26, ['#ffffff', '#fff7c2', '#ffd35c'], 520, 30, 3, 0.5);
  sfx.clank(); shake = 16; buzz([60, 20, 60]);
}

function explodeHitKnife() {
  const t = tgt, s = fx.s;
  if (t) {
    const i = t.stuck.indexOf(s);
    if (i >= 0) {
      t.stuck.splice(i, 1);
      const w = t.rot + s.a;
      shatterKnifeAt(CX + Math.cos(w) * (R - EMBED), CY + Math.sin(w) * (R - EMBED), w + Math.PI, 1.6);
    }
  }
  burst(CX, fx.y, 40, ['#ffffff', '#ffd35c', '#c3ccd6'], 800, 40, 4, 0.7);
  shock(CX, fx.y, 0.45, 180);
  scheduleScreenHits(5, ['#eef2f6', '#c3ccd6', '#e2604a', '#3b3f4a'], 1.0);
  fx.exploded = fx.t; fx.k.hold = false; fx.k.pierce = true; fx.k.dmg = 1;
  floater('PIERCE', CX - 70, fx.y, '#fff');
  sfx.knifeExplode(); shake = 22; buzz([40, 20, 40]);
}

function explodeLog() {
  const t = tgt;
  fx.lethal = true; fx.boss = t.boss;
  breakTarget(t, 2.4); tgt = null;
  scheduleScreenHits(8, [t.pal.light, t.pal.dark, t.pal.bark], 1.1);
  shock(CX, CY, 0.6, 320);
  fx.exploded = fx.t;                                                   // replay the slow-mo beat for the log
  floater('SHATTERED', CX, CY - R - 20, '#fff');
  sfx.logExplode(); shake = 28; buzz([80, 30, 120]);
}

function startSlice(k) {                                                 // CASE 2
  k.slicing = true;
  fx = { type: 'slice', t: 0, freeze: 0.1, x: CX, y: CY + R, k, cut: false, lines: impactLinesFor(22, 700), boss: tgt.boss };
  sfx.abilityImpact(); sfx.slowmo(); shake = 12; buzz(60);
}

function doSlice() {
  const t = tgt;
  fx.cut = true; fx.k.fast = 2.4;
  if (t) { breakTarget(t, 1, true); tgt = null; }
  knivesLeft = 0; score += 2;
  slash = 1; shake = 18;
  floater('SLICED', CX, CY - R - 30, '#fff');
  sfx.slice(); buzz([30, 20, 90]);
}

function endFx(next) {
  const boss = fx && fx.boss;
  fx = null; fxFilter = null; tscale = 1;
  if (next === 'play') { state = 'play'; readyT = 0.15; }
  else {
    state = 'clearing'; clearT = 0.8;
    if (boss) { banner = { text: 'BOSS DOWN!', sub: '+5 bonus', t: 1.1, color: '#ffd35c' }; score += 5; }
  }
}

// returns true while the game is frozen on an impact frame
function updateFx(rdt) {
  if (!fx) return false;
  fx.t += rdt; const t = fx.t;
  if (t < fx.freeze) { fxFilter = INVERT; return true; }
  fxFilter = null;
  switch (fx.type) {
    case 'flight':
      tscale = Math.max(0.28, 1 - t * 9);
      if (!flying.some(k => k.ability)) endFx('play');                  // safety: knife vanished
      break;
    case 'hit':
      tscale = clamp(0.2 + (t - fx.freeze) / 0.45 * 0.8, 0.2, 1);
      if (!fx.summoned && t > 0.4) { fx.summoned = true; summonButton(fx.x, fx.y); }
      if (t > 0.6) endFx('play');
      break;
    case 'clank': {
      if (!fx.exploded) { tscale = 0.08; if (t >= 0.55) explodeHitKnife(); break; }
      const e = t - fx.exploded;
      tscale = e < 0.07 ? 1 : e < 0.45 ? 0.22 : clamp(0.22 + (e - 0.45) * 2.6, 0.22, 1);
      if (fx.k.done && !fx.summoned && e > 0.5) { fx.summoned = true; summonButton(CX, CY + R); }
      if (fx.k.done && e > 0.8) endFx(fx.lethal ? 'clearing' : 'play');
      break;
    }
    case 'slice':
      fxFilter = TWO_TONE;
      if (t < 0.75) tscale = 0.05;
      else { if (!fx.cut) doSlice(); tscale = t < 1.1 ? 0.45 : 1; }
      if (t >= 1.2 && !fx.rippled) { fx.rippled = true; ripple = { t: 0, x: CX, y: CY }; sfx.ripple(); }
      if (ripple) fxFilter = CANVAS_FILTER ? null : `grayscale(${(1 - ripple.t / 0.4).toFixed(3)})`;
      if (fx.rippled && !ripple) fxFilter = null;
      if (t >= 1.35 && !fx.summoned) { fx.summoned = true; summonButton(CX, CY); }
      if (t >= 1.7) endFx('clearing');
      break;
  }
  return false;
}

// ---- drawing: knife aura, contrail, wind ----
function drawKnifeAura(y, power) {
  const q = Math.floor(time * 14);
  for (let i = 0; i < 46; i++) {
    const along = hash(i, q, 1) * (KL + 20) - 10, side = (hash(i, q, 2) < 0.5 ? -1 : 1) * (8 + hash(i, q, 3) * 16);
    const sz = (2 + Math.floor(hash(i, q, 4) * 3)) * 1.5;
    ctx.fillStyle = hash(i, q, 5) < 0.5 ? '#fff' : '#000';
    ctx.globalAlpha = 0.5 + 0.5 * hash(i, q, 6);
    ctx.fillRect(Math.round((CX + side) / 3) * 3, Math.round((y + along) / 3) * 3, sz, sz);
  }
  for (let i = 0; i < 22; i++) {
    const a = time * 3.2 + i / 22 * TAU, x = CX + Math.cos(a) * 28, yy = y + KL / 2 + Math.sin(a) * 72;
    ctx.fillStyle = i % 2 ? '#fff' : '#000'; ctx.globalAlpha = 0.85 * power;
    ctx.fillRect(Math.round(x / 3) * 3, Math.round(yy / 3) * 3, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function drawAbilityKnife(k) {
  if (!k.slicing && fx && (fx.type === 'flight' || fx.type === 'clank')) {
    // contrail behind the pommel
    const top = k.y + KL - 6, len = Math.min(260, KNIFE_Y + KL - top + 120);
    const g = ctx.createLinearGradient(0, top, 0, top + len);
    g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(CX - 9, top); ctx.lineTo(CX + 9, top); ctx.lineTo(CX + 1.5, top + len); ctx.lineTo(CX - 1.5, top + len); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(CX - 1, top, 2, len * 0.7);
    // wind pushing against the tip: bow-wave arcs and streaks
    ctx.lineCap = 'round';
    for (let j = 0; j < 4; j++) {
      const o = (time * 3.5 + j / 4) % 1;
      ctx.strokeStyle = `rgba(255,255,255,${0.85 * (1 - o)})`; ctx.lineWidth = 2.2 * (1 - o) + 0.6;
      for (const sd of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(CX + sd * 2, k.y - 10 - (1 - o) * 4);
        ctx.quadraticCurveTo(CX + sd * (12 + o * 26), k.y + 6, CX + sd * (16 + o * 40), k.y + 40 + o * 70); ctx.stroke();
      }
    }
    for (let i = 0; i < 10; i++) {
      const sx = CX + (i % 2 ? 1 : -1) * (18 + hash(i, 0, 7) * 34), sy = k.y - 30 + ((time * 700 + hash(i, 0, 8) * 260) % 260);
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + 26); ctx.stroke();
    }
  }
  drawKnifeAura(k.y, 1);
  ctx.save(); ctx.translate(CX, k.y); ctx.shadowColor = '#fff'; ctx.shadowBlur = 18; drawKnife(); ctx.restore();
}

// ---- the button: emblem from the reference sketch ----
function drawLogo(fg, bg) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = fg; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(-13, -21); ctx.quadraticCurveTo(0, -18, 13, -23); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-12, -16); ctx.quadraticCurveTo(1, -13, 15, -17); ctx.stroke();
  const poly = pts => { ctx.beginPath(); pts.forEach((p, i) => ctx[i ? 'lineTo' : 'moveTo'](...p)); ctx.closePath(); };
  ctx.fillStyle = fg;
  poly([[-11, -6], [-22, 7], [-17, 9], [-13, 0]]); ctx.fill();                    // sleeves
  poly([[11, -6], [22, 5], [19, 9], [13, 0]]); ctx.fill();
  poly([[-7, 5], [-15, 19], [-8, 18], [-6, 9]]); ctx.fill();                      // lower flares
  poly([[6, 6], [15, 20], [9, 21], [6, 10]]); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-10, -9); ctx.quadraticCurveTo(0, -12, 10, -9);     // cloak with jagged hem
  ctx.lineTo(12, -2); ctx.lineTo(14, 10); ctx.lineTo(8, 2); ctx.lineTo(6, 9); ctx.lineTo(3, 1); ctx.lineTo(0, 6);
  ctx.lineTo(-3, 1); ctx.lineTo(-6, 9); ctx.lineTo(-8, 2); ctx.lineTo(-14, 10); ctx.lineTo(-12, -2); ctx.closePath(); ctx.fill();
  // dagger, blade up
  poly([[0, -14], [2.8, -7], [2.5, 14], [-2.5, 14], [-2.8, -7]]);
  ctx.fillStyle = fg; ctx.fill(); ctx.strokeStyle = bg; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(0, 12); ctx.strokeStyle = bg; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.fillStyle = fg; ctx.strokeStyle = bg; ctx.lineWidth = 1.2;
  rr(-6, 14, 12, 3, 1); ctx.fill(); ctx.stroke();

}

function drawButtonBody(grey, sc, rot) {
  ctx.save(); ctx.translate(BTN[0], BTN[1]); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.fillStyle = grey ? '#26262b' : '#000';
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.fill();
  ctx.strokeStyle = grey ? '#55555c' : '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.stroke();
  ctx.strokeStyle = grey ? '#3a3a40' : '#fff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.stroke();
  ctx.translate(0, 1); drawLogo(grey ? '#6c6c74' : '#fff', grey ? '#26262b' : '#000');
  ctx.restore();
}

function drawPixelAura(x, y, rad, density) {
  const q = Math.floor(time * 12);
  for (let i = 0; i < 64; i++) {
    if (hash(i, q, 2) > density) continue;
    const a = i / 64 * TAU + time * 0.7, r = rad + hash(i, q, 1) * 14 + Math.sin(time * 6 + i) * 2;
    const sz = hash(i, q, 3) < 0.3 ? 6 : 3;
    ctx.fillStyle = hash(i, q, 4) < 0.5 ? '#fff' : '#000';
    ctx.fillRect(Math.round((x + Math.cos(a) * r) / 3) * 3, Math.round((y + Math.sin(a) * r) / 3) * 3, sz, sz);
  }
  for (let i = 0; i < 10; i++) {                 // pixels drifting off
    const ph = (time * 0.8 + hash(i, 0, 9)) % 1, a = hash(i, 0, 10) * TAU;
    ctx.globalAlpha = 1 - ph; ctx.fillStyle = i % 2 ? '#fff' : '#000';
    ctx.fillRect(Math.round((x + Math.cos(a) * (rad + 6 + ph * 26)) / 3) * 3, Math.round((y + Math.sin(a) * (rad + 6 + ph * 26)) / 3) * 3, 3, 3);
  }
  ctx.globalAlpha = 1;
}

function drawAbilityButton() {
  const st = abil.state, sw = abil.swirl;
  // empty socket
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.setLineDash([4, 5]); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(BTN[0], BTN[1], 31, 0, TAU); ctx.stroke(); ctx.restore();
  if (st === 'ready') {
    drawPixelAura(BTN[0], BTN[1], 34, 0.8);
    drawButtonBody(false, 1 + 0.04 * Math.sin(time * 5), 0);
    if (abil.flash > 0) { ctx.strokeStyle = `rgba(255,255,255,${abil.flash})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(BTN[0], BTN[1], 32 + (1 - abil.flash) * 40, 0, TAU); ctx.stroke(); }
  } else if (st === 'arming' && sw) {
    const u = clamp(sw.t / (sw.dur * 0.7), 0, 1);
    if (u < 1) { drawPixelAura(BTN[0], BTN[1], 34 * (1 - u), 0.8 * (1 - u)); drawButtonBody(false, 1 - u, u * TAU * 1.5); }
  } else if (st === 'summoning' && sw) {
    const u = clamp((sw.t - sw.dur * 0.55) / (sw.dur * 0.45), 0, 1);
    if (u > 0) drawButtonBody(true, easeOutBack(u), (1 - u) * -TAU);
  } else if (st === 'cooldown') {
    drawButtonBody(true, 1, 0);
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(BTN[0], BTN[1], 35, -HALF, -HALF + TAU * abil.charge / abil.need); ctx.stroke();
    for (let i = 0; i < abil.need; i++) {
      const a = -HALF + (i + 0.5) / abil.need * TAU;
      ctx.fillStyle = i < abil.charge ? '#fff' : 'rgba(255,255,255,.25)';
      ctx.fillRect(BTN[0] + Math.cos(a) * 42 - 2, BTN[1] + Math.sin(a) * 42 - 2, 4, 4);
    }
  }
}

function drawSwirl() {
  const sw = abil.swirl; if (!sw) return;
  for (const p of sw.parts) {
    const u = clamp((sw.t - p.off) / (sw.dur - 0.2), 0, 1); if (u <= 0 || u >= 1) continue;
    const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const cx = sw.from[0] + (sw.to[0] - sw.from[0]) * e, cy = sw.from[1] + (sw.to[1] - sw.from[1]) * e;
    const r = p.r0 * Math.sin(Math.PI * Math.max(e, 0.08)) + 2, a = p.a0 + e * TAU * 2.4 * p.spin;
    const sz = p.s * (1 - 0.4 * e);
    ctx.fillStyle = p.c; ctx.fillRect(Math.round((cx + Math.cos(a) * r) / 3) * 3, Math.round((cy + Math.sin(a) * r) / 3) * 3, sz, sz);
  }
}

// ---------- update ----------
function update(dt) {
  time += dt;
  heartT = Math.max(0, heartT - dt * 1.5);
  updateAbility(dt);
  if (updateFx(dt)) return;                               // ability hit-stop freeze
  dt *= tscale;
  if (state === 'impact') {
    impactT = Math.max(0, impactT - dt);
    const el = IMPACT_TOTAL - impactT;
    if (el < hitstopLen()) return;                         // frozen impact frame
    if (finale) {
      if (!exploded) {
        exploded = true; shake = 30;
        if (tgt) { breakTarget(tgt, 2.2); tgt = null; }
        for (const f of flying) shatterKnife(f.y); flying = [];
        burst(CX, impactY, 50, ['#ffffff', '#dddddd'], 900, 0, 6, 0.8);
      }
      dt *= 0.25;                                          // heavy slow-mo until the screen breaks
      if (el >= FINAL_SNAP && !snapReq) { snapReq = true; shake = 0; }
    }
    else if (el < HITSTOP + 0.3) dt *= 0.3;                // slow-mo
    gray = finale || el < GRAY_HOLD ? 1 : clamp(1 - (el - GRAY_HOLD) / (IMPACT_TOTAL - GRAY_HOLD), 0, 1);
    if (!finale && el >= GRAY_HOLD && !unfrozen) { unfrozen = true; sfx.unfreeze(); }
    if (impactT <= 0) {
      gray = 0; frac = null;
      if (lives > 0) state = 'play';
      else { state = 'dying'; overT = 0.4; }
    }
  }
  const t = tgt;
  if (t && state !== 'rewind') {
    t.t += dt;
    t.pop = Math.min(1, t.pop + dt / 0.35);
    t.rot += t.pat(t.t) * dt;
    t.hit = Math.max(0, t.hit - dt * 7);
    emitSmoke(t, dt);
  }
  updateSmoke(dt);
  readyT = Math.max(0, readyT - dt);

  for (const k of flying) {
    if (k.hold) continue;
    let move = SPEED * dt * (k.fast || 1);
    while (move > 0 && !k.done && !k.hold) { const st = Math.min(8, move); move -= st; k.y -= st; stepKnife(k); }
  }
  flying = flying.filter(k => !k.done);
  if (state === 'play' && knivesLeft === 0 && flying.length === 0) clearStage();

  for (const d of debris) { if (d.kind === 'shard' || d.kind === 'glass') d.vx *= 1 - dt * 1.5; d.x += d.vx * dt; d.y += d.vy * dt; d.vy += (d.kind === 'half' ? 700 : 1500) * dt; d.rot += d.vr * dt; }
  for (const r of rings) r.t += dt;
  rings = rings.filter(r => r.t < r.max);
  debris = debris.filter(d => d.y < H + 220 && d.x > -220 && d.x < W + 220);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; p.rot += p.vr * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);

  shake = Math.max(0, shake - dt * 40);
  banner.t = Math.max(0, banner.t - dt);

  if (state === 'dying') { overT -= dt; if (overT <= 0) { state = 'over'; overT = 0.6; sfx.over(); } }
  else if (state === 'over') { overT = Math.max(0, overT - dt); overAge += dt; }
  else if (state === 'rewind') {
    rewindT += dt;
    if (!rewFlashed && rewindT >= REW_FLASH) { rewFlashed = true; pieces = []; sfx.flash(); buzz(20); }
    if (!rewSwitched && rewindT >= REW_SWITCH) { rewSwitched = true; makePopup(); sfx.lightSwitch(); shake = 6; buzz([30, 50, 15, 40, 15]); }
    if (rewindT >= REW_BREAK) { shatterPopup(); sfx.popBreak(); shake = 10; state = 'play'; readyT = 0.25; buzz(25); }
  }
  else if (state === 'clearing') { clearT -= dt; if (clearT <= 0) { stage++; newStage(); } }
  updatePieces(dt);
}

// ---------- drawing ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// knife in local space: tip at (0,0), extends toward +y
function drawKnife() {
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.quadraticCurveTo(7, 16, 6.5, 58); ctx.lineTo(-5.5, 58); ctx.lineTo(-5.5, 20); ctx.quadraticCurveTo(-4, 8, 0, 0);
  ctx.closePath();
  const g = ctx.createLinearGradient(-6, 0, 7, 0);
  g.addColorStop(0, '#8e98a6'); g.addColorStop(0.5, '#f4f7fb'); g.addColorStop(1, '#aeb8c4');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(1, 6); ctx.quadraticCurveTo(5, 18, 4.5, 56); ctx.stroke();
  ctx.fillStyle = '#3b3f4a'; rr(-10, 57, 20, 7, 3); ctx.fill();
  const hg = ctx.createLinearGradient(-6.5, 0, 6.5, 0);
  hg.addColorStop(0, '#9b2f22'); hg.addColorStop(0.45, '#e2604a'); hg.addColorStop(1, '#8a281c');

    const xs = poly.map(p => p[0]), ys = poly.map(p => p[1]);
    const bx = Math.max(sx, Math.floor(Math.min(...xs))), by = Math.max(sy, Math.floor(Math.min(...ys)));
    const bw = Math.min(sx + src.width, Math.ceil(Math.max(...xs))) - bx, bh = Math.min(sy + src.height, Math.ceil(Math.max(...ys))) - by;
    if (bw <= 1 || bh <= 1) continue;
    const c = document.createElement('canvas'); c.width = bw; c.height = bh;
    const cx2 = c.getContext('2d');
    cx2.translate(-bx, -by); cx2.beginPath(); poly.forEach((p, q) => cx2[q ? 'lineTo' : 'moveTo'](p[0], p[1])); cx2.closePath();
    cx2.save(); cx2.clip(); cx2.drawImage(src, sx, sy); cx2.restore();
    cx2.strokeStyle = '#fff'; cx2.lineWidth = edge; cx2.stroke();
    const mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
    out.push({ c, j, ox: bx - mx, oy: by - my, x: mx, y: my, hx: mx, hy: my, r: Math.hypot(bw, bh) / 2, rot: 0, vr: 0, vx: 0, vy: 0, age: 0, delay: 0 });
  }
  return out;
}

function launch(pcs, gcx, gcy, k, lo, hi, stagger) {
  for (const p of pcs) {
    let dx = p.x - gcx, dy = p.y - gcy; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    const sp = rand(lo, hi) * k;
    p.vx = dx * sp + rand(-80, 80) * k; p.vy = dy * sp - rand(150, 450) * k;
    p.vr = rand(-5, 5) * (p.j < 3 ? 2 : 1); p.delay = p.j * stagger;
  }
}

function updatePieces(dt) {
  const g = 2600 * dpr * scale;
  for (const p of pieces) {
    p.age += dt;
    if (p.home || p.age < p.delay) continue;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += g * dt; p.rot += p.vr * dt;
  }
  pieces = pieces.filter(p => p.home || (p.y - p.r < cv.height * 1.2 && p.x + p.r > -cv.width * 0.2 && p.x - p.r < cv.width * 1.2));
}

function shatterScreen() {
  const snap = thresholdSnapshot();
  if (!snap) { pieces = []; return; }
  const k = dpr * scale, icx = dpr * (ox + CX * scale), icy = dpr * (oy + impactY * scale);
  pieces = cutPieces(snap, 0, 0, gridFrac, icx, icy, k, 2.5 * dpr);
  launch(pieces, icx, icy, k, 350, 900, 0.025);
}

function startRewind() {
  startGame();
  state = 'rewind'; rewindT = 0; needRewindSnap = true; rewFlashed = false; rewSwitched = false; popCanvas = null;
  banner.t = 0; tgt.pop = 1; readyT = 0; pieces = [];
  sfx.rewind();
}

function buildRewindPieces() {
  const snap = thresholdSnapshot();
  if (!snap) { pieces = []; return; }
  const k = dpr * scale, gcx = dpr * (ox + CX * scale), gcy = dpr * (oy + CY * scale);
  pieces = cutPieces(snap, 0, 0, makeGridFracture(), gcx, gcy, k, 2.5 * dpr);
  const far = Math.max(cv.width, cv.height);
  for (const p of pieces) {
    let dx = p.hx - gcx, dy = p.hy - gcy; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    const dist = far * rand(0.7, 1.2);
    p.home = true; p.sx = p.hx + dx * dist + rand(-0.15, 0.15) * far; p.sy = p.hy + dy * dist + rand(0, 0.3) * far;
    p.rot0 = rand(-6, 6); p.dur = 0.42; p.delay = (8 - p.j) * 0.045 + rand(0, 0.05);
  }
}

const POP_W = 260, POP_H = 104;
function makePopup() {
  const k = dpr * scale, m = 12, c = document.createElement('canvas');
  c.width = Math.ceil((POP_W + m * 2) * k); c.height = Math.ceil((POP_H + m * 2) * k);
  const g = c.getContext('2d'), saved = ctx;
  g.scale(k, k); g.translate(m, m);
  // hazard-striped steel sign
  g.save(); g.beginPath(); g.rect(0, 0, POP_W, POP_H); g.clip();
  g.fillStyle = '#ffc61a'; g.fillRect(0, 0, POP_W, POP_H);
  g.fillStyle = '#111'; for (let x = -POP_H; x < POP_W + POP_H; x += 26) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 13, 0); g.lineTo(x + 13 - POP_H, POP_H); g.lineTo(x - POP_H, POP_H); g.closePath(); g.fill(); }
  g.restore();
  const pg = g.createLinearGradient(0, 12, 0, POP_H - 12); pg.addColorStop(0, '#3a3e46'); pg.addColorStop(1, '#1b1d22');
  g.fillStyle = pg; g.fillRect(12, 12, POP_W - 24, POP_H - 24);
  g.fillStyle = '#8b919b'; for (const [x, y] of [[20, 20], [POP_W - 20, 20], [20, POP_H - 20], [POP_W - 20, POP_H - 20]]) { g.beginPath(); g.arc(x, y, 3, 0, TAU); g.fill(); }
  g.font = '900 60px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = 'rgba(255,214,90,.8)'; g.shadowBlur = 18; g.fillStyle = '#fff';
  if ('letterSpacing' in g) g.letterSpacing = '8px';
  g.fillText('START', POP_W / 2 + 4, POP_H / 2 + 3);
  popCanvas = c;
  popPos = [dpr * (ox + CX * scale), dpr * (oy + 455 * scale)];
}

function shatterPopup() {
  if (!popCanvas) return;
  const k = dpr * scale, [px, py] = popPos;
  const shards = cutPieces(popCanvas, Math.round(px - popCanvas.width / 2), Math.round(py - popCanvas.height / 2), makeGrid(9, [0, 22, 55, 100, 160, 240]), px, py, k, 1.2 * dpr);
  launch(shards, px, py, k, 250, 700, 0.012);
  pieces = shards; popCanvas = null;
  for (let i = 0; i < 14; i++) {
    const a = rand(TAU), sp = rand(200, 600), pts = [];
    for (let j = 0; j < 3; j++) { const r = rand(3, 10), ang = j / 3 * TAU + rand(-0.5, 0.5); pts.push([Math.cos(ang) * r, Math.sin(ang) * r]); }
    debris.push({ kind: 'glass', x: CX + rand(-60, 60), y: 455 + rand(-20, 20), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200, rot: rand(TAU), vr: rand(-14, 14), pts });
  }
}

function drawRewind() {
  const t = rewindT;
  if (needRewindSnap) { drawScene(); buildRewindPieces(); needRewindSnap = false; }
  let f;
  if (t < REW_FLASH) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
    for (const p of pieces) {
      const u = clamp((t - p.delay) / p.dur, 0, 1), e = 1 - Math.pow(1 - u, 3);
      ctx.save(); ctx.translate(p.sx + (p.hx - p.sx) * e, p.sy + (p.hy - p.sy) * e); ctx.rotate(p.rot0 * (1 - e));
      ctx.drawImage(p.c, p.ox, p.oy); ctx.restore();
    }
    f = 'grayscale(1)';
  } else {
    drawScene();
    const s = t - REW_SWITCH;
    const lit = s >= 0 && !(s >= 0.05 && s < 0.11) && !(s >= 0.15 && s < 0.19);   // fluorescent flicker on
    f = lit ? 'none' : 'grayscale(1) contrast(40)';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const fa = clamp(1 - (t - REW_FLASH) / 0.3, 0, 1);
    if (fa > 0) { ctx.fillStyle = `rgba(255,255,255,${fa})`; ctx.fillRect(0, 0, cv.width, cv.height); }
    if (s >= 0 && popCanvas) {
      const u = clamp(s / 0.2, 0, 1), sc = 0.4 + 0.6 * easeOutBack(u), jit = s < 0.3 ? (0.3 - s) * 20 * dpr : 0;
      ctx.save(); ctx.translate(popPos[0] + rand(-jit, jit), popPos[1] + rand(-jit, jit)); ctx.scale(sc, sc);
      ctx.drawImage(popCanvas, -popCanvas.width / 2, -popCanvas.height / 2); ctx.restore();
    }
  }
  if (cv.style.filter !== f) cv.style.filter = f;
}

function drawPieces() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const p of pieces) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.drawImage(p.c, p.ox, p.oy); ctx.restore();
  }
}


// losing screen: pure black & white, elements slam in fast
function drawOverScreen() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  const t = overAge;
  // spinning speed rays
  ctx.save(); ctx.translate(CX, 300); ctx.rotate(t * 0.15); ctx.fillStyle = 'rgba(255,255,255,.07)';
  for (let i = 0; i < 18; i++) { ctx.rotate(TAU / 18); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(900, -50); ctx.lineTo(900, 50); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  // leftover cracks
  if (gridFrac) { ctx.save(); ctx.translate(CX, impactY); gridPath(gridFrac, 1500); ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore(); }
  const slam = (delay, y, fn) => {
    const u = clamp((t - delay) / 0.16, 0, 1); if (u <= 0) return;
    const sc = 1 + 1.4 * Math.pow(1 - u, 3);
    ctx.save(); ctx.globalAlpha = u; ctx.translate(CX, y); ctx.scale(sc, sc); ctx.translate(-CX, -y); fn(); ctx.restore();
  };
  slam(0.05, 212, () => {
    ctx.fillStyle = '#fff'; ctx.save(); ctx.translate(CX, 212); ctx.rotate(-0.06); ctx.fillRect(-W, -34, W * 2, 68); ctx.restore();
    ctx.save(); ctx.translate(CX, 212); ctx.rotate(-0.06); text('OUT OF LIVES', 0, 2, 44, '#000', 'center', 900); ctx.restore();
  });
  slam(0.18, 278, () => {
    for (let i = 0; i < MAX_LIVES; i++) ctx.drawImage(HEART_IMG.white, CX + (i - 1) * 56 - 22, 274 - 26, 44, 53);
  });
  slam(0.26, 352, () => {
    const shown = Math.round(score * clamp((t - 0.26) / 0.45, 0, 1));
    text(String(shown), CX, 352, 96, '#fff', 'center', 900);
  });
  slam(0.36, 414, () => text(`STAGE ${stage}  ·  ${apples} APPLE${apples === 1 ? '' : 'S'}`, CX, 414, 16, '#fff', 'center', 700));
  slam(0.44, 457, () => {
    if (newBest) { ctx.fillStyle = '#fff'; rr(CX - 80, 438, 160, 36, 4); ctx.fill(); text('NEW BEST!', CX, 457, 20, '#000', 'center', 900); }
    else text('BEST  ' + best, CX, 457, 20, '#fff', 'center', 800);
  });
  if (overT <= 0) { ctx.save(); ctx.globalAlpha = 0.55 + 0.45 * Math.sin(time * 5); text('TAP TO RETRY', CX, 560, 26, '#fff'); ctx.restore(); }
}

function drawImpact() {
  const el = IMPACT_TOTAL - impactT;
  if (el < hitstopLen()) {
    // impact frame: speed lines bursting from the hit point
    ctx.save(); ctx.translate(CX, impactY);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-W, -H * 2, W * 3, H * 4);
    ctx.fillStyle = '#fff';
    for (const l of impactLines) {
      ctx.save(); ctx.rotate(l.a); ctx.beginPath();
      ctx.moveTo(l.r0, 0); ctx.lineTo(l.r1, -l.w); ctx.lineTo(l.r1, l.w); ctx.closePath(); ctx.fill(); ctx.restore();
    }
    ctx.lineWidth = 5; ctx.strokeStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, 26 + el * 400, 0, TAU); ctx.stroke();
    ctx.restore();
  } else if (el < hitstopLen() + 0.1) {
    ctx.fillStyle = `rgba(255,255,255,${0.5 * (1 - (el - hitstopLen()) / 0.1)})`; ctx.fillRect(-W, -H, W * 3, H * 3);
  }
}

function drawBanner() {
  if (banner.t <= 0) return;
  const a = clamp(banner.t / 0.3, 0, 1);
  ctx.save(); ctx.globalAlpha = a;
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 12;
  text(banner.text, CX, 470, 46, banner.color);
  if (banner.sub) text(banner.sub, CX, 512, 20, 'rgba(255,255,255,.85)', 'center', 700);
  ctx.restore();
}

function drawMenu() {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 16;
  const g = ctx.createLinearGradient(0, 70, 0, 120);
  g.addColorStop(0, '#fff3c4'); g.addColorStop(1, '#ffb347');
  ctx.font = '900 64px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillStyle = g; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('KNAIFE', CX, 92);
  ctx.restore();
  text('stick every knife · never hit steel', CX, 134, 15, 'rgba(255,255,255,.7)', 'center', 600);
  const p = 0.6 + 0.4 * Math.sin(time * 4);
  ctx.save(); ctx.globalAlpha = p; text('TAP TO PLAY', CX, 450, 28, '#fff'); ctx.restore();
  if (best > 0) text('BEST  ' + best, CX, 492, 18, '#ffd35c', 'center', 700);
  text('tap · click · space', CX, H - 22, 13, 'rgba(255,255,255,.45)', 'center', 600);
}


function drawScene() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const bg = ctx.createLinearGradient(0, 0, 0, cv.height);
  bg.addColorStop(0, '#2b1c52'); bg.addColorStop(1, '#0e0a1c');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, cv.width, cv.height);

  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  if (shake > 0) ctx.translate(rand(-shake, shake) / 2, rand(-shake, shake) / 2);

  const glow = ctx.createRadialGradient(CX, CY, 20, CX, CY, 280);
  glow.addColorStop(0, tgt && tgt.boss ? 'rgba(255,90,110,.16)' : 'rgba(255,200,120,.13)'); glow.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = glow; ctx.fillRect(-W, -H, W * 3, H * 3);

  if (tgt) drawTarget();
  drawSmoke();
  drawFracture(); drawGridFracture();
  if (fx && fx.frac) drawFracAt(fx.frac, fx.x, fx.y, clamp(fx.t / 0.1, 0, 1), clamp(1 - (fx.t - 0.7) / 0.6, 0, 1));
  for (const d of debris) drawDebris(d);
  drawRings();
  for (const k of flying) {
    if (k.ability) drawAbilityKnife(k);
    else { ctx.save(); ctx.translate(CX, k.y); drawKnife(); ctx.restore(); }
  }
  drawSlash();
  if (((state === 'play' || state === 'rewind') && knivesLeft > 0) || state === 'menu') {
    const off = state === 'play' ? (readyT / 0.12) * 40 : 0, ky = KNIFE_Y + Math.min(off, 60);
    if (abil.state === 'armed') drawKnifeAura(ky, 1);
    ctx.save(); ctx.globalAlpha = clamp(1 - readyT / 0.15, 0.2, 1); ctx.translate(CX, ky);
    if (abil.state === 'armed') { ctx.shadowColor = '#fff'; ctx.shadowBlur = 16; }
    drawKnife(); ctx.restore();
  }
  for (const p of parts) {
    ctx.save(); ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); ctx.restore();
  }

  if (state === 'menu') drawMenu();
  else { drawHUD(); drawBanner(); drawAbilityButton(); }
  drawSwirl();
  drawFloaters();
  if (state === 'impact') drawImpact();
  if (fx && fx.t < fx.freeze) drawFxImpactFrame();
  drawScreenHits();
  drawMute();
}

function draw() {
  if (state === 'over') {
    drawOverScreen(); drawPieces();
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy); drawMute();
    if (cv.style.filter !== 'grayscale(1)') cv.style.filter = 'grayscale(1)';
    return;
  }
  if (state === 'rewind') { drawRewind(); return; }
  drawScene();
  const el = IMPACT_TOTAL - impactT;
  // pure two-tone black & white (inverted on the impact frame), easing back to colour
  if (snapReq && state === 'impact') {
    shatterScreen(); snapReq = false;
    state = 'over'; overAge = 0; overT = 0.9; gray = 0; frac = null;
    sfx.screenBreak(); buzz([60, 30, 60]);
    return;   // the next frame draws the losing screen under the falling pieces
  }
  drawRipple();
  const f = fxFilter ? fxFilter : state === 'impact' && el < hitstopLen() ? 'grayscale(1) contrast(40) invert(1)'
    : gray > 0 ? `grayscale(${gray.toFixed(3)}) contrast(${(1 + 39 * Math.pow(gray, 3)).toFixed(3)})` : 'none';
  if (cv.style.filter !== f) cv.style.filter = f;
  if (pieces.length) drawPieces();
}

// ---------- input ----------
function toVirtual(e) { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left - ox) / scale, (e.clientY - b.top - oy) / scale]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const [x, y] = toVirtual(e);
  if (Math.hypot(x - (W - 34), y - 34) < 24) { muted = !muted; save('knaife.muted', muted); ac(); return; }
  if ((state === 'play' || state === 'fx') && Math.hypot(x - BTN[0], y - BTN[1]) < 40) { ac(); activateAbility(); return; }
  action();
});
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp') { e.preventDefault(); action(); }
  else if (e.code === 'KeyM') { muted = !muted; save('knaife.muted', muted); }
  else if (e.code === 'KeyE' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') { ac(); activateAbility(); }
});

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
menuTarget();
requestAnimationFrame(frame);
// test hook
window.__knaife = { get lives() { return lives; }, get state() { return state; }, get score() { return score; }, get stage() { return stage; }, get knivesLeft() { return knivesLeft; } };
</script>
</body>
</html>
